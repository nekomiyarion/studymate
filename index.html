<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Mate</title>
    <link rel="icon" href="./studymate.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary-color)',
                        'primary-hover': 'var(--primary-hover)',
                        'primary-light': 'var(--primary-light)',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --primary-color: #2563eb; 
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
        }

        [v-cloak] { display: none; }
        .completed-task { text-decoration: line-through; color: #9ca3af; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        .tutorial-highlight { 
            position: relative; z-index: 50; 
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.7); 
            background-color: white; pointer-events: none;
        }
        .dark .tutorial-highlight { background-color: #1e293b; }

        @keyframes ring {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        .animate-ring { animation: ring 0.3s infinite; }
        
        @keyframes blink { 50% { opacity: 0.5; } }
        .animate-blink { animation: blink 1.5s infinite; }

        /* ▼▼▼ フラッシュ通知用のアニメーション（修正版） ▼▼▼ */
        /* 白ではなく、暗いグレーでゆっくり明滅するように変更 */
        @keyframes flash-screen {
            0%, 100% { background-color: rgba(0,0,0,0.9); }
            50% { background-color: rgba(70, 70, 70, 0.9); } 
        }
        .animate-flash-screen { animation: flash-screen 1.5s infinite ease-in-out; }
        /* ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */

        .modal-enter-active, .modal-leave-active { transition: opacity 0.3s; }
        .modal-enter-from, .modal-leave-to { opacity: 0; }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-up { animation: slideUp 0.3s ease-out; }

        /* スタンバイモード用のフォント設定 */
        .font-standby {
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        /* ========== タブ切り替えアニメーション ========== */
        /* fade */
        .tab-fade-enter-active { 
            transition: opacity 0.22s ease, transform 0.22s ease; 
            will-change: opacity, transform;
        }
        .tab-fade-leave-active { 
            transition: opacity 0.18s ease, transform 0.18s ease; 
            position: absolute; width: 100%;
            will-change: opacity, transform;
        }
        .tab-fade-enter-from  { opacity: 0; transform: translateY(6px); }
        .tab-fade-leave-to    { opacity: 0; transform: translateY(-6px); }

        /* slide */
        .tab-slide-enter-active { transition: opacity 0.28s cubic-bezier(.4,0,.2,1), transform 0.28s cubic-bezier(.4,0,.2,1); }
        .tab-slide-leave-active { transition: opacity 0.2s cubic-bezier(.4,0,.2,1), transform 0.2s cubic-bezier(.4,0,.2,1); position: absolute; width: 100%; }
        .tab-slide-enter-from  { opacity: 0; transform: translateX(32px); }
        .tab-slide-leave-to    { opacity: 0; transform: translateX(-32px); }

        /* zoom */
        .tab-zoom-enter-active { 
            transition: opacity 0.22s ease, transform 0.22s cubic-bezier(.25, .46, .45, .94); 
            will-change: opacity, transform;
        }
        .tab-zoom-leave-active { 
            transition: opacity 0.16s ease, transform 0.16s ease; 
            position: absolute; width: 100%;
            will-change: opacity, transform;
        }
        .tab-zoom-enter-from  { opacity: 0; transform: scale(0.97); }
        .tab-zoom-leave-to    { opacity: 0; transform: scale(1.01); }

        /* none */
        .tab-none-enter-active, .tab-none-leave-active { transition: none; }
        .tab-none-enter-from, .tab-none-leave-to { opacity: 1; }

        .tab-wrapper { position: relative; width: 100%; }
        /* ================================================= */

        /* ========== スマホ横画面レイアウト ========== */
        .landscape-mobile-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            height: 100%;
            padding: 8px 4px;
            gap: 4px;
        }
        .landscape-mobile-nav .nav-icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 18px;
            transition: all 0.15s;
            gap: 2px;
        }
        /* ============================================ */
    </style>
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Study Mate">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">

    <!-- Service Worker 登録 + アップデート通知 UI -->
    <script>
    (function() {
        if (!('serviceWorker' in navigator)) return;

        navigator.serviceWorker.register('./service-worker.js').then((reg) => {
            console.log('[PWA] Service Worker registered:', reg.scope);
            setTimeout(() => checkForUpdate(reg), 3000);
            reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        showUpdateBanner();
                    }
                });
            });
        }).catch(err => console.warn('[PWA] SW registration failed:', err));

        function checkForUpdate(reg) {
            if (!navigator.onLine) return;
            if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'CHECK_UPDATE' });
            }
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'UPDATE_RESULT') {
                    if (event.data.hasUpdate) showUpdateBanner();
                }
            });
        }

        function showUpdateBanner() {
            if (document.getElementById('pwa-update-banner')) return;
            const banner = document.createElement('div');
            banner.id = 'pwa-update-banner';
            banner.style.cssText = `
                position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
                background: #1e40af; color: white; padding: 12px 20px;
                border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                display: flex; align-items: center; gap: 12px;
                z-index: 9999; font-family: sans-serif; font-size: 14px;
                max-width: 90vw;
            `;
            banner.innerHTML = `
                <span>🎉 アップデートがあります！</span>
                <button onclick="location.reload()" style="
                    background: white; color: #1e40af; border: none;
                    padding: 6px 14px; border-radius: 8px; font-weight: bold;
                    cursor: pointer; font-size: 13px;
                ">今すぐ更新</button>
                <button onclick="this.parentElement.remove()" style="
                    background: transparent; color: rgba(255,255,255,0.7);
                    border: none; cursor: pointer; font-size: 18px; line-height: 1;
                ">×</button>
            `;
            document.body.appendChild(banner);
            setTimeout(() => banner && banner.remove(), 10000);
        }
    })();
    </script>

</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="app" v-cloak class="h-full flex relative" :class="(isMobile && isLandscape) ? 'flex-row' : 'flex-col md:flex-row'">
        
        <!-- ================= LOADING SCREEN ================= -->
        <div v-if="isAuthLoading" class="fixed inset-0 z-[100] bg-gray-50 dark:bg-gray-900 flex items-center justify-center">
            <div class="flex flex-col items-center">
                <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-primary mb-4"></div>
                <p class="text-gray-500 font-bold animate-pulse">Loading...</p>
            </div>
        </div>

        <!-- ================= Login / Guest Landing ================= -->
        <div v-else-if="!user && !isGuestMode" class="w-full h-full flex flex-col items-center justify-center bg-gray-50 dark:bg-gray-900 p-6 z-50 absolute inset-0 overflow-y-auto">
            <img src="./studymate.png" onerror="this.style.display='none'" alt="Logo" class="w-24 h-24 mb-4 rounded-2xl shadow-lg">
            <h1 class="text-5xl font-bold mb-2 text-primary tracking-tighter text-center transition-colors">Study Mate</h1>
            <p class="text-gray-500 dark:text-gray-400 mb-8 text-center">勉強も、休憩も、これひとつで。</p>

            <!-- メール認証フォーム（表示/非表示切り替え） -->
            <div v-if="showEmailAuth" class="w-full max-w-sm bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 mb-4">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-lg dark:text-white">{{ emailLoginForm.mode === 'login' ? 'メールでログイン' : 'アカウント作成' }}</h3>
                    <button @click="showEmailAuth = false" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3">
                    <input type="email" v-model="emailLoginForm.email" placeholder="メールアドレス"
                        class="w-full border dark:border-gray-600 rounded-lg px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                    <input type="password" v-model="emailLoginForm.password" placeholder="パスワード（6文字以上）"
                        class="w-full border dark:border-gray-600 rounded-lg px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white"
                        @keydown.enter="loginWithEmail">
                    <input v-if="emailLoginForm.mode === 'register'" type="password" v-model="emailLoginForm.confirm" placeholder="パスワード確認"
                        class="w-full border dark:border-gray-600 rounded-lg px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                    <p v-if="emailAuthError" class="text-xs text-red-500 bg-red-50 dark:bg-red-900/20 px-3 py-2 rounded-lg">{{ emailAuthError }}</p>
                    <button @click="loginWithEmail" class="w-full py-3 bg-primary text-white rounded-xl font-bold text-sm hover:bg-primary-hover transition shadow">
                        {{ emailLoginForm.mode === 'login' ? 'ログイン' : 'アカウントを作成' }}
                    </button>
                    <div class="flex justify-between text-xs text-primary">
                        <button @click="emailLoginForm.mode = emailLoginForm.mode === 'login' ? 'register' : 'login'; emailAuthError=''" class="hover:underline">
                            {{ emailLoginForm.mode === 'login' ? '新規アカウントを作成' : 'ログインに戻る' }}
                        </button>
                        <button v-if="emailLoginForm.mode === 'login'" @click="resetPassword" class="hover:underline">パスワードを忘れた</button>
                    </div>
                </div>
            </div>

            <div v-else class="space-y-3 w-full max-w-sm">
                <button @click="login" class="w-full px-8 py-4 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl shadow-lg hover:bg-primary-light dark:hover:bg-gray-700 flex items-center justify-center gap-4 font-bold text-gray-700 dark:text-gray-200 transition transform hover:scale-105">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6">
                    <span>Googleでログイン</span>
                </button>
                <button @click="showEmailAuth = true; emailLoginForm.mode = 'login'; emailAuthError = ''" class="w-full px-8 py-4 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl shadow-lg hover:bg-primary-light dark:hover:bg-gray-700 flex items-center justify-center gap-4 font-bold text-gray-700 dark:text-gray-200 transition transform hover:scale-105">
                    <i class="fa-solid fa-envelope text-primary text-xl"></i>
                    <span>メールアドレスでログイン</span>
                </button>
                <button @click="startGuest" class="w-full px-8 py-4 bg-gray-800 dark:bg-gray-700 text-white rounded-xl shadow-lg hover:bg-gray-700 dark:hover:bg-gray-600 flex items-center justify-center gap-4 font-bold transition transform hover:scale-105">
                    <i class="fa-solid fa-user-secret"></i>
                    <span>ゲストとして利用する</span>
                </button>
            </div>

            <div class="mt-6 flex gap-6 text-xs text-gray-400">
                <a href="https://nekomiyarion.github.io/studymate/terms.html" target="_blank" class="hover:text-primary underline">利用規約</a>
                <a href="https://nekomiyarion.github.io/studymate/privacy.html" target="_blank" class="hover:text-primary underline">プライバシーポリシー</a>
            </div>
            <p class="mt-3 text-xs text-gray-300 max-w-sm text-center">※ゲストモードの記録は、あとでログインした際にアカウントへ統合されます。</p>
            <div class="absolute bottom-4 right-4">
                <button @click="hardReset" class="text-xs text-gray-300 underline hover:text-red-500">不具合時リセット</button>
            </div>
        </div>

        <!-- ================= Main App ================= -->
        <template v-else>
            
            <!-- Navigation (スタンバイモード時は非表示) -->
            <nav v-show="!isStandbyMode" 
                 :class="isMobile && isLandscape 
                    ? 'w-14 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col h-full flex-shrink-0 z-40'
                    : 'md:w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col md:h-full flex-shrink-0 order-2 md:order-1 fixed md:relative bottom-0 w-full md:w-auto z-40 h-20 md:h-auto shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] md:shadow-none pb-safe'">
                <!-- PCサイドバーロゴ -->
                <div class="hidden md:flex items-center gap-3 p-6 border-b border-gray-100 dark:border-gray-700">
                    <img src="./studymate.png" onerror="this.style.display='none'" class="w-8 h-8 rounded-lg">
                    <div class="flex-1 min-w-0">
                        <span class="font-bold text-xl tracking-tight">Study Mate</span>
                        <div v-if="!isOnline" class="flex items-center gap-1 mt-0.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-orange-400 animate-pulse"></span>
                            <span class="text-xs text-orange-500 font-medium">オフライン</span>
                        </div>
                    </div>
                </div>

                <!-- スマホ横画面：縦アイコンナビ（動的） -->
                <div v-if="isMobile && isLandscape" class="landscape-mobile-nav flex-1">
                    <button v-for="tab in visibleTabs" :key="tab.id"
                        @click="tab.id === 'report' ? (loadWeeklyReport(), currentTab = 'report') : currentTab = tab.id"
                        class="nav-icon-btn w-full"
                        :class="currentTab === tab.id ? 'text-primary bg-primary-light dark:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i :class="'fa-solid ' + tab.icon"></i>
                    </button>
                </div>

                <!-- 通常モード（スマホ縦 or PC）ナビ（動的） -->
                <div v-else class="flex md:flex-col justify-around md:justify-start h-full md:p-4 md:gap-2 items-center md:items-stretch">
                    <button v-for="tab in visibleTabs" :key="tab.id"
                        @click="tab.id === 'report' ? (loadWeeklyReport(), currentTab = 'report') : currentTab = tab.id"
                        class="nav-btn p-2 rounded-xl flex flex-col md:flex-row items-center gap-1 md:gap-3 md:px-4 md:py-3 transition"
                        :class="currentTab === tab.id ? 'text-primary md:bg-primary-light dark:md:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i :class="'fa-solid ' + tab.icon + ' text-xl md:text-lg'"></i>
                        <span class="text-[10px] md:text-sm font-bold">{{ tab.label }}</span>
                    </button>
                </div>
            </nav>

            <!-- Content Area -->
            <!-- オフラインバナー（スマホ縦向きのみ、ナビバーの上） -->
            <div v-if="!isOnline && isMobile && !isLandscape"
                 class="fixed bottom-20 left-0 right-0 z-30 flex justify-center pointer-events-none"
                 style="bottom: calc(5rem + env(safe-area-inset-bottom, 0px));">
                <div class="flex items-center gap-2 bg-orange-500 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-lg">
                    <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                    オフライン — データはローカルに保存中
                </div>
            </div>
            <main class="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-900 p-4 md:p-8 order-1 md:order-2 relative transition-colors duration-300"
                  :class="[
                      isStandbyMode ? '!p-0 !pb-0 !overflow-hidden' : '',
                      isMobile && isLandscape ? 'pb-4 pt-3 px-3' : 'md:pb-8'
                  ]"
                  :style="!isStandbyMode && !(isMobile && isLandscape) ? { paddingBottom: 'calc(5rem + env(safe-area-inset-bottom, 0px) + 8px)' } : {}">
                <div class="tab-wrapper">
                <transition :name="'tab-' + tabAnimation">
                <div :key="currentTab" class="w-full">
                
                <!-- 1. TIMER TAB (Modified for Standby Mode) -->
                <div v-if="currentTab === 'timer'" 
                     class="mx-auto flex flex-col transition-all duration-500"
                     :class="isStandbyMode ? 'fixed inset-0 z-[200] bg-black text-white p-0 justify-center' : 'max-w-4xl pb-8'">
                    
                    <!-- Header (通常時のみ表示) -->
                    <header v-if="!isStandbyMode" class="mb-4 md:mb-10 flex items-center gap-2 min-w-0">
                        <!-- タイトル（スマホでは小さめ） -->
                        <h2 class="text-lg md:text-2xl font-bold whitespace-nowrap flex-shrink-0">今日の学習</h2>
                        <!-- タイマーモード切り替え（タイマー停止中のみ表示） -->
                        <div v-if="!isTimerRunning && !isPaused" class="flex bg-white dark:bg-gray-800 border dark:border-gray-700 rounded-full p-0.5 shadow-sm flex-shrink-0">
                            <button @click="changeTimerMode('countup')"
                                class="flex items-center gap-0.5 px-2 py-1 rounded-full font-bold transition"
                                :class="timerMode==='countup' ? 'bg-primary text-white shadow-sm text-[11px]' : 'text-gray-400 hover:text-gray-600 text-[11px]'">
                                <i class="fa-solid fa-arrow-up text-[9px]"></i>
                                <span class="hidden sm:inline">UP</span>
                            </button>
                            <button @click="changeTimerMode('countdown')"
                                class="flex items-center gap-0.5 px-2 py-1 rounded-full font-bold transition"
                                :class="timerMode==='countdown' ? 'bg-primary text-white shadow-sm text-[11px]' : 'text-gray-400 hover:text-gray-600 text-[11px]'">
                                <i class="fa-solid fa-arrow-down text-[9px]"></i>
                                <span class="hidden sm:inline">DOWN</span>
                            </button>
                        </div>
                        <!-- 時刻・日付 + 全画面ボタン（右寄せ） -->
                        <div class="flex-1 flex justify-end items-center gap-1.5 min-w-0">
                            <div class="flex items-center gap-1 text-xs font-mono text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-800 px-2 py-1.5 rounded-full shadow-sm border dark:border-gray-700 min-w-0 flex-shrink-0">
                                <i class="fa-regular fa-clock text-[9px] flex-shrink-0"></i>
                                <span class="font-bold tabular-nums flex-shrink-0">{{ currentTimeFormatted }}</span>
                                <span class="text-gray-300 dark:text-gray-600 flex-shrink-0">|</span>
                                <span class="flex-shrink-0">{{ new Date().toLocaleDateString('ja-JP', {month:'numeric', day:'numeric'}) }}</span>
                            </div>
                            <!-- 全画面ボタン（スマホのみ・縦向き・スタンバイ以外） -->
                            <button v-if="isMobile && !isFullscreen && !isStandbyMode && !isLandscape"
                                @click="toggleFullscreen"
                                class="flex-shrink-0 bg-gray-700/80 dark:bg-gray-600/80 backdrop-blur-sm text-white p-1.5 rounded-full shadow transition active:scale-95 md:hidden"
                                title="全画面">
                                <i class="fa-solid fa-expand text-[11px]"></i>
                            </button>
                        </div>
                    </header>

                    <div class="flex-1 flex flex-col items-center justify-center"
                         :class="isStandbyMode ? 'w-full h-full gap-0' : (isMobile && isLandscape) ? 'gap-3 overflow-y-auto' : 'gap-6 md:gap-12 md:flex-row md:items-start'">
                        
                        <!-- Left: Display Area -->
                        <div class="flex flex-col items-center justify-center relative transition-all duration-500"
                             :class="isStandbyMode ? 'w-full h-full' :
                                     (isMobile && isLandscape) ? 'w-full py-2 px-2' :
                                     'w-full md:w-1/2 py-6 bg-white dark:bg-gray-800 md:bg-transparent md:dark:bg-transparent rounded-3xl md:rounded-none shadow-sm md:shadow-none border md:border-none border-gray-100 dark:border-gray-700'">
                            
                            <!-- Status Indicators -->
                            <div v-if="breakMode && isTimerRunning" 
                                 class="font-bold px-3 py-1 rounded-full text-sm animate-pulse z-10"
                                 :class="isStandbyMode ? 'absolute top-6 right-6 bg-green-900/50 text-green-400' : 'absolute top-0 text-green-500 bg-green-50 dark:bg-green-900/30'">
                                <i class="fa-solid fa-mug-hot mr-1"></i>休憩中
                            </div>
                            <div v-else-if="timerMode === 'countdown' && isTimerRunning" 
                                 class="font-bold px-3 py-1 rounded-full text-sm z-10"
                                 :class="isStandbyMode ? 'absolute top-6 right-6 bg-gray-800/50 text-primary-light' : 'absolute top-0 text-primary bg-primary-light dark:bg-gray-700'">
                                <i class="fa-solid fa-hourglass-half mr-1"></i>カウントダウン
                            </div>
                            <div v-else-if="isPaused" 
                                 class="font-bold px-3 py-1 rounded-full text-sm animate-blink z-10"
                                 :class="isStandbyMode ? 'absolute top-6 right-6 bg-yellow-900/50 text-yellow-500' : 'absolute top-0 text-yellow-500 bg-yellow-50 dark:bg-yellow-900/30'">
                                <i class="fa-solid fa-pause mr-1"></i>一時停止中
                            </div>

                            <!-- Subject Label -->
                            <p class="font-bold mb-2 transition-all z-10"
                               :class="isStandbyMode ? 'text-gray-500 text-xl absolute top-6 left-8' : 'text-sm text-gray-500 dark:text-gray-400'">
                                {{ isTimerRunning || isPaused ? (breakMode ? 'REST TIME' : currentSubject) : 'Study Total (Excl. Break)' }}
                            </p>
                            
                            <!-- MAIN TIMER DISPLAY -->
                            <div class="font-mono font-bold font-standby tracking-tighter transition-all duration-300 leading-none select-none" 
                                 :class="[
                                    breakMode ? 'text-green-500' : (isPaused ? 'text-yellow-500' : (isStandbyMode ? 'text-white' : 'text-primary')),
                                    isStandbyMode ? 'text-[25vw]' : (isMobile && isLandscape) ? 'text-5xl mb-1' : 'text-7xl md:text-8xl mb-2'
                                 ]">
                                {{ formattedTime }}
                            </div>

                            <!-- REALTIME TOTAL DISPLAY -->
                            <div v-if="isTimerRunning || isPaused" class="flex flex-col items-center mt-2 z-10">
                                <p class="font-mono font-bold transition-colors" 
                                   :class="isStandbyMode ? 'text-gray-500 text-2xl' : 'text-gray-400 dark:text-gray-500 text-lg'">
                                    <span class="text-xs mr-2 opacity-70">TOTAL</span>{{ currentTotalTimeFormatted }}
                                </p>
                            </div>
                            
                            <!-- Controls (Standby時は下部に薄く表示) -->
                            <div v-if="isTimerRunning || isPaused" class="w-full max-w-sm flex flex-col gap-2 z-10"
                                 :class="isStandbyMode ? 'absolute bottom-8 px-12 opacity-30 hover:opacity-100 transition-opacity' : (isMobile && isLandscape) ? 'mt-2' : 'mt-6'">
                                <!-- STOP / PAUSE / RESUME -->
                                <div class="flex gap-3">
                                    <button @click="stopTimer(false)"
                                        class="flex-1 text-white font-bold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2"
                                        :class="[(breakMode ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600'), (isMobile && isLandscape) ? 'py-3 text-base' : 'py-5 text-xl']">
                                        <i class="fa-solid fa-stop"></i><span v-if="!isStandbyMode">STOP</span>
                                    </button>
                                    <button v-if="!isPaused" @click="pauseTimer"
                                        class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-white font-bold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2"
                                        :class="(isMobile && isLandscape) ? 'py-3 text-base' : 'py-5 text-xl'">
                                        <i class="fa-solid fa-pause"></i><span v-if="!isStandbyMode">PAUSE</span>
                                    </button>
                                    <button v-else @click="resumeTimer"
                                        class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2"
                                        :class="(isMobile && isLandscape) ? 'py-3 text-base' : 'py-5 text-xl'">
                                        <i class="fa-solid fa-play"></i><span v-if="!isStandbyMode">RESUME</span>
                                    </button>
                                </div>
                            </div>
                            
                            <p v-if="isTimerRunning && !isStandbyMode" class="text-center mt-3 text-gray-400 text-sm animate-pulse">{{ breakMode ? 'リラックス中...' : (timerMode === 'countdown' ? '集中...' : 'Focus...') }}</p>
                        </div>

                        <!-- Right: Buttons（スタンバイ時は非表示・横向きはコンパクト版） -->
                        <div v-if="!isStandbyMode && !isTimerRunning && !isPaused"
                            :class="(isMobile && isLandscape) ? 'w-full' : 'w-full md:w-1/2'">

                            <!-- 横向きコンパクト：教科ボタン横並び + 休憩ボタン -->
                            <div v-if="isMobile && isLandscape" class="flex flex-col gap-2 overflow-y-auto" style="max-height: calc(100vh - 120px);">
                                <div class="grid gap-1.5" :style="{ gridTemplateColumns: 'repeat(' + Math.min(subjects.length, 4) + ', 1fr)' }">
                                    <button v-for="sub in subjects" :key="sub" @click="handleSubjectClick(sub)"
                                        class="py-2 px-1 bg-white dark:bg-gray-800 border-2 border-primary-light dark:border-gray-600 hover:border-primary rounded-xl font-bold text-gray-700 dark:text-gray-200 shadow-sm transition active:scale-95 flex flex-col items-center justify-center text-center">
                                        <span class="text-xs leading-tight">{{ sub }}</span>
                                    </button>
                                    <button @click="openCountdownModal('休憩')"
                                        class="py-2 px-1 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 hover:bg-green-100 text-green-600 dark:text-green-400 font-bold rounded-xl flex flex-col items-center justify-center transition text-xs">
                                        <i class="fa-solid fa-mug-hot text-xs mb-0.5"></i>休憩
                                    </button>
                                </div>
                            </div>

                            <!-- 通常（縦向き / PC） -->
                            <template v-else>
                                <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4 mb-4">
                                    <button v-for="sub in subjects" :key="sub" @click="handleSubjectClick(sub)"
                                        class="h-16 md:h-24 bg-white dark:bg-gray-800 border-2 border-primary-light dark:border-gray-600 hover:border-primary dark:hover:border-primary rounded-2xl font-bold text-gray-700 dark:text-gray-200 shadow-sm transition active:scale-95 flex flex-col items-center justify-center">
                                        <span class="text-lg">{{ sub }}</span>
                                        <span class="text-[10px] text-gray-400 font-normal md:mt-1">{{ timerMode === 'countdown' ? 'SET' : 'START' }}</span>
                                    </button>
                                </div>
                                <button @click="openCountdownModal('休憩')" class="w-full mb-8 py-3 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 hover:bg-green-100 dark:hover:bg-green-900/40 text-green-600 dark:text-green-400 font-bold rounded-xl flex items-center justify-center gap-2 transition">
                                    <i class="fa-solid fa-mug-hot"></i> 休憩タイマーをセット
                                </button>
                                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                                    <div class="bg-gray-50 dark:bg-gray-700/50 px-5 py-3 border-b border-gray-100 dark:border-gray-700 text-xs font-bold text-gray-400 uppercase">
                                        <span>本日の内訳</span>
                                    </div>
                                    <div class="p-2 max-h-60 overflow-y-auto">
                                        <div v-if="Object.keys(todayLog.subjects).length === 0" class="text-center py-6 text-gray-400 text-sm">記録なし</div>
                                        <div v-for="(time, sub) in todayLog.subjects" :key="sub">
                                            <div v-if="time > 0" class="flex justify-between items-center text-sm border-b border-gray-100 dark:border-gray-700 last:border-0 p-3 hover:bg-gray-50 dark:hover:bg-gray-700/50">
                                                <span class="font-medium text-gray-700 dark:text-gray-300">{{ sub }}</span>
                                                <span class="font-mono font-bold px-2 py-0.5 rounded text-gray-800 dark:text-gray-100"
                                                    :class="sub==='休憩'?'bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-400':'bg-primary-light dark:bg-primary/20 text-primary dark:text-primary'">
                                                    {{ formatSeconds(time) }}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>


                </div>

                <!-- 2. TODO TAB -->
                <div v-if="currentTab === 'tasks'" class="max-w-2xl mx-auto min-h-full pb-8">
                    <header class="mb-6 flex flex-wrap gap-4 justify-between items-end">
                        <h2 class="text-2xl font-bold">Todoリスト</h2>
                        <div class="flex gap-2 items-center">
                            <div v-if="tokenExpired && !isGuestMode" class="flex items-center gap-1.5 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 px-2.5 py-1.5 rounded-lg">
                                <i class="fa-solid fa-circle-exclamation text-red-600 dark:text-red-400 text-xs"></i>
                                <span class="text-[10px] font-bold text-red-700 dark:text-red-300">セッション切れ</span>
                            </div>
                            <button v-if="!isGuestMode" @click="refreshToken" class="text-xs bg-white dark:bg-gray-800 border border-primary-light dark:border-gray-600 text-primary px-3 py-1.5 rounded-lg hover:bg-gray-50 transition">
                                <i class="fa-solid fa-rotate mr-1"></i>再接続
                            </button>
                            <label class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400 cursor-pointer bg-white dark:bg-gray-800 px-3 py-1.5 rounded border dark:border-gray-700">
                                <input type="checkbox" v-model="showCompletedTasks" class="rounded text-primary">
                                完了済み
                            </label>
                        </div>
                    </header>

                    <!-- Guest Mode Info Banner -->
                    <div v-if="isGuestMode" class="bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-800 rounded-xl p-4 mb-6 flex items-start gap-3">
                        <i class="fa-solid fa-info-circle text-yellow-600 dark:text-yellow-400 mt-0.5"></i>
                        <div class="flex-1">
                            <p class="text-sm font-bold text-yellow-800 dark:text-yellow-300 mb-1">ゲストモードで利用中</p>
                            <p class="text-xs text-yellow-700 dark:text-yellow-400 mb-2">タスクはこのデバイスに保存されます。ログインすると、Googleアカウントに同期できます。</p>
                            <button @click="login" class="text-xs bg-yellow-600 dark:bg-yellow-700 text-white px-3 py-1.5 rounded-lg hover:bg-yellow-700 dark:hover:bg-yellow-600 font-bold">
                                ログインして同期
                            </button>
                        </div>
                    </div>

                    <div class="flex gap-2 mb-6">
                        <div class="relative flex-1">
                            <span class="absolute left-4 top-3.5 text-gray-400"><i class="fa-solid fa-plus"></i></span>
                            <input type="text" v-model="newTaskTitle" placeholder="タスクを入力..." 
                                   class="w-full border-none rounded-xl px-10 py-3.5 shadow-sm outline-none ring-1 ring-gray-200 dark:ring-gray-700 focus:ring-2 focus:ring-primary bg-white dark:bg-gray-800 dark:text-white transition"
                                   @keydown.enter="createTask">
                        </div>
                        <button @click="createTask({isComposing:false})" class="bg-primary text-white px-4 rounded-xl shadow hover:bg-primary-hover font-bold">追加</button>
                    </div>
                    <div class="space-y-3">
                        <div v-if="filteredTasks.length === 0" class="text-center py-12 text-gray-400 bg-white dark:bg-gray-800 rounded-xl border border-dashed border-gray-300 dark:border-gray-700">
                            タスクはありません
                        </div>
                        <div v-for="task in filteredTasks" :key="task.id" 
                             class="group bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-start gap-3 transition hover:shadow-md">
                            <input type="checkbox" :checked="task.status === 'completed'" @change="toggleTaskStatus(task)" class="mt-1.5 w-5 h-5 cursor-pointer accent-primary">
                            <input v-model="task.title" @blur="updateTaskTitle(task)" @keydown.enter="$event.target.blur()" class="flex-1 bg-transparent border-none outline-none text-sm p-0 focus:ring-0 text-gray-800 dark:text-gray-100" :class="{ 'completed-task': task.status === 'completed' }">
                            <button @click="deleteTask(task.id)" class="text-gray-300 hover:text-red-400 px-2 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                </div>

                <!-- 3. REPORT TAB -->
                <div v-if="currentTab === 'report'" class="max-w-full mx-auto flex flex-col" :style="{ height: (isMobile && !isLandscape) ? 'calc(100dvh - 5rem - 2rem)' : 'calc(100vh - 4rem)', minHeight: 0 }">
                    <!-- ヘッダー：全要素を1行に収める -->
                    <div class="flex-shrink-0 mb-2 flex items-center gap-1.5 min-w-0 overflow-hidden">
                        <!-- タイトル（スマホで省略） -->
                        <h2 class="font-bold whitespace-nowrap flex-shrink-0 hidden xs:block" style="font-size: clamp(14px, 2vw, 22px);">週間レポート</h2>
                        <!-- 月ピッカー -->
                        <input type="month" :value="reportMonthValue" @change="jumpToMonth($event.target.value)"
                               :max="todayMonthValue"
                               class="flex-shrink-0 border dark:border-gray-600 rounded-lg px-1.5 py-1 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 outline-none focus:ring-2 focus:ring-primary cursor-pointer"
                               style="font-size: clamp(10px, 1.2vw, 13px); max-width: clamp(100px, 18vw, 140px);">
                        <!-- 週ナビ -->
                        <div class="flex items-center bg-white dark:bg-gray-800 rounded-lg shadow-sm border dark:border-gray-700 p-0.5 flex-shrink-0">
                            <button @click="shiftWeek(-7)" class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-gray-500"><i class="fa-solid fa-chevron-left" style="font-size:10px;"></i></button>
                            <span class="px-1 font-bold whitespace-nowrap" style="font-size: clamp(9px, 1.1vw, 12px);">{{ weekRangeLabel }}</span>
                            <button @click="shiftWeek(7)" :disabled="isCurrentWeek" class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition"
                                :class="isCurrentWeek ? 'text-gray-200 dark:text-gray-700 cursor-not-allowed' : 'text-gray-500'">
                                <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
                            </button>
                        </div>
                        <!-- 操作モードボタン -->
                        <div class="flex items-center bg-white dark:bg-gray-800 rounded-lg shadow-sm border dark:border-gray-700 p-0.5 gap-0.5 flex-shrink-0">
                            <button @click="reportMode = reportMode === 'edit' ? 'view' : 'edit'"
                                class="px-2 py-1 rounded font-bold transition flex items-center gap-0.5"
                                style="font-size: clamp(10px, 1.2vw, 12px);"
                                :class="reportMode==='edit' ? 'bg-yellow-400 text-white' : 'text-gray-400 hover:text-yellow-500 hover:bg-yellow-50 dark:hover:bg-gray-700'">
                                <i class="fa-solid fa-pen" style="font-size:9px;"></i> 変更
                            </button>
                            <button @click="reportMode = reportMode === 'delete' ? 'view' : 'delete'"
                                class="px-2 py-1 rounded font-bold transition flex items-center gap-0.5"
                                style="font-size: clamp(10px, 1.2vw, 12px);"
                                :class="reportMode==='delete' ? 'bg-red-400 text-white' : 'text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-gray-700'">
                                <i class="fa-solid fa-trash" style="font-size:9px;"></i> 削除
                            </button>
                        </div>
                    </div>

                    <!-- モード案内バナー -->
                    <div v-if="reportMode !== 'view'" class="flex-shrink-0 mb-2 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2"
                         :class="reportMode==='edit' ? 'bg-yellow-50 dark:bg-yellow-900/20 text-yellow-700 dark:text-yellow-300 border border-yellow-200 dark:border-yellow-800' : 'bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-300 border border-red-200 dark:border-red-800'">
                        <i :class="reportMode==='edit' ? 'fa-solid fa-pen' : 'fa-solid fa-trash'"></i>
                        {{ reportMode==='edit' ? '変更モード：タイムラインのセッションをタップして時間を変更' : '削除モード：タイムラインのセッションをタップして削除' }}
                        <button @click="reportMode='view'" class="ml-auto underline opacity-70 hover:opacity-100 font-normal">キャンセル</button>
                    </div>

                    <!-- サマリー（コンパクト） -->
                    <div class="flex-shrink-0 grid grid-cols-2 gap-2 mb-2">
                        <div class="bg-white dark:bg-gray-800 px-3 py-2 rounded-xl shadow-sm border border-primary-light dark:border-gray-700 flex items-center justify-between">
                            <span class="text-primary font-bold" style="font-size: clamp(10px, 1.1vw, 14px);">週合計</span>
                            <span class="font-bold text-gray-800 dark:text-white" style="font-size: clamp(16px, 2vw, 26px);">{{ formatHours(weeklyTotal) }}<span class="text-gray-400 ml-1" style="font-size: clamp(11px, 1.2vw, 15px);">h</span></span>
                        </div>
                        <div class="bg-white dark:bg-gray-800 px-3 py-2 rounded-xl shadow-sm border border-green-100 dark:border-gray-700 flex items-center justify-between">
                            <span class="text-green-500 font-bold" style="font-size: clamp(10px, 1.1vw, 14px);">日平均</span>
                            <span class="font-bold text-gray-800 dark:text-white" style="font-size: clamp(16px, 2vw, 26px);">{{ formatHours(weeklyTotal / 7) }}<span class="text-gray-400 ml-1" style="font-size: clamp(11px, 1.2vw, 15px);">h</span></span>
                        </div>
                    </div>

                    <!-- 凡例 + 日別詳細パネル（横並び） -->
                    <div class="flex-shrink-0 flex gap-2 mb-2 min-h-0" style="max-height: clamp(80px, 12vw, 140px);">
                        <!-- 左：教科凡例 -->
                        <div class="flex flex-col gap-1 overflow-y-auto flex-shrink-0 pr-2 border-r border-gray-100 dark:border-gray-700" style="min-width: clamp(70px, 10vw, 140px); max-width: clamp(100px, 14vw, 180px);">
                            <div v-for="sub in allWeekSubjects" :key="sub"
                                 class="flex items-center gap-1 font-bold whitespace-nowrap"
                                 style="font-size: clamp(10px, 1.1vw, 14px);"
                                 :style="{ color: subjectColor(sub) }">
                                <span class="rounded-full flex-shrink-0" style="width: clamp(8px, 1vw, 12px); height: clamp(8px, 1vw, 12px);" :style="{ backgroundColor: subjectColor(sub) }"></span>
                                <span class="truncate">{{ sub }}</span>
                            </div>
                            <div v-if="allWeekSubjects.length === 0" class="text-gray-300" style="font-size: clamp(10px, 1.1vw, 14px);">記録なし</div>
                        </div>
                        <!-- 右：選択日の学習時間詳細 -->
                        <div class="flex-1 overflow-y-auto">
                            <div v-if="!selectedDayDetail"></div>
                            <div v-else>
                                <div class="flex items-center gap-1.5 mb-1.5">
                                    <span class="font-bold text-gray-600 dark:text-gray-300" style="font-size: clamp(11px, 1.2vw, 15px);">{{ selectedDayDetail.dateStr }}</span>
                                    <span class="font-mono font-bold px-1.5 py-0.5 rounded-full bg-primary-light dark:bg-primary/20 text-primary" style="font-size: clamp(10px, 1.1vw, 14px);">
                                        学習 {{ formatSeconds(calculateDailyStudyTotal(selectedDayDetail.subjects)) }}
                                    </span>
                                    <button @click="selectedDayDetail = null" class="ml-auto text-gray-300 hover:text-gray-500" style="font-size: clamp(10px, 1.1vw, 14px);"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                                <div v-if="Object.keys(selectedDayDetail.subjects).length === 0" class="text-gray-300" style="font-size: clamp(10px, 1.1vw, 14px);">記録なし</div>
                                <div v-else class="flex flex-wrap gap-1">
                                    <div v-for="(sec, sub) in selectedDayDetail.subjects" :key="sub"
                                         class="flex items-center gap-1 px-1.5 py-0.5 rounded font-bold"
                                         style="font-size: clamp(10px, 1.1vw, 14px);"
                                         :style="{ backgroundColor: subjectColor(sub)+'22', color: subjectColor(sub) }">
                                        <span class="rounded-full flex-shrink-0" style="width: clamp(6px, 0.7vw, 10px); height: clamp(6px, 0.7vw, 10px);" :style="{ backgroundColor: subjectColor(sub) }"></span>
                                        {{ sub }}&nbsp;<span class="font-mono font-normal opacity-80">{{ formatSeconds(sec) }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ═══ タイムライングリッド：ヘッダー固定 + 本体のみスクロール ═══ -->
                    <div class="flex-1 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden flex flex-col min-h-0">
                        <!-- 横スクロール共有コンテナ（ヘッダーと本体を同じ横スクロールに載せる） -->
                        <div class="flex-1 flex flex-col overflow-hidden min-h-0">

                            <!-- ★ ヘッダー行（固定・横スクロールは同期） -->
                            <div class="flex-shrink-0 flex border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800"
                                 id="timeline-header" style="overflow-x: hidden;">
                                <!-- 時刻ラベル列の空白 -->
                                <div class="flex-shrink-0 border-r border-gray-100 dark:border-gray-700"
                                     style="width: clamp(28px, 4vw, 52px);"></div>
                                <!-- 7日分ヘッダー -->
                                <div v-for="(dateStr, idx) in weeklyDates" :key="'h-'+dateStr"
                                     class="flex-1 text-center cursor-pointer select-none transition hover:brightness-95 active:brightness-90 flex flex-col items-center justify-center border-r border-gray-100 dark:border-gray-700 last:border-r-0"
                                     style="min-width: clamp(52px, 10vw, 120px); height: clamp(44px, 7vw, 64px); padding: clamp(2px, 0.5vw, 6px) 0;"
                                     :class="dateStr === getTodayStr() ? 'bg-primary-light dark:bg-primary/20' : ''"
                                     @click="selectedDayDetail = { dateStr, subjects: weeklyData[idx]?.subjects || {} }">
                                    <div class="font-bold leading-tight"
                                         style="font-size: clamp(11px, 1.4vw, 16px);"
                                         :class="dateStr === getTodayStr() ? 'text-primary' :
                                                 new Date(dateStr+'T12:00:00').getDay()===0 ? 'text-red-400' :
                                                 new Date(dateStr+'T12:00:00').getDay()===6 ? 'text-blue-400' : 'text-gray-600 dark:text-gray-300'">
                                        {{ ['日','月','火','水','木','金','土'][new Date(dateStr+'T12:00:00').getDay()] }}
                                    </div>
                                    <div class="text-gray-400 leading-tight" style="font-size: clamp(9px, 1.1vw, 13px);">
                                        {{ dateStr.slice(5).replace('-','/') }}
                                    </div>
                                    <div class="font-mono font-bold leading-tight" style="font-size: clamp(9px, 1.1vw, 13px);"
                                         :class="calculateDailyStudyTotal(weeklyData[idx]?.subjects || {}) > 0 ? 'text-primary' : 'text-gray-300 dark:text-gray-600'">
                                        {{ calculateDailyStudyTotal(weeklyData[idx]?.subjects || {}) > 0 ? formatHours(calculateDailyStudyTotal(weeklyData[idx]?.subjects || {}))+'h' : '—' }}
                                    </div>
                                </div>
                            </div>

                            <!-- ★ 本体（縦＋横スクロール、ヘッダーは含まない） -->
                            <div class="flex-1 overflow-x-auto min-h-0"
                                 :class="reportVisibleHours > 10 ? 'overflow-y-auto' : 'overflow-y-hidden'"
                                 @scroll="syncHeaderScroll">
                                <div class="flex"
                                     :style="{ minWidth: '480px', height: reportVisibleHours > 10 ? (reportVisibleHours * 52) + 'px' : '100%', minHeight: '100%' }">

                                    <!-- 時刻ラベル列 -->
                                    <div class="flex-shrink-0 relative border-r border-gray-100 dark:border-gray-700"
                                         style="width: clamp(28px, 4vw, 52px);">
                                        <div v-for="h in visibleHourTicks" :key="'lbl-'+h"
                                             class="absolute w-full text-right font-mono font-bold text-gray-500 dark:text-gray-400 leading-none"
                                             style="font-size: clamp(9px, 1.1vw, 13px); padding-right: clamp(3px, 0.4vw, 6px);"
                                             :style="{ top: ((h - reportStartHour) / reportVisibleHours * 100) + '%' }">
                                            {{ String(h).padStart(2,'0') }}
                                        </div>
                                    </div>

                                    <!-- 7日分の列（本体のみ） -->
                                    <div v-for="(dateStr, idx) in weeklyDates" :key="dateStr"
                                         class="flex-1 border-r border-gray-100 dark:border-gray-700 last:border-r-0 relative"
                                         style="min-width: clamp(52px, 10vw, 120px);">
                                        <!-- 時間グリッド線 -->
                                        <div v-for="h in visibleHourTicks" :key="'grid-'+dateStr+h"
                                             class="absolute w-full pointer-events-none"
                                             :class="h % 3 === 0 ? 'border-t border-gray-300 dark:border-gray-500' : 'border-t border-gray-200 dark:border-gray-600/70'"
                                             :style="{ top: ((h - reportStartHour) / reportVisibleHours * 100) + '%' }">
                                        </div>
                                        <!-- セッションブロック -->
                                        <template v-if="weeklyData[idx]?.sessions?.length > 0">
                                            <div v-for="(session, si) in weeklyData[idx].sessions" :key="si"
                                                 class="absolute rounded overflow-hidden transition-all"
                                                 style="left: clamp(1px, 0.3vw, 3px); right: clamp(1px, 0.3vw, 3px);"
                                                 :class="[
                                                    reportMode !== 'view' ? 'cursor-pointer hover:brightness-75 hover:ring-2 hover:ring-white' : 'cursor-pointer hover:brightness-90',
                                                    reportMode === 'delete' ? 'ring-1 ring-red-300' : ''
                                                 ]"
                                                 :style="sessionBlockStylePct(session)"
                                                 @click="onSessionClick(dateStr, idx, si, session)">
                                                <!-- 一時停止セグメント -->
                                                <div v-if="session.isPause || session.subject === '__pause__'"
                                                     class="px-0.5 py-0.5 h-full flex flex-col justify-start overflow-hidden bg-repeating-diagonal"
                                                     style="background: repeating-linear-gradient(45deg, #9ca3af22, #9ca3af22 3px, transparent 3px, transparent 8px); background-color: #e5e7eb;">
                                                    <div class="text-gray-500 font-bold truncate leading-tight"
                                                         style="font-size: clamp(7px, 0.9vw, 11px);">⏸</div>
                                                </div>
                                                <!-- 通常セグメント -->
                                                <div v-else class="px-0.5 py-0.5 h-full flex flex-col justify-start overflow-hidden"
                                                     :style="{ backgroundColor: subjectColor(session.subject), opacity: 0.92 }">
                                                    <div class="text-white font-bold truncate leading-tight drop-shadow-sm"
                                                         style="font-size: clamp(8px, 1vw, 12px);">{{ session.subject }}</div>
                                                    <div v-if="session.duration >= 1200"
                                                         class="text-white/80 font-mono truncate leading-tight"
                                                         style="font-size: clamp(7px, 0.85vw, 11px);">{{ fmtTime(session.start) }}-{{ fmtTime(session.end) }}</div>
                                                </div>
                                                <div v-if="reportMode==='delete'" class="absolute inset-0 bg-red-500/20 flex items-center justify-center">
                                                    <i class="fa-solid fa-xmark text-white drop-shadow" style="font-size: clamp(9px, 1vw, 13px);"></i>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- セッション詳細ポップアップ（viewモード時） -->
                <transition name="modal">
                <div v-if="sessionDetailPopup" class="fixed inset-0 z-50 bg-black/50 flex items-end md:items-center justify-center p-4"
                     @click.self="sessionDetailPopup = null">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 w-full max-w-sm shadow-2xl">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-4 h-4 rounded-full flex-shrink-0" :style="{ backgroundColor: subjectColor(sessionDetailPopup.subject) }"></div>
                            <h3 class="text-lg font-bold dark:text-white">{{ sessionDetailPopup.subject }}</h3>
                        </div>
                        <div class="bg-gray-50 dark:bg-gray-700 rounded-xl p-4 space-y-2 text-sm mb-4">
                            <div class="flex justify-between">
                                <span class="text-gray-500">開始</span>
                                <span class="font-mono font-bold">{{ fmtTimeFull(sessionDetailPopup.start) }}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-500">終了</span>
                                <span class="font-mono font-bold">{{ fmtTimeFull(sessionDetailPopup.end) }}</span>
                            </div>
                            <div class="flex justify-between border-t border-gray-200 dark:border-gray-600 pt-2">
                                <span class="text-gray-500">時間</span>
                                <span class="font-mono font-bold text-base" :style="{ color: subjectColor(sessionDetailPopup.subject) }">{{ formatSeconds(sessionDetailPopup.duration) }}</span>
                            </div>
                        </div>
                        <button @click="sessionDetailPopup = null" class="w-full py-2 text-gray-400 text-sm rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition">閉じる</button>
                    </div>
                </div>
                </transition>

                <!-- セッション編集モーダル -->
                <transition name="modal">
                <div v-if="editingSession" class="fixed inset-0 z-50 bg-black/60 flex items-end md:items-center justify-center p-4" @click.self="editingSession = null; reportMode = 'edit'">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 max-w-sm w-full shadow-2xl">
                        <!-- タイトル -->
                        <h3 class="text-base font-bold mb-4 dark:text-white flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full flex-shrink-0" :style="{ backgroundColor: subjectColor(editingSession.subject) }"></div>
                            {{ editingSession.subject }} を編集
                        </h3>

                        <!-- スタート時刻 -->
                        <div class="mb-3">
                            <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1.5">スタート時刻</label>
                            <input type="time" v-model="editingStartTime"
                                   @change="onEditTimeChange"
                                   class="w-full border dark:border-gray-600 rounded-xl px-4 py-2.5 text-lg font-mono font-bold text-center outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                        </div>

                        <!-- 終了時刻 -->
                        <div class="mb-4">
                            <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1.5">終了時刻</label>
                            <input type="time" v-model="editingEndTime"
                                   @change="onEditTimeChange"
                                   class="w-full border dark:border-gray-600 rounded-xl px-4 py-2.5 text-lg font-mono font-bold text-center outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                        </div>

                        <!-- 計算後の時間（表示のみ） -->
                        <div class="mb-5 flex items-center justify-center gap-2 py-2 px-4 rounded-xl"
                             :class="editingDurationMin >= 1 ? 'bg-primary-light dark:bg-primary/20' : 'bg-red-50 dark:bg-red-900/20'">
                            <i class="fa-regular fa-clock text-xs" :class="editingDurationMin >= 1 ? 'text-primary' : 'text-red-400'"></i>
                            <span class="font-bold text-sm" :class="editingDurationMin >= 1 ? 'text-primary' : 'text-red-500'">
                                {{ editingDurationMin >= 1 ? editingDurationMin + ' 分' : '終了時刻がスタートより前です' }}
                            </span>
                        </div>

                        <!-- ボタン -->
                        <div class="flex gap-2">
                            <button @click="editingSession = null; reportMode = 'edit'"
                                    class="flex-1 py-2.5 text-gray-500 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 text-sm font-medium transition">
                                キャンセル
                            </button>
                            <button @click="confirmEditSession"
                                    :disabled="editingDurationMin < 1"
                                    class="flex-1 py-2.5 rounded-xl font-bold text-sm transition"
                                    :class="editingDurationMin >= 1 ? 'bg-primary text-white shadow hover:bg-primary-hover' : 'bg-gray-200 dark:bg-gray-700 text-gray-400 cursor-not-allowed'">
                                保存
                            </button>
                        </div>
                    </div>
                </div>
                </transition>


                <!-- 5. EXAM TAB -->
                <div v-if="currentTab === 'exam'" class="max-w-3xl mx-auto w-full pb-8">

                    <!-- ヘッダー -->
                    <header class="mb-4 flex items-center justify-between gap-2 flex-wrap">
                        <h2 class="text-xl font-bold">テスト記録</h2>
                        <button @click="showExamForm = !showExamForm"
                            class="flex items-center gap-1.5 bg-primary text-white px-4 py-2 rounded-xl text-sm font-bold shadow hover:bg-primary-hover transition active:scale-95">
                            <i class="fa-solid fa-plus text-xs"></i> 記録を追加
                        </button>
                    </header>

                    <!-- ══ 追加フォーム ══ -->
                    <transition name="tab-fade">
                    <div v-if="showExamForm" class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-5 mb-4">
                        <h3 class="font-bold text-sm mb-3 text-gray-600 dark:text-gray-300">新しいテスト結果を追加</h3>

                        <!-- 共通：日付・年度・種別・テスト名・満点 -->
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">実施日</label>
                                <input type="date" v-model="examForm.date" :max="getTodayStr()" @change="onExamDateChange"
                                    class="w-full border dark:border-gray-600 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">
                                    年度
                                    <span class="font-normal opacity-60 ml-1">（任意）</span>
                                </label>
                                <div class="flex gap-1">
                                    <input type="number" v-model.number="examForm.nendo" min="2000" max="2100"
                                        @input="examForm.nendoCustom = true"
                                        class="flex-1 border dark:border-gray-600 rounded-lg px-2 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                    <span class="self-center text-xs text-gray-400 flex-shrink-0">年度</span>
                                    <button v-if="examForm.nendoCustom"
                                        @click="examForm.nendoCustom = false; examForm.nendo = String(dateToNendo(examForm.date))"
                                        class="text-[10px] text-gray-400 hover:text-primary px-1.5 py-1 border border-gray-200 dark:border-gray-600 rounded-md flex-shrink-0" title="日付から自動">
                                        <i class="fa-solid fa-rotate-left"></i>
                                    </button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">種別</label>
                                <div class="flex bg-gray-100 dark:bg-gray-700 p-0.5 rounded-lg gap-0.5">
                                    <button v-for="t in examTypes" :key="t.id"
                                        @click="examForm.type = t.id; examForm.bulkMode = false; examForm.bulkEntries = []"
                                        class="flex-1 py-1.5 rounded-md text-xs font-bold transition truncate px-1"
                                        :class="examForm.type === t.id ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">
                                        {{ t.label }}
                                    </button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">テスト名</label>
                                <div class="flex gap-1.5">
                                    <select v-if="!examForm.customName" v-model="examForm.name"
                                        class="flex-1 border dark:border-gray-600 rounded-lg px-2 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                        <option value="">選択...</option>
                                        <option v-for="n in examNameList" :key="n" :value="n">{{ n }}</option>
                                    </select>
                                    <input v-else type="text" v-model="examForm.name" placeholder="例：中間テスト"
                                        class="flex-1 border dark:border-gray-600 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                    <button @click="examForm.customName = !examForm.customName; examForm.name = ''"
                                        class="px-2 py-1 rounded-lg border border-gray-200 dark:border-gray-600 text-xs text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 flex-shrink-0">
                                        <i :class="examForm.customName ? 'fa-solid fa-list' : 'fa-solid fa-pen'"></i>
                                    </button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">満点</label>
                                <input type="number" v-model.number="examForm.maxScore" min="1" max="1000"
                                    class="w-full border dark:border-gray-600 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                            </div>
                        </div>

                        <!-- 大テスト：一括登録モード切替 -->
                        <div v-if="examForm.type === 'major'" class="mb-3">
                            <label class="flex items-center gap-2 cursor-pointer select-none">
                                <button @click="examForm.bulkMode = !examForm.bulkMode; initBulkMode()"
                                    class="relative inline-flex h-5 w-9 items-center rounded-full transition-colors"
                                    :class="examForm.bulkMode ? 'bg-primary' : 'bg-gray-300 dark:bg-gray-600'">
                                    <span class="inline-block h-3.5 w-3.5 transform rounded-full bg-white shadow transition"
                                        :class="examForm.bulkMode ? 'translate-x-4' : 'translate-x-1'"></span>
                                </button>
                                <span class="text-xs font-bold text-gray-600 dark:text-gray-300">複数教科をまとめて登録</span>
                            </label>
                        </div>

                        <!-- ★ 一括登録モード -->
                        <div v-if="examForm.bulkMode" class="mb-4">
                            <div class="text-xs font-bold text-gray-400 mb-2 flex items-center justify-between">
                                <span>教科ごとに入力</span>
                                <button @click="addBulkEntry" class="text-primary hover:underline text-xs">
                                    <i class="fa-solid fa-plus mr-0.5"></i>行を追加
                                </button>
                            </div>
                            <!-- ヘッダー -->
                            <div class="grid gap-1 text-[10px] text-gray-400 font-bold mb-1 px-1"
                                style="grid-template-columns: 1fr 3rem 3rem 3rem 3rem 1.5rem;">
                                <span>教科</span><span class="text-center">点数</span><span class="text-center">満点</span><span class="text-center">平均</span><span class="text-center">順位</span><span></span>
                            </div>
                            <div v-for="(entry, i) in examForm.bulkEntries" :key="i"
                                class="grid gap-1 mb-1.5 items-center"
                                style="grid-template-columns: 1fr 3rem 3rem 3rem 3rem 1.5rem;">
                                <!-- 教科 -->
                                <select v-model="entry.subject"
                                    class="border dark:border-gray-600 rounded-md px-1.5 py-1.5 text-xs outline-none focus:ring-1 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                    <option value="">教科...</option>
                                    <option v-for="s in examSubjects" :key="s" :value="s">{{ s }}</option>
                                </select>
                                <input type="number" v-model.number="entry.score" :min="0" :max="entry.maxScore || examForm.maxScore" placeholder="点"
                                    class="border dark:border-gray-600 rounded-md px-1 py-1.5 text-xs text-center outline-none focus:ring-1 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                <input type="number" v-model.number="entry.maxScore" min="1" :placeholder="examForm.maxScore"
                                    class="border dark:border-gray-600 rounded-md px-1 py-1.5 text-xs text-center outline-none focus:ring-1 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                <input type="number" v-model.number="entry.avg" :min="0" :max="entry.maxScore || examForm.maxScore" placeholder="—"
                                    class="border dark:border-gray-600 rounded-md px-1 py-1.5 text-xs text-center outline-none focus:ring-1 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                <input type="number" v-model.number="entry.rank" min="1" placeholder="—"
                                    class="border dark:border-gray-600 rounded-md px-1 py-1.5 text-xs text-center outline-none focus:ring-1 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                <button @click="removeBulkEntry(i)" class="text-gray-300 hover:text-red-400 transition text-xs">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>

                        <!-- ★ 通常モード（教科・点数など） -->
                        <div v-else class="grid grid-cols-2 gap-3 mb-3">
                            <!-- 教科 -->
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">教科</label>
                                <div class="flex gap-1.5">
                                    <select v-model="examForm.subject" v-if="!examForm.customSubject"
                                        class="flex-1 border dark:border-gray-600 rounded-lg px-2 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                        <option value="">選択...</option>
                                        <option v-for="s in examSubjects" :key="s" :value="s">{{ s }}</option>
                                    </select>
                                    <input v-else type="text" v-model="examForm.subject" placeholder="教科名"
                                        class="flex-1 border dark:border-gray-600 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                    <button @click="examForm.customSubject = !examForm.customSubject; examForm.subject = ''"
                                        class="px-2 py-1 rounded-lg border border-gray-200 dark:border-gray-600 text-xs text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 flex-shrink-0">
                                        <i :class="examForm.customSubject ? 'fa-solid fa-list' : 'fa-solid fa-pen'"></i>
                                    </button>
                                </div>
                            </div>
                            <!-- 単元名（小テスト時のみ） -->
                            <div v-if="examForm.type === 'minor'">
                                <label class="block text-xs font-bold text-gray-500 mb-1">単元名 <span class="font-normal opacity-60">（任意）</span></label>
                                <input type="text" v-model="examForm.unitName" placeholder="例：二次方程式"
                                    class="w-full border dark:border-gray-600 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                            </div>
                            <!-- 自分の点数 -->
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">自分の点数</label>
                                <input type="number" v-model.number="examForm.score" min="0" :max="examForm.maxScore"
                                    class="w-full border dark:border-gray-600 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                            </div>
                            <!-- 平均点（任意） -->
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">平均点 <span class="font-normal opacity-60">（任意）</span></label>
                                <input type="number" v-model.number="examForm.avg" min="0" :max="examForm.maxScore" placeholder="—"
                                    class="w-full border dark:border-gray-600 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                            </div>
                            <!-- 順位（任意） -->
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">順位 <span class="font-normal opacity-60">（任意）</span></label>
                                <div class="flex items-center gap-1">
                                    <input type="number" v-model.number="examForm.rank" min="1" placeholder="—"
                                        class="w-16 border dark:border-gray-600 rounded-lg px-2 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                    <span class="text-xs text-gray-400">位 /</span>
                                    <input type="number" v-model.number="examForm.rankOf" min="1" placeholder="人数"
                                        class="w-16 border dark:border-gray-600 rounded-lg px-2 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                    <span class="text-xs text-gray-400">人</span>
                                </div>
                            </div>
                        </div>

                        <!-- メモ -->
                        <div class="mb-4">
                            <label class="block text-xs font-bold text-gray-500 mb-1">メモ <span class="font-normal opacity-60">（任意）</span></label>
                            <textarea v-model="examForm.memo" rows="2" placeholder="自由記述..."
                                class="w-full border dark:border-gray-600 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white resize-none"></textarea>
                        </div>
                        <div class="flex gap-2">
                            <button @click="showExamForm = false; resetExamForm()"
                                class="flex-1 py-2 text-gray-500 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 text-sm font-medium transition">
                                キャンセル
                            </button>
                            <button @click="saveExamRecord"
                                :disabled="examForm.bulkMode ? (!examForm.name || !examForm.date) : (!examForm.subject || examForm.score === '' || !examForm.date)"
                                class="flex-1 py-2 rounded-xl font-bold text-sm transition"
