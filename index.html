                    } catch (err) { console.log(err); }
                };
                const releaseWakeLock = async () => {
                    if (wakeLock.value) { await wakeLock.value.release(); wakeLock.value = null; }
                };
                const handleVisibilityChange = async () => {
                    if (wakeLock.value !== null && document.visibilityState === 'visible') await requestWakeLock();
                };

                // Fullscreen & Orientation functions
                const checkMobile = () => { isMobile.value = window.innerWidth < 768; };
                const checkOrientation = () => { 
                    isLandscape.value = window.innerWidth > window.innerHeight; 
                    checkMobile();
                };
                
                const toggleFullscreen = () => {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().then(() => { isFullscreen.value = true; }).catch(e=>alert(e));
                    } else {
                        document.exitFullscreen().then(() => { isFullscreen.value = false; });
                    }
                };
                const handleFullscreenChange = () => { isFullscreen.value = !!document.fullscreenElement; };
                
                // Standby Mode Computed
                const isStandbyMode = computed(() => {
                    return isMobile.value && isFullscreen.value && isLandscape.value && currentTab.value === 'timer';
                });

                onMounted(() => {
                    checkMobile();
                    checkOrientation();
                    window.addEventListener('resize', checkOrientation); // リサイズで向き検知
                    document.addEventListener('fullscreenchange', handleFullscreenChange);
                    document.addEventListener('visibilitychange', handleVisibilityChange);

                    const seen = localStorage.getItem('studyMate_seenTutorial');
                    if (!seen) showTutorial.value = true;
                    
                    const guestFlag = localStorage.getItem('studyMate_isGuest');
                    if (guestFlag === 'true') {
                        isGuestMode.value = true;
                        try { loadTodayData(); loadSettings(); loadLocalTasks(); } catch(e){}
                    }

                    const storedToken = localStorage.getItem('google_tasks_token');
                    if (storedToken) accessToken.value = storedToken;

                    // ★タイマー状態の復元（リロード・再開対策）
                    restoreTimerState();

                    onAuthStateChanged(auth, async (currentUser) => {
                        if (currentUser) {
                            isGuestMode.value = false;
                            user.value = currentUser;
                            if(localStorage.getItem('studyMate_guest_todayLog')) await mergeGuestData(currentUser.uid);
                            if(localStorage.getItem('studyMate_guest_tasks')) await mergeGuestTasks();
                            try { await loadSettings(); await loadTodayData(); } catch(e){}
                            localStorage.removeItem('studyMate_isGuest');
                            
                            if (accessToken.value) {
                                lastTokenRefresh.value = Date.now();
                                startTokenCheck();
                                fetchTasks();
                            }
                        }
                        // ★認証判定終了でローディング解除
                        isAuthLoading.value = false;
                    });
                    
                    if(!user.value && !isGuestMode.value) {
                         applyTheme();
                         // ゲスト等の場合も念のため少し待って解除
                         setTimeout(() => { isAuthLoading.value = false; }, 800);
                    }
                });

                const hardReset = () => {
                    if(confirm("データをリセットしてリロードしますか？（ゲストデータは消えます）")) {
                        localStorage.clear();
                        window.location.reload();
                    }
                };

                const startGuest = () => { isGuestMode.value = true; localStorage.setItem('studyMate_isGuest', 'true'); loadTodayData(); loadLocalTasks(); };
                
                const login = async () => { 
                    try { 
                        const r = await signInWithPopup(auth, provider); 
                        const credential = GoogleAuthProvider.credentialFromResult(r);
                        accessToken.value = credential.accessToken;
                        localStorage.setItem('google_tasks_token', credential.accessToken);
                        lastTokenRefresh.value = Date.now();
                        tokenExpired.value = false;
                        startTokenCheck();
                        fetchTasks(); 
                    } catch(e){ 
                        alert(e.message); 
                    } 
                };
                
                const logout = () => { 
                    signOut(auth); 
                    localStorage.removeItem('google_tasks_token');
                    window.location.reload(); 
                };
                
                const guestLogout = () => {
                    if(confirm("ゲストデータをすべて削除して初期画面に戻りますか？\n（この操作は取り消せません）")) {
                        localStorage.clear();
                        window.location.reload();
                    }
                };

                const getTodayStr = () => new Date().toLocaleDateString('en-CA');
                const loadTodayData = async () => {
                    const d = getTodayStr();
                    try {
                        if(isGuestMode.value) {
                            const raw = localStorage.getItem(`studyMate_log_${d}`);
                            todayLog.value = raw ? JSON.parse(raw) : {total:0, subjects:{}, sessions:[]};
                        } else if(user.value) {
                            const s = await getDoc(doc(db, "users", user.value.uid, "logs", d));
                            todayLog.value = s.exists() ? s.data() : {total:0, subjects:{}, sessions:[]};
                        }
                    } catch(e) { todayLog.value = {total:0, subjects:{}, sessions:[]}; }
                };
                const saveDataForDate = async (dateStr, logData) => {
                    let realTotal = 0;
                    for(const [sub, t] of Object.entries(logData.subjects || {})){
                        if(sub !== '休憩') realTotal += t;
                    }
                    logData.total = realTotal;
                    const data = JSON.parse(JSON.stringify(logData));
                    if(isGuestMode.value) {
                        localStorage.setItem(`studyMate_log_${dateStr}`, JSON.stringify(data));
                        localStorage.setItem('studyMate_guest_todayLog', 'true');
                    } else if(user.value) {
                        await setDoc(doc(db, "users", user.value.uid, "logs", dateStr), data, {merge:true});
                    }
                };

                const saveData = async () => {
                    await saveDataForDate(getTodayStr(), todayLog.value);
                };
                
                const loadSettings = async () => {
                    let d = { subjects: subjects.value, timerMode: 'countup', themeColor: '#2563eb', isDarkMode: false, notificationMode: 'sound_vibrate', tabAnimation: 'fade', subjectColors: {} };
                    try {
                        if(isGuestMode.value) {
                            const s = localStorage.getItem('studyMate_settings');
                            if(s) d = JSON.parse(s);
                        } else if(user.value) {
                            const s = await getDoc(doc(db, "users", user.value.uid, "settings", "config"));
                            if(s.exists()) d = { ...d, ...s.data() };
                        }
                    } catch(e) {}
                    subjects.value = d.subjects || subjects.value;
                    timerMode.value = d.timerMode || 'countup';
                    themeColor.value = d.themeColor || '#2563eb';
                    tempThemeColor.value = themeColor.value;
                    isDarkMode.value = d.isDarkMode || false;
                    notificationMode.value = d.notificationMode || 'sound_vibrate';
                    tabAnimation.value = d.tabAnimation || 'fade';
                    subjectColors.value = d.subjectColors || {};
                    applyTheme();
                };
                const saveSettings = async () => {
                    const d = { 
                        subjects: subjects.value, 
                        timerMode: timerMode.value, 
                        themeColor: themeColor.value, 
                        isDarkMode: isDarkMode.value,
                        notificationMode: notificationMode.value,
                        tabAnimation: tabAnimation.value,
                        subjectColors: subjectColors.value
                    };
                    if(isGuestMode.value) localStorage.setItem('studyMate_settings', JSON.stringify(d));
                    else if(user.value) await setDoc(doc(db, "users", user.value.uid, "settings", "config"), d, {merge:true});
                };

                const mergeGuestData = async (uid) => {
                    try {
                        const d = getTodayStr();
                        const local = JSON.parse(localStorage.getItem(`studyMate_log_${d}`) || 'null');
                        if(local) {
                            const s = await getDoc(doc(db, "users", uid, "logs", d));
                            const cloud = s.exists() ? s.data() : {total:0, subjects:{}};
                            for(const [k,v] of Object.entries(local.subjects||{})) cloud.subjects[k] = (cloud.subjects[k]||0)+v;
                            await setDoc(doc(db, "users", uid, "logs", d), cloud, {merge:true});
                            localStorage.removeItem(`studyMate_log_${d}`);
                            localStorage.removeItem('studyMate_guest_todayLog');
                        }
                    } catch(e) {}
                };

                // ===== LOCAL TASKS (GUEST MODE & OFFLINE MODE) =====
                const loadLocalTasks = () => {
                    try {
                        const stored = localStorage.getItem('studyMate_local_tasks');
                        if (stored) {
                            const localTasks = JSON.parse(stored);
                            const cloudTaskIds = tasks.value.map(t => t.id);
                            const uniqueLocalTasks = localTasks.filter(lt => !cloudTaskIds.includes(lt.id));
                            tasks.value = [...tasks.value, ...uniqueLocalTasks];
                        }
                    } catch(e) { console.error('Load local tasks error:', e); }
                };

                const saveLocalTasks = () => {
                    try {
                        localStorage.setItem('studyMate_local_tasks', JSON.stringify(tasks.value));
                        if (!isGuestMode.value) localStorage.setItem('studyMate_offline_tasks', 'true');
                        else localStorage.setItem('studyMate_guest_tasks', 'true');
                    } catch(e) { console.error('Save local tasks error:', e); }
                };

                const mergeGuestTasks = async () => {
                    try {
                        if (!accessToken.value) return;
                        const localTasks = JSON.parse(localStorage.getItem('studyMate_local_tasks') || '[]');
                        for (const task of localTasks) {
                            if (task.id && !task.id.startsWith('local_')) continue;
                            try {
                                await fetch('https://tasks.googleapis.com/tasks/v1/lists/@default/tasks', {
                                    method: 'POST',
                                    headers: { Authorization: `Bearer ${accessToken.value}`, 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ title: task.title, status: task.status || 'needsAction' })
                                });
                            } catch(e) {}
                        }
                        localStorage.removeItem('studyMate_local_tasks');
                        localStorage.removeItem('studyMate_guest_tasks');
                        localStorage.removeItem('studyMate_offline_tasks');
                        await fetchTasks();
                    } catch(e) {}
                };

                const handleSubjectClick = (sub) => {
                    if (timerMode.value === 'countdown') openCountdownModal(sub);
                    else startSession(sub, 'countup');
                };

                const openCountdownModal = (sub) => {
                    targetSubject.value = sub;
                    customCountdownMin.value = 5;
                    showCountdownModal.value = true;
                };

                const setCountdown = (m) => { customCountdownMin.value = m; };
                const adjustCustomTime = (d) => { customCountdownMin.value = Math.max(1, customCountdownMin.value + d); };

                const startCountdownSession = () => {
                    if (customCountdownMin.value < 0.1) { alert("時間は0.1分以上に設定してください"); return; }
                    showCountdownModal.value = false;
                    startSession(targetSubject.value, 'countdown', customCountdownMin.value * 60);
                };

                // --- TIMER CONTROL ---
                // セッション開始壁時計（実際の時刻記録用）
                const sessionWallStart = ref(null);

                const startSession = (sub, mode, durationSec = 0) => {
                    currentSubject.value = sub;
                    breakMode.value = (sub === '休憩');
                    countdownDuration.value = durationSec;
                    
                    if (!startTime.value) startTime.value = Date.now();
                    sessionWallStart.value = new Date().toISOString(); // 壁時計の開始時刻
                    elapsedTime.value = 0;
                    isTimerRunning.value = true;
                    isPaused.value = false;
                    
                    requestWakeLock(); // ★スリープ防止

                    // ★ローカルストレージに状態保存
                    localStorage.setItem(TIMER_STATE_KEY, JSON.stringify({
                        subject: sub, mode: mode, duration: durationSec,
                        startTime: startTime.value, breakMode: breakMode.value, isPaused: false,
                        wallStart: sessionWallStart.value
                    }));
                    
                    if (timerInterval) clearInterval(timerInterval);
                    timerInterval = setInterval(() => {
                        const now = Date.now();
                        const diff = Math.floor((now - startTime.value) / 1000);
                        elapsedTime.value = diff;
                        if (mode === 'countdown' && diff >= durationSec) stopTimer(true);
                    }, 1000);
                };

                const pauseTimer = () => {
                    clearInterval(timerInterval);
                    isPaused.value = true;
                    isTimerRunning.value = false;
                    pauseStartTime.value = Date.now();
                    releaseWakeLock(); // ★停止中はスリープ許可

                    // ★一時停止状態保存
                    const saved = JSON.parse(localStorage.getItem(TIMER_STATE_KEY) || '{}');
                    saved.isPaused = true;
                    saved.pauseStartTime = pauseStartTime.value;
                    localStorage.setItem(TIMER_STATE_KEY, JSON.stringify(saved));
                };

                const resumeTimer = () => {
                    const now = Date.now();
                    const pausedDuration = now - pauseStartTime.value;
                    startTime.value += pausedDuration;
                    isPaused.value = false;
                    isTimerRunning.value = true;
                    
                    requestWakeLock(); // ★スリープ防止

                    // ★再開状態保存
                    const saved = JSON.parse(localStorage.getItem(TIMER_STATE_KEY) || '{}');
                    saved.isPaused = false;
                    saved.startTime = startTime.value;
                    delete saved.pauseStartTime;
                    localStorage.setItem(TIMER_STATE_KEY, JSON.stringify(saved));

                    timerInterval = setInterval(() => {
                        const n = Date.now();
                        const diff = Math.floor((n - startTime.value) / 1000);
                        elapsedTime.value = diff;
                        if ((timerMode.value === 'countdown' || breakMode.value) && diff >= countdownDuration.value && countdownDuration.value > 0) {
                            stopTimer(true);
                        }
                    }, 1000);
                };

                const stopTimer = async (finished = false) => {
                    clearInterval(timerInterval);
                    isTimerRunning.value = false;
                    isPaused.value = false;
                    startTime.value = 0;
                    
                    releaseWakeLock(); // ★スリープ防止解除
                    localStorage.removeItem(TIMER_STATE_KEY); // ★保存削除

                    const isNaturalFinish = (finished === true);
                    let addedTime = elapsedTime.value;
                    if ((timerMode.value === 'countdown' || breakMode.value) && countdownDuration.value > 0) {
                        addedTime = Math.min(elapsedTime.value, countdownDuration.value);
                    }

                    const sub = currentSubject.value;
                    if(sub) {
                        const wallEnd = new Date();
                        const wallStart = sessionWallStart.value 
                            ? new Date(sessionWallStart.value) 
                            : new Date(wallEnd.getTime() - addedTime * 1000);
                        
                        // 日をまたいでいるか確認
                        const startDateStr = wallStart.toLocaleDateString('en-CA');
                        const endDateStr = wallEnd.toLocaleDateString('en-CA');
                        
                        if (startDateStr !== endDateStr) {
                            // 日またぎ：前日と当日に分割保存
                            // 前日分：wallStart ～ 23:59:59
                            const midnight = new Date(endDateStr + 'T00:00:00');
                            const prevDayDuration = Math.floor((midnight.getTime() - wallStart.getTime()) / 1000);
                            const todayDuration = Math.floor((wallEnd.getTime() - midnight.getTime()) / 1000);
                            
                            // 前日のデータを読み込んで保存
                            let prevLog = {total:0, subjects:{}, sessions:[]};
                            try {
                                if(isGuestMode.value) {
                                    const raw = localStorage.getItem(`studyMate_log_${startDateStr}`);
                                    if(raw) prevLog = JSON.parse(raw);
                                } else if(user.value) {
                                    const s = await getDoc(doc(db, "users", user.value.uid, "logs", startDateStr));
                                    if(s.exists()) prevLog = s.data();
                                }
                            } catch(e) {}
                            if(!prevLog.subjects) prevLog.subjects = {};
                            if(!prevLog.sessions) prevLog.sessions = [];
                            
                            if(prevDayDuration > 0) {
                                prevLog.subjects[sub] = (prevLog.subjects[sub] || 0) + prevDayDuration;
                                prevLog.sessions.push({ subject: sub, start: wallStart.toISOString(), end: new Date(midnight.getTime() - 1000).toISOString(), duration: prevDayDuration });
                                await saveDataForDate(startDateStr, prevLog);
                            }
                            
                            // 当日分
                            if(todayDuration > 0 && todayLog.value.subjects) {
                                todayLog.value.subjects[sub] = (todayLog.value.subjects[sub] || 0) + todayDuration;
                                if(!todayLog.value.sessions) todayLog.value.sessions = [];
                                todayLog.value.sessions.push({ subject: sub, start: midnight.toISOString(), end: wallEnd.toISOString(), duration: todayDuration });
                                await saveData();
                            }
                        } else {
                            // 通常（同日内）
                            if(todayLog.value.subjects) {
                                todayLog.value.subjects[sub] = (todayLog.value.subjects[sub] || 0) + addedTime;
                            }
                            if(!todayLog.value.sessions) todayLog.value.sessions = [];
                            todayLog.value.sessions.push({ subject: sub, start: wallStart.toISOString(), end: wallEnd.toISOString(), duration: addedTime });
                            await saveData();
                        }
                    }
                    
                    sessionWallStart.value = null;

                    if (isNaturalFinish) playAlarm();
                    
                    elapsedTime.value = 0;
                    currentSubject.value = null;
                    breakMode.value = false; 
                };

                // キャンセル：記録せずにタイマーをリセット
                const cancelSession = () => {
                    clearInterval(timerInterval);
                    isTimerRunning.value = false;
                    isPaused.value = false;
                    startTime.value = 0;
                    elapsedTime.value = 0;
                    currentSubject.value = null;
                    breakMode.value = false;
                    sessionWallStart.value = null;
                    releaseWakeLock();
                    localStorage.removeItem(TIMER_STATE_KEY);
                };

                // ★タイマー復元処理
                const restoreTimerState = () => {
                    const saved = localStorage.getItem(TIMER_STATE_KEY);
                    if (!saved) return;
                    try {
                        const state = JSON.parse(saved);
                        if (state.isPaused) {
                            currentSubject.value = state.subject;
                            breakMode.value = state.breakMode;
                            timerMode.value = state.mode;
                            countdownDuration.value = state.duration;
                            startTime.value = state.startTime;
                            pauseStartTime.value = state.pauseStartTime;
                            isPaused.value = true;
                            isTimerRunning.value = false;
                            elapsedTime.value = Math.floor((state.pauseStartTime - state.startTime) / 1000);
                        } else {
                            const now = Date.now();
                            const diff = Math.floor((now - state.startTime) / 1000);
                            if (state.mode === 'countdown' && diff >= state.duration) {
                                currentSubject.value = state.subject;
                                startTime.value = state.startTime;
                                elapsedTime.value = diff;
                                breakMode.value = state.breakMode;
                                countdownDuration.value = state.duration;
                                sessionWallStart.value = state.wallStart || new Date(state.startTime).toISOString();
                                stopTimer(true);
                            } else {
                                startTime.value = state.startTime;
                                sessionWallStart.value = state.wallStart || new Date(state.startTime).toISOString();
                                startSession(state.subject, state.mode, state.duration);
                            }
                        }
                    } catch (e) {
                        localStorage.removeItem(TIMER_STATE_KEY);
                    }
                };

                const playAlarm = () => {
                    isAlarmRinging.value = true;
                    const mode = notificationMode.value;

                    // Sound Logic
                    if (mode === 'sound_vibrate') {
                        triggerAudio();
                        triggerVibration();
                    } else if (mode === 'vibrate_only') {
                        triggerVibration();
                    } else if (mode === 'flash') {
                        // Flash is handled by CSS binding
                    }
                };

                const triggerAudio = () => {
                    if (customAudioData.value) currentAudioObj = new Audio(customAudioData.value);
                    else currentAudioObj = defaultAudio;
                    currentAudioObj.loop = true;
                    currentAudioObj.play().catch(e => console.log(e));
                };

                const triggerVibration = () => {
                    if(navigator.vibrate) navigator.vibrate([1000, 500, 1000]);
                };

                const stopAlarm = () => {
                    if (currentAudioObj) { currentAudioObj.pause(); currentAudioObj.currentTime = 0; }
                    isAlarmRinging.value = false;
                };

                const handleAudioUpload = (e) => {
                    const f = e.target.files[0];
                    if(f){
                        if(f.size > 3000000) { alert("ファイルが大きすぎます(3MB以下推奨)"); return; }
                        const r = new FileReader();
                        r.onload = (ev) => {
                            customAudioData.value = ev.target.result;
                            localStorage.setItem('studyMate_audio', ev.target.result);
                        };
                        r.readAsDataURL(f);
                    }
                };
                const testAudio = () => {
                    const a = customAudioData.value ? new Audio(customAudioData.value) : defaultAudio;
                    a.loop = true; a.play();
                    setTimeout(() => { if(confirm("音が鳴りましたか？(OKで停止)")) a.pause(); else a.pause(); }, 500);
                };

                const changeTimerMode = (m) => { timerMode.value = m; saveSettings(); };
                const setNotificationMode = (m) => { notificationMode.value = m; saveSettings(); };
                const setTabAnimation = (m) => { tabAnimation.value = m; saveSettings(); };

                // ── タイムライン レイアウト ──
                // 表示時間範囲：週のセッションから動的計算（最低6時間表示）
                const reportStartHour = computed(() => {
                    let minH = 23;
                    for (const d of weeklyData.value) {
                        for (const s of (d.sessions || [])) {
                            const h = new Date(s.start).getHours();
                            if (h < minH) minH = h;
                        }
                    }
                    return Math.max(0, minH - 1);
                });
                const reportEndHour = computed(() => {
                    let maxH = 0;
                    for (const d of weeklyData.value) {
                        for (const s of (d.sessions || [])) {
                            const end = new Date(s.end);
                            const h = end.getHours() + (end.getMinutes() > 0 ? 1 : 0);
                            if (h > maxH) maxH = h;
                        }
                    }
                    const raw = Math.min(24, maxH + 1);
                    return Math.max(reportStartHour.value + 6, raw); // 最低6時間幅
                });
                const reportVisibleHours = computed(() => reportEndHour.value - reportStartHour.value);
                const visibleHourTicks = computed(() => {
                    const ticks = [];
                    for (let h = reportStartHour.value; h <= reportEndHour.value; h++) ticks.push(h);
                    return ticks;
                });

                // セッションブロック位置（%ベース）
                const sessionBlockStylePct = (session) => {
                    const start = new Date(session.start);
                    const startH = start.getHours() + start.getMinutes() / 60;
                    const topPct = ((startH - reportStartHour.value) / reportVisibleHours.value) * 100;
                    const durH = session.duration / 3600;
                    const heightPct = Math.max((durH / reportVisibleHours.value) * 100, 1.2); // 最低1.2%
                    return { top: topPct + '%', height: heightPct + '%' };
                };

                // ISO → "HH:MM"
                const fmtTime = (iso) => new Date(iso).toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
                // ISO → "M/D HH:MM"
                const fmtTimeFull = (iso) => {
                    const d = new Date(iso);
                    return `${d.getMonth()+1}/${d.getDate()} ${d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`;
                };

                // 週の全教科リスト（凡例用）
                const allWeekSubjects = computed(() => {
                    const set = new Set();
                    for (const d of weeklyData.value) {
                        for (const s of (d.sessions || [])) set.add(s.subject);
                    }
                    return [...set];
                });

                // セッションクリック処理（モードによって動作が変わる）
                const onSessionClick = (dateStr, dayIdx, sessionIdx, session) => {
                    if (reportMode.value === 'view') {
                        sessionDetailPopup.value = { ...session };
                    } else if (reportMode.value === 'edit') {
                        editSessionFromReport(dateStr, dayIdx, sessionIdx);
                    } else if (reportMode.value === 'delete') {
                        deleteSessionFromReport(dateStr, dayIdx, sessionIdx);
                    }
                };

                // ── セッション削除（レポートから） ──
                const deleteSessionFromReport = async (dateStr, dayIdx, sessionIdx) => {
                    if (!confirm('このセッションを削除しますか？')) return;
                    const dayData = JSON.parse(JSON.stringify(weeklyData.value[dayIdx]));
                    if (!dayData.sessions) return;
                    dayData.sessions.splice(sessionIdx, 1);
                    // subjects を sessions から再計算
                    const newSubjects = {};
                    for (const s of dayData.sessions) {
                        newSubjects[s.subject] = (newSubjects[s.subject] || 0) + s.duration;
                    }
                    dayData.subjects = newSubjects;
                    await saveDataForDate(dateStr, dayData);
                    // 今日なら todayLog も更新
                    if (dateStr === getTodayStr()) {
                        todayLog.value = JSON.parse(JSON.stringify(dayData));
                    }
                    weeklyData.value[dayIdx] = dayData;
                    weeklyTotal.value = weeklyData.value.reduce((acc, d) => acc + calculateDailyStudyTotal(d.subjects || {}), 0);
                };

                // ── セッション編集モーダル ──
                const editingSession = ref(null);
                const editingDurationMin = ref(0);
                let editingDateStr = null;
                let editingDayIdx = null;
                let editingSessionIdx = null;

                const editSessionFromReport = (dateStr, dayIdx, sessionIdx) => {
                    const s = weeklyData.value[dayIdx]?.sessions?.[sessionIdx];
                    if (!s) return;
                    editingSession.value = { ...s };
                    editingDurationMin.value = Math.round(s.duration / 60);
                    editingDateStr = dateStr;
                    editingDayIdx = dayIdx;
                    editingSessionIdx = sessionIdx;
                };

                const confirmEditSession = async () => {
                    if (!editingSession.value) return;
                    const newDuration = editingDurationMin.value * 60;
                    if (newDuration < 60) { alert('1分以上に設定してください'); return; }
                    const dayData = JSON.parse(JSON.stringify(weeklyData.value[editingDayIdx]));
                    dayData.sessions[editingSessionIdx].duration = newDuration;
                    // endをstartから再計算
                    const startMs = new Date(dayData.sessions[editingSessionIdx].start).getTime();
                    dayData.sessions[editingSessionIdx].end = new Date(startMs + newDuration * 1000).toISOString();
                    // subjects再計算
                    const newSubjects = {};
                    for (const s of dayData.sessions) {
                        newSubjects[s.subject] = (newSubjects[s.subject] || 0) + s.duration;
                    }
                    dayData.subjects = newSubjects;
                    await saveDataForDate(editingDateStr, dayData);
                    if (editingDateStr === getTodayStr()) {
                        todayLog.value = JSON.parse(JSON.stringify(dayData));
                    }
                    weeklyData.value[editingDayIdx] = dayData;
                    weeklyTotal.value = weeklyData.value.reduce((acc, d) => acc + calculateDailyStudyTotal(d.subjects || {}), 0);
                    editingSession.value = null;
                };
                
                // セッション削除（ロールバック）
                const deleteSession = async (displayIdx) => {
                    if(!confirm('このセッションを削除しますか？')) return;
                    // displayIdxは逆順ソートのインデックス、元のsessions配列の対応を探す
                    const sorted = [...(todayLog.value.sessions || [])].sort((a,b)=>b.start.localeCompare(a.start));
                    const sessionToDelete = sorted[displayIdx];
                    if(!sessionToDelete) return;
                    
                    const origIdx = todayLog.value.sessions.findIndex(s => s.start === sessionToDelete.start && s.end === sessionToDelete.end && s.subject === sessionToDelete.subject);
                    if(origIdx === -1) return;
                    
                    // sessionsから削除
                    todayLog.value.sessions.splice(origIdx, 1);
                    
                    // subjects の合計時間を再計算（全sessionから積算）
                    const newSubjects = {};
                    for(const s of todayLog.value.sessions) {
                        newSubjects[s.subject] = (newSubjects[s.subject] || 0) + s.duration;
                    }
                    todayLog.value.subjects = newSubjects;
                    await saveData();
                };

                // Report: computed helpers
                const isCurrentWeek = computed(() => {
                    const today = new Date();
                    const weekStart = new Date(reportWeekStart.value);
                    const weekEnd = new Date(weekStart);
                    weekEnd.setDate(weekStart.getDate() + 6);
                    return today >= weekStart && today <= weekEnd;
                });

                const reportMonthValue = computed(() => {
                    const d = new Date(reportWeekStart.value);
                    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                });

                const todayMonthValue = computed(() => {
                    const d = new Date();
                    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                });

                const jumpToMonth = (monthStr) => {
                    if(!monthStr) return;
                    const [y, m] = monthStr.split('-').map(Number);
                    const target = new Date(y, m-1, 1);
                    // その月の最初の日曜日週に移動
                    reportWeekStart.value = target;
                    loadWeeklyReport();
                };
                
                const updateSubjectTime = async (sub, deltaMin) => {
                    const oldSec = todayLog.value.subjects[sub] || 0;
                    const newSec = Math.max(0, oldSec + (deltaMin * 60));
                    todayLog.value.subjects[sub] = newSec;
                    if(newSec === 0) delete todayLog.value.subjects[sub];
                    await saveData();
                };

                // Task Logic
                const tokenExpired = ref(false);
                const lastTokenRefresh = ref(Date.now());
                const checkTokenExpiry = () => {
                    const elapsed = Date.now() - lastTokenRefresh.value;
                    if (elapsed > 50 * 60 * 1000 && accessToken.value) tokenExpired.value = true;
                };
                let tokenCheckInterval = null;
                const startTokenCheck = () => {
                    if (tokenCheckInterval) clearInterval(tokenCheckInterval);
                    tokenCheckInterval = setInterval(() => { checkTokenExpiry(); }, 60000);
                };

                const refreshToken = async () => {
                    try {
                        const r = await signInWithPopup(auth, provider);
                        const credential = GoogleAuthProvider.credentialFromResult(r);
                        accessToken.value = credential.accessToken;
                        localStorage.setItem('google_tasks_token', credential.accessToken);
                        lastTokenRefresh.value = Date.now();
                        tokenExpired.value = false;
                        await fetchTasks();
                    } catch(e) {}
                };

                const fetchTasks = async () => { 
                    if(!accessToken.value) return; 
                    try {
                        const r = await fetch('https://tasks.googleapis.com/tasks/v1/lists/@default/tasks?showCompleted=true&showHidden=true', {
                            headers:{Authorization:`Bearer ${accessToken.value}`}
                        });
                        if (r.status === 401) { accessToken.value = null; localStorage.removeItem('google_tasks_token'); tokenExpired.value = true; return; }
                        const d = await r.json();
                        if(d.items) tasks.value = d.items;
                        tokenExpired.value = false;
                    } catch(e){} 
                };
                
                const createTask = async (e) => { 
                    if(e&&e.isComposing) return; 
                    if(!newTaskTitle.value.trim()) return;
                    const t = newTaskTitle.value; newTaskTitle.value="";
                    
                    if (isGuestMode.value) {
                        const localTask = { id: 'local_' + Date.now(), title: t, status: 'needsAction', updated: new Date().toISOString() };
                        tasks.value.unshift(localTask);
                        saveLocalTasks();
                    } else if (accessToken.value) {
                        tasks.value.unshift({id:"temp",title:t,status:'needsAction'}); 
                        try {
                            const response = await fetch('https://tasks.googleapis.com/tasks/v1/lists/@default/tasks', {
                                method:'POST',
                                headers:{Authorization:`Bearer ${accessToken.value}`,'Content-Type':'application/json'},
                                body:JSON.stringify({title:t})
                            });
                            if (response.status === 401) { tokenExpired.value = true; tasks.value = tasks.value.filter(task => task.id !== "temp"); return; }
                            fetchTasks();
                        } catch(e){} 
                    }
                };
                
                const toggleTaskStatus = async (t) => {
                    const oldStatus = t.status;
                    t.status = t.status === 'completed' ? 'needsAction' : 'completed';
                    if (isGuestMode.value) saveLocalTasks();
                    else if (accessToken.value && !t.id.startsWith('local_')) {
                        try {
                            const response = await fetch(`https://tasks.googleapis.com/tasks/v1/lists/@default/tasks/${t.id}`, {
                                method:'PATCH', headers:{Authorization:`Bearer ${accessToken.value}`,'Content-Type':'application/json'},
                                body:JSON.stringify({status:t.status})
                            });
                            if (response.status === 401) tokenExpired.value = true; t.status = oldStatus;
                        } catch(e) { t.status = oldStatus; }
                    }
                };

                const deleteTask = async (id) => {
                    const taskToDelete = tasks.value.find(t => t.id === id);
                    tasks.value = tasks.value.filter(t => t.id !== id);
                    if (isGuestMode.value) saveLocalTasks();
                    else if (accessToken.value && !id.startsWith('local_')) {
                        try {
                            const response = await fetch(`https://tasks.googleapis.com/tasks/v1/lists/@default/tasks/${id}`, {
                                method:'DELETE', headers:{Authorization:`Bearer ${accessToken.value}`}
                            });
                            if (response.status === 401) { tokenExpired.value = true; if (taskToDelete) tasks.value.push(taskToDelete); }
                        } catch(e) { if (taskToDelete) tasks.value.push(taskToDelete); }
                    }
                };

                const updateTaskTitle = async (t) => {
                    if (isGuestMode.value) saveLocalTasks();
                    else if (accessToken.value && !t.id.startsWith('local_')) {
                        try {
                            await fetch(`https://tasks.googleapis.com/tasks/v1/lists/@default/tasks/${t.id}`, {
                                method:'PATCH', headers:{Authorization:`Bearer ${accessToken.value}`,'Content-Type':'application/json'},
                                body:JSON.stringify({title:t.title})
                            });
                        } catch(e) {}
                    }
                };
                
                const addSubject = ()=>{ if(newSubjectName.value){ subjects.value.push(newSubjectName.value); newSubjectName.value=""; saveSettings(); } };
                const removeSubject = (i)=>{ if(confirm("削除？")){ subjects.value.splice(i,1); saveSettings(); } };

                const shiftWeek = (d) => { 
                    const n=new Date(reportWeekStart.value); 
                    n.setDate(n.getDate()+d); 
                    // 未来週への移動を禁止
                    if(d > 0) {
                        const today = new Date();
                        const weekStart = new Date(n);
                        weekStart.setDate(weekStart.getDate() - weekStart.getDay());
                        if(weekStart > today) return;
                    }
                    reportWeekStart.value=n; 
                    loadWeeklyReport(); 
                };
                const calculateDailyStudyTotal = (subs) => {
                    return Object.entries(subs || {}).reduce((acc, [k, v]) => k !== '休憩' ? acc + v : acc, 0);
                };
                const loadWeeklyReport = async () => {
                    const start=new Date(reportWeekStart.value); start.setDate(start.getDate()-start.getDay()); reportWeekStart.value=new Date(start);
                    const dates=[]; const promises=[];
                    for(let i=0;i<7;i++){
                        const d=new Date(start); d.setDate(start.getDate()+i); const s=d.toLocaleDateString('en-CA'); dates.push(s);
                        if(isGuestMode.value){ const l=localStorage.getItem(`studyMate_log_${s}`); promises.push(Promise.resolve(l?JSON.parse(l):{total:0,subjects:{},sessions:[]})); }
                        else if(user.value) promises.push(getDoc(doc(db,"users",user.value.uid,"logs",s)).then(x=>x.exists()?x.data():{total:0,subjects:{},sessions:[]}));
                        else promises.push(Promise.resolve({total:0,subjects:{},sessions:[]}));
                    }
                    const data=await Promise.all(promises);
                    const studyTotals = data.map(d => calculateDailyStudyTotal(d.subjects));
                    weeklyTotal.value = studyTotals.reduce((a,b)=>a+b,0);
                    weeklyDates.value = dates;
                    weeklyData.value = data;
                    // 今日の日付をデフォルト選択
                    const todayStr = new Date().toLocaleDateString('en-CA');
                    const todayIdx = dates.indexOf(todayStr);
                    if (todayIdx >= 0) {
                        selectedReportDate.value = dates[todayIdx];
                        selectedReportDetail.value = data[todayIdx].subjects;
                        selectedReportSessions.value = data[todayIdx].sessions || [];
                    } else {
                        selectedReportDate.value = null;
                        selectedReportDetail.value = null;
                        selectedReportSessions.value = [];
                    }
                };

                const selectReportDay = (dateStr, idx) => {
                    selectedReportDate.value = dateStr;
                    selectedReportDetail.value = weeklyData.value[idx]?.subjects || {};
                    selectedReportSessions.value = weeklyData.value[idx]?.sessions || [];
                };

                const formattedTime = computed(() => {
                    if (isTimerRunning.value || isPaused.value) {
                        if (timerMode.value === 'countdown' || breakMode.value) {
                            const remaining = Math.max(0, countdownDuration.value - elapsedTime.value);
                            return formatSeconds(remaining);
                        }
                        return formatSeconds(elapsedTime.value);
                    }
                    return formatSeconds(calculateDailyStudyTotal(todayLog.value.subjects));
                });
                
                const currentTotalTimeFormatted = computed(() => {
                    let total = calculateDailyStudyTotal(todayLog.value.subjects);
                    if (!breakMode.value && (isTimerRunning.value || isPaused.value)) {
                        total += elapsedTime.value;
                    }
                    return formatSeconds(total);
                });
                
                const filteredTasks = computed(() => { let t=tasks.value; if(!showCompletedTasks.value)t=t.filter(x=>x.status!=='completed'); return t.sort((a,b)=>a.status==='completed'?1:-1); });
                const weekRangeLabel = computed(() => { const s=reportWeekStart.value; const e=new Date(s); e.setDate(s.getDate()+6); return `${s.getMonth()+1}/${s.getDate()} - ${e.getMonth()+1}/${e.getDate()}`; });
                const formatSeconds = (sec) => { const h=Math.floor(sec/3600).toString().padStart(2,'0'); const m=Math.floor((sec%3600)/60).toString().padStart(2,'0'); const s=(sec%60).toString().padStart(2,'0'); return `${h}:${m}:${s}`; };
                const formatHours = (sec) => (sec/3600).toFixed(1);

                return {
                    user, isGuestMode, isAuthLoading, hardReset, login, startGuest, logout, guestLogout, currentTab, subjects, getTodayStr,
                    isTimerRunning, isPaused, timerMode, breakMode, handleSubjectClick, currentSubject, stopTimer, cancelSession, pauseTimer, resumeTimer, formattedTime, todayLog, formatSeconds,
                    showCountdownModal, targetSubject, customCountdownMin, setCountdown, adjustCustomTime, startCountdownSession, openCountdownModal,
                    isAlarmRinging, stopAlarm, notificationMode, setNotificationMode,
                    tasks, newTaskTitle, showCompletedTasks, filteredTasks, createTask, deleteTask, toggleTaskStatus, updateTaskTitle,
                    tokenExpired, refreshToken,
                    weekRangeLabel, shiftWeek, loadWeeklyReport, weeklyTotal, formatHours, selectedReportDate, selectedReportDetail, calculateDailyStudyTotal,
                    selectedReportSessions, weeklyDates, weeklyData, selectReportDay, deleteSession,
                    isCurrentWeek, reportMonthValue, todayMonthValue, jumpToMonth,
                    reportStartHour, reportEndHour, reportVisibleHours, visibleHourTicks,
                    sessionBlockStylePct, fmtTime, fmtTimeFull, allWeekSubjects,
                    subjectColor, setSubjectColor, resetSubjectColor,
                    reportMode, sessionDetailPopup, onSessionClick,
                    deleteSessionFromReport, editSessionFromReport, confirmEditSession, editingSession, editingDurationMin,
                    newSubjectName, addSubject, removeSubject, saveSettings, handleAudioUpload, testAudio, changeTimerMode,
                    showEditLog, updateSubjectTime,
                    isDarkMode, toggleDarkMode, themeColor, tempThemeColor, changeThemeColor, resetTheme,
                    tabAnimation, setTabAnimation,
                    currentTimeFormatted,
                    showTutorial, tutorialStep, tutorialSteps, 
                    nextTutorial:()=>{if(tutorialStep.value<tutorialSteps.length-1)tutorialStep.value++;else{showTutorial.value=false;localStorage.setItem('studyMate_seenTutorial','true');}}, 
                    startTutorial:()=>{showTutorial.value=true;tutorialStep.value=0;},
                    isMobile, isFullscreen, toggleFullscreen, isLandscape, isStandbyMode, currentTotalTimeFormatted
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
