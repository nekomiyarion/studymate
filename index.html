<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Mate</title>
    <link rel="icon" href="./studymate.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary-color)',
                        'primary-hover': 'var(--primary-hover)',
                        'primary-light': 'var(--primary-light)',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --primary-color: #2563eb; 
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
        }

        [v-cloak] { display: none; }
        .completed-task { text-decoration: line-through; color: #9ca3af; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        .tutorial-highlight { 
            position: relative; z-index: 50; 
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.7); 
            background-color: white; pointer-events: none;
        }
        .dark .tutorial-highlight { background-color: #1e293b; }

        @keyframes ring {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        .animate-ring { animation: ring 0.3s infinite; }
        
        @keyframes blink { 50% { opacity: 0.5; } }
        .animate-blink { animation: blink 1.5s infinite; }

        /* ▼▼▼ フラッシュ通知用のアニメーション（修正版） ▼▼▼ */
        /* 白ではなく、暗いグレーでゆっくり明滅するように変更 */
        @keyframes flash-screen {
            0%, 100% { background-color: rgba(0,0,0,0.9); }
            50% { background-color: rgba(70, 70, 70, 0.9); } 
        }
        .animate-flash-screen { animation: flash-screen 1.5s infinite ease-in-out; }
        /* ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */

        .modal-enter-active, .modal-leave-active { transition: opacity 0.3s; }
        .modal-enter-from, .modal-leave-to { opacity: 0; }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-up { animation: slideUp 0.3s ease-out; }

        /* スタンバイモード用のフォント設定 */
        .font-standby {
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        /* ========== タブ切り替えアニメーション ========== */
        /* fade */
        .tab-fade-enter-active { transition: opacity 0.25s ease, transform 0.25s ease; }
        .tab-fade-leave-active { transition: opacity 0.18s ease, transform 0.18s ease; }
        .tab-fade-enter-from  { opacity: 0; transform: translateY(8px); }
        .tab-fade-leave-to    { opacity: 0; transform: translateY(-8px); }

        /* slide */
        .tab-slide-enter-active { transition: opacity 0.28s cubic-bezier(.4,0,.2,1), transform 0.28s cubic-bezier(.4,0,.2,1); }
        .tab-slide-leave-active { transition: opacity 0.2s cubic-bezier(.4,0,.2,1), transform 0.2s cubic-bezier(.4,0,.2,1); position: absolute; width: 100%; }
        .tab-slide-enter-from  { opacity: 0; transform: translateX(32px); }
        .tab-slide-leave-to    { opacity: 0; transform: translateX(-32px); }

        /* zoom */
        .tab-zoom-enter-active { transition: opacity 0.25s ease, transform 0.25s cubic-bezier(.34,1.56,.64,1); }
        .tab-zoom-leave-active { transition: opacity 0.18s ease, transform 0.18s ease; position: absolute; width: 100%; }
        .tab-zoom-enter-from  { opacity: 0; transform: scale(0.95); }
        .tab-zoom-leave-to    { opacity: 0; transform: scale(1.03); }

        /* none */
        .tab-none-enter-active, .tab-none-leave-active { transition: none; }
        .tab-none-enter-from, .tab-none-leave-to { opacity: 1; }

        .tab-wrapper { position: relative; width: 100%; height: 100%; }
        /* ================================================= */
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="app" v-cloak class="h-full flex flex-col md:flex-row relative">
        
        <!-- ================= LOADING SCREEN ================= -->
        <div v-if="isAuthLoading" class="fixed inset-0 z-[100] bg-gray-50 dark:bg-gray-900 flex items-center justify-center">
            <div class="flex flex-col items-center">
                <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-primary mb-4"></div>
                <p class="text-gray-500 font-bold animate-pulse">Loading...</p>
            </div>
        </div>

        <!-- ================= Login / Guest Landing ================= -->
        <div v-else-if="!user && !isGuestMode" class="w-full h-full flex flex-col items-center justify-center bg-gray-50 dark:bg-gray-900 p-6 z-50 absolute inset-0 overflow-y-auto">
            <img src="./studymate.png" onerror="this.style.display='none'" alt="Logo" class="w-24 h-24 mb-4 rounded-2xl shadow-lg">
            
            <h1 class="text-5xl font-bold mb-2 text-primary tracking-tighter text-center transition-colors">Study Mate</h1>
            <p class="text-gray-500 dark:text-gray-400 mb-10 text-center">勉強も、休憩も、これひとつで。</p>
            
            <div class="space-y-4 w-full max-w-sm">
                <button @click="login" class="w-full px-8 py-4 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl shadow-lg hover:bg-primary-light dark:hover:bg-gray-700 flex items-center justify-center gap-4 font-bold text-gray-700 dark:text-gray-200 transition transform hover:scale-105">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6">
                    <span>Googleでログイン</span>
                </button>
                <button @click="startGuest" class="w-full px-8 py-4 bg-gray-800 dark:bg-gray-700 text-white rounded-xl shadow-lg hover:bg-gray-700 dark:hover:bg-gray-600 flex items-center justify-center gap-4 font-bold transition transform hover:scale-105">
                    <i class="fa-solid fa-user-secret"></i>
                    <span>ゲストとして利用する</span>
                </button>
            </div>
            
            <div class="mt-8 flex gap-6 text-xs text-gray-400">
                <a href="https://nekomiyarion.github.io/studymate/terms.html" target="_blank" class="hover:text-primary underline">利用規約</a>
                <a href="https://nekomiyarion.github.io/studymate/privacy.html" target="_blank" class="hover:text-primary underline">プライバシーポリシー</a>
            </div>

            <p class="mt-4 text-xs text-gray-300 max-w-sm text-center">
                ※ゲストモードの記録は、あとでログインした際にアカウントへ統合されます。
            </p>
            
            <div class="absolute bottom-4 right-4">
                <button @click="hardReset" class="text-xs text-gray-300 underline hover:text-red-500">
                    不具合時リセット
                </button>
            </div>
        </div>

        <!-- ================= Main App ================= -->
        <template v-else>
            
            <!-- Navigation (スタンバイモード時は非表示) -->
            <nav v-show="!isStandbyMode" class="md:w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col md:h-full flex-shrink-0 order-2 md:order-1 fixed md:relative bottom-0 w-full md:w-auto z-40 h-20 md:h-auto shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] md:shadow-none pb-safe">
                <div class="hidden md:flex items-center gap-3 p-6 border-b border-gray-100 dark:border-gray-700">
                    <img src="./studymate.png" onerror="this.style.display='none'" class="w-8 h-8 rounded-lg">
                    <span class="font-bold text-xl tracking-tight">Study Mate</span>
                </div>

                <div class="flex md:flex-col justify-around md:justify-start h-full md:p-4 md:gap-2 items-center md:items-stretch">
                    <button @click="currentTab = 'timer'" class="nav-btn p-2 rounded-xl flex flex-col md:flex-row items-center gap-1 md:gap-3 md:px-4 md:py-3 transition" 
                        :class="currentTab === 'timer' ? 'text-primary md:bg-primary-light dark:md:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i class="fa-solid fa-stopwatch text-xl md:text-lg"></i>
                        <span class="text-[10px] md:text-sm font-bold">記録</span>
                    </button>
                    <button @click="currentTab = 'tasks'" class="nav-btn p-2 rounded-xl flex flex-col md:flex-row items-center gap-1 md:gap-3 md:px-4 md:py-3 transition" 
                        :class="currentTab === 'tasks' ? 'text-primary md:bg-primary-light dark:md:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i class="fa-solid fa-list-check text-xl md:text-lg"></i>
                        <span class="text-[10px] md:text-sm font-bold">Todo</span>
                    </button>
                    <button @click="loadWeeklyReport(); currentTab = 'report'" class="nav-btn p-2 rounded-xl flex flex-col md:flex-row items-center gap-1 md:gap-3 md:px-4 md:py-3 transition" 
                        :class="currentTab === 'report' ? 'text-primary md:bg-primary-light dark:md:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i class="fa-solid fa-chart-simple text-xl md:text-lg"></i>
                        <span class="text-[10px] md:text-sm font-bold">レポート</span>
                    </button>
                    <button @click="currentTab = 'settings'" class="nav-btn p-2 rounded-xl flex flex-col md:flex-row items-center gap-1 md:gap-3 md:px-4 md:py-3 transition" 
                        :class="currentTab === 'settings' ? 'text-primary md:bg-primary-light dark:md:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i class="fa-solid fa-gear text-xl md:text-lg"></i>
                        <span class="text-[10px] md:text-sm font-bold">設定</span>
                    </button>
                </div>
            </nav>

            <!-- Content Area -->
            <main class="flex-1 h-full overflow-y-auto bg-gray-50 dark:bg-gray-900 p-4 md:p-8 pb-28 md:pb-8 order-1 md:order-2 relative transition-colors duration-300"
                  :class="{'!p-0 !pb-0 !overflow-hidden': isStandbyMode}">
                <div class="tab-wrapper">
                <transition :name="'tab-' + tabAnimation">
                <div :key="currentTab" class="w-full">
                
                <!-- 1. TIMER TAB (Modified for Standby Mode) -->
                <div v-if="currentTab === 'timer'" 
                     class="mx-auto min-h-full flex flex-col transition-all duration-500"
                     :class="isStandbyMode ? 'fixed inset-0 z-[200] bg-black text-white p-0 justify-center' : 'max-w-4xl pb-8'">
                    
                    <!-- Header (通常時のみ表示) -->
                    <header v-if="!isStandbyMode" class="mb-6 md:mb-10 flex justify-between items-center">
                        <h2 class="text-2xl font-bold">今日の学習</h2>
                        <div class="flex items-center gap-2">
                            <div class="flex items-center gap-1.5 text-xs font-mono text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-800 px-3 py-1.5 rounded-full shadow-sm border dark:border-gray-700">
                                <i class="fa-regular fa-clock text-[10px]"></i>
                                <span class="font-bold">{{ currentTimeFormatted }}</span>
                                <span class="text-gray-300 dark:text-gray-600">|</span>
                                <span>{{ new Date().toLocaleDateString('ja-JP', {month:'numeric', day:'numeric'}) }}</span>
                            </div>
                        </div>
                    </header>

                    <div class="flex-1 flex flex-col gap-6 md:gap-12 items-center justify-center"
                         :class="!isStandbyMode ? 'md:flex-row md:items-start' : 'w-full h-full'">
                        
                        <!-- Left: Display Area -->
                        <div class="flex flex-col items-center justify-center relative transition-all duration-500"
                             :class="isStandbyMode ? 'w-full h-full' : 'w-full md:w-1/2 py-6 bg-white dark:bg-gray-800 md:bg-transparent md:dark:bg-transparent rounded-3xl md:rounded-none shadow-sm md:shadow-none border md:border-none border-gray-100 dark:border-gray-700'">
                            
                            <!-- Status Indicators -->
                            <div v-if="breakMode && isTimerRunning" 
                                 class="font-bold px-3 py-1 rounded-full text-sm animate-pulse z-10"
                                 :class="isStandbyMode ? 'absolute top-6 right-6 bg-green-900/50 text-green-400' : 'absolute top-0 text-green-500 bg-green-50 dark:bg-green-900/30'">
                                <i class="fa-solid fa-mug-hot mr-1"></i>休憩中
                            </div>
                            <div v-else-if="timerMode === 'countdown' && isTimerRunning" 
                                 class="font-bold px-3 py-1 rounded-full text-sm z-10"
                                 :class="isStandbyMode ? 'absolute top-6 right-6 bg-gray-800/50 text-primary-light' : 'absolute top-0 text-primary bg-primary-light dark:bg-gray-700'">
                                <i class="fa-solid fa-hourglass-half mr-1"></i>カウントダウン
                            </div>
                            <div v-else-if="isPaused" 
                                 class="font-bold px-3 py-1 rounded-full text-sm animate-blink z-10"
                                 :class="isStandbyMode ? 'absolute top-6 right-6 bg-yellow-900/50 text-yellow-500' : 'absolute top-0 text-yellow-500 bg-yellow-50 dark:bg-yellow-900/30'">
                                <i class="fa-solid fa-pause mr-1"></i>一時停止中
                            </div>

                            <!-- Subject Label -->
                            <p class="font-bold mb-2 transition-all z-10"
                               :class="isStandbyMode ? 'text-gray-500 text-xl absolute top-6 left-8' : 'text-sm text-gray-500 dark:text-gray-400'">
                                {{ isTimerRunning || isPaused ? (breakMode ? 'REST TIME' : currentSubject) : 'Study Total (Excl. Break)' }}
                            </p>
                            
                            <!-- MAIN TIMER DISPLAY -->
                            <div class="font-mono font-bold font-standby tracking-tighter transition-all duration-300 leading-none select-none" 
                                 :class="[
                                    breakMode ? 'text-green-500' : (isPaused ? 'text-yellow-500' : (isStandbyMode ? 'text-white' : 'text-primary')),
                                    isStandbyMode ? 'text-[25vw]' : 'text-7xl md:text-8xl mb-2'
                                 ]">
                                {{ formattedTime }}
                            </div>

                            <!-- REALTIME TOTAL DISPLAY -->
                            <div v-if="isTimerRunning || isPaused" class="flex flex-col items-center mt-2 z-10">
                                <p class="font-mono font-bold transition-colors" 
                                   :class="isStandbyMode ? 'text-gray-500 text-2xl' : 'text-gray-400 dark:text-gray-500 text-lg'">
                                    <span class="text-xs mr-2 opacity-70">TOTAL</span>{{ currentTotalTimeFormatted }}
                                </p>
                            </div>
                            
                            <!-- Controls (Standby時は下部に薄く表示) -->
                            <div v-if="isTimerRunning || isPaused" class="w-full max-w-sm flex flex-col gap-2 z-10"
                                 :class="isStandbyMode ? 'absolute bottom-8 px-12 opacity-30 hover:opacity-100 transition-opacity' : 'mt-6'">
                                <!-- STOP / PAUSE / RESUME -->
                                <div class="flex gap-3">
                                    <button @click="stopTimer(false)" class="flex-1 py-5 text-white text-xl font-bold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2"
                                        :class="breakMode ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600'">
                                        <i class="fa-solid fa-stop"></i><span v-if="!isStandbyMode">STOP</span>
                                    </button>
                                    <button v-if="!isPaused" @click="pauseTimer" class="flex-1 py-5 bg-yellow-400 hover:bg-yellow-500 text-white text-xl font-bold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-pause"></i><span v-if="!isStandbyMode">PAUSE</span>
                                    </button>
                                    <button v-else @click="resumeTimer" class="flex-1 py-5 bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-play"></i><span v-if="!isStandbyMode">RESUME</span>
                                    </button>
                                </div>
                            </div>
                            
                            <p v-if="isTimerRunning && !isStandbyMode" class="text-center mt-3 text-gray-400 text-sm animate-pulse">{{ breakMode ? 'リラックス中...' : (timerMode === 'countdown' ? '集中...' : 'Focus...') }}</p>
                        </div>

                        <!-- Right: Buttons (スタンバイ時は非表示) -->
                        <div class="w-full md:w-1/2" v-if="!isStandbyMode && !isTimerRunning && !isPaused">
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4 mb-4">
                                <button v-for="sub in subjects" :key="sub" @click="handleSubjectClick(sub)"
                                    class="h-16 md:h-24 bg-white dark:bg-gray-800 border-2 border-primary-light dark:border-gray-600 hover:border-primary dark:hover:border-primary rounded-2xl font-bold text-gray-700 dark:text-gray-200 shadow-sm transition active:scale-95 flex flex-col items-center justify-center">
                                    <span class="text-lg">{{ sub }}</span>
                                    <span class="text-[10px] text-gray-400 font-normal md:mt-1">{{ timerMode === 'countdown' ? 'SET' : 'START' }}</span>
                                </button>
                            </div>

                            <button @click="openCountdownModal('休憩')" class="w-full mb-8 py-3 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 hover:bg-green-100 dark:hover:bg-green-900/40 text-green-600 dark:text-green-400 font-bold rounded-xl flex items-center justify-center gap-2 transition">
                                <i class="fa-solid fa-mug-hot"></i> 休憩タイマーをセット
                            </button>

                            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                                <div class="bg-gray-50 dark:bg-gray-700/50 px-5 py-3 border-b border-gray-100 dark:border-gray-700 text-xs font-bold text-gray-400 uppercase flex justify-between items-center">
                                    <span>本日の内訳</span>
                                    <button @click="currentTab='settings'; showEditLog=true" class="text-primary hover:text-primary-hover">
                                        <i class="fa-solid fa-pen"></i> 修正
                                    </button>
                                </div>
                                <div class="p-2 max-h-60 overflow-y-auto">
                                    <div v-if="Object.keys(todayLog.subjects).length === 0" class="text-center py-6 text-gray-400 text-sm">記録なし</div>
                                    <div v-for="(time, sub) in todayLog.subjects" :key="sub">
                                        <div v-if="time > 0" class="flex justify-between items-center text-sm border-b border-gray-100 dark:border-gray-700 last:border-0 p-3 hover:bg-gray-50 dark:hover:bg-gray-700/50">
                                            <span class="font-medium text-gray-700 dark:text-gray-300">{{ sub }}</span>
                                            <span class="font-mono font-bold px-2 py-0.5 rounded text-gray-800 dark:text-gray-100" 
                                                  :class="sub==='休憩'?'bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-400':'bg-primary-light dark:bg-primary/20 text-primary dark:text-primary'">
                                                {{ formatSeconds(time) }}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Fullscreen Button (Mobile Only, not in Standby) -->
                    <div v-if="isMobile && !isFullscreen && !isStandbyMode" class="fixed bottom-28 left-4 md:hidden slide-up z-30">
                        <button @click="toggleFullscreen" class="bg-gray-800/80 dark:bg-gray-700/80 backdrop-blur-sm text-white px-3 py-2 rounded-lg shadow-lg hover:bg-gray-900 dark:hover:bg-gray-600 transition transform active:scale-95 text-xs font-medium flex items-center gap-1.5">
                            <i class="fa-solid fa-expand text-sm"></i>
                            <span>全画面</span>
                        </button>
                    </div>
                </div>

                <!-- 2. TODO TAB -->
                <div v-if="currentTab === 'tasks'" class="max-w-2xl mx-auto min-h-full pb-8">
                    <header class="mb-6 flex flex-wrap gap-4 justify-between items-end">
                        <h2 class="text-2xl font-bold">Todoリスト</h2>
                        <div class="flex gap-2 items-center">
                            <div v-if="tokenExpired && !isGuestMode" class="flex items-center gap-1.5 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 px-2.5 py-1.5 rounded-lg">
                                <i class="fa-solid fa-circle-exclamation text-red-600 dark:text-red-400 text-xs"></i>
                                <span class="text-[10px] font-bold text-red-700 dark:text-red-300">セッション切れ</span>
                            </div>
                            <button v-if="!isGuestMode" @click="refreshToken" class="text-xs bg-white dark:bg-gray-800 border border-primary-light dark:border-gray-600 text-primary px-3 py-1.5 rounded-lg hover:bg-gray-50 transition">
                                <i class="fa-solid fa-rotate mr-1"></i>再接続
                            </button>
                            <label class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400 cursor-pointer bg-white dark:bg-gray-800 px-3 py-1.5 rounded border dark:border-gray-700">
                                <input type="checkbox" v-model="showCompletedTasks" class="rounded text-primary">
                                完了済み
                            </label>
                        </div>
                    </header>

                    <!-- Guest Mode Info Banner -->
                    <div v-if="isGuestMode" class="bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-800 rounded-xl p-4 mb-6 flex items-start gap-3">
                        <i class="fa-solid fa-info-circle text-yellow-600 dark:text-yellow-400 mt-0.5"></i>
                        <div class="flex-1">
                            <p class="text-sm font-bold text-yellow-800 dark:text-yellow-300 mb-1">ゲストモードで利用中</p>
                            <p class="text-xs text-yellow-700 dark:text-yellow-400 mb-2">タスクはこのデバイスに保存されます。ログインすると、Googleアカウントに同期できます。</p>
                            <button @click="login" class="text-xs bg-yellow-600 dark:bg-yellow-700 text-white px-3 py-1.5 rounded-lg hover:bg-yellow-700 dark:hover:bg-yellow-600 font-bold">
                                ログインして同期
                            </button>
                        </div>
                    </div>

                    <div class="flex gap-2 mb-6">
                        <div class="relative flex-1">
                            <span class="absolute left-4 top-3.5 text-gray-400"><i class="fa-solid fa-plus"></i></span>
                            <input type="text" v-model="newTaskTitle" placeholder="タスクを入力..." 
                                   class="w-full border-none rounded-xl px-10 py-3.5 shadow-sm outline-none ring-1 ring-gray-200 dark:ring-gray-700 focus:ring-2 focus:ring-primary bg-white dark:bg-gray-800 dark:text-white transition"
                                   @keydown.enter="createTask">
                        </div>
                        <button @click="createTask({isComposing:false})" class="bg-primary text-white px-4 rounded-xl shadow hover:bg-primary-hover font-bold">追加</button>
                    </div>
                    <div class="space-y-3">
                        <div v-if="filteredTasks.length === 0" class="text-center py-12 text-gray-400 bg-white dark:bg-gray-800 rounded-xl border border-dashed border-gray-300 dark:border-gray-700">
                            タスクはありません
                        </div>
                        <div v-for="task in filteredTasks" :key="task.id" 
                             class="group bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-start gap-3 transition hover:shadow-md">
                            <input type="checkbox" :checked="task.status === 'completed'" @change="toggleTaskStatus(task)" class="mt-1.5 w-5 h-5 cursor-pointer accent-primary">
                            <input v-model="task.title" @blur="updateTaskTitle(task)" @keydown.enter="$event.target.blur()" class="flex-1 bg-transparent border-none outline-none text-sm p-0 focus:ring-0 text-gray-800 dark:text-gray-100" :class="{ 'completed-task': task.status === 'completed' }">
                            <button @click="deleteTask(task.id)" class="text-gray-300 hover:text-red-400 px-2 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                </div>

                <!-- 3. REPORT TAB -->
                <div v-if="currentTab === 'report'" class="max-w-full mx-auto flex flex-col" style="height: calc(100vh - 80px); min-height: 0;">
                    <!-- ヘッダー -->
                    <div class="flex-shrink-0 mb-2 flex flex-wrap gap-2 justify-between items-center">
                        <h2 class="text-xl font-bold">週間レポート</h2>
                        <div class="flex items-center gap-2 flex-wrap">
                            <input type="month" :value="reportMonthValue" @change="jumpToMonth($event.target.value)"
                                   :max="todayMonthValue"
                                   class="text-xs border dark:border-gray-600 rounded-lg px-2 py-1.5 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 outline-none focus:ring-2 focus:ring-primary cursor-pointer">
                            <div class="flex items-center bg-white dark:bg-gray-800 rounded-lg shadow-sm border dark:border-gray-700 p-0.5">
                                <button @click="shiftWeek(-7)" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-gray-500"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                                <span class="px-2 text-xs font-bold">{{ weekRangeLabel }}</span>
                                <button @click="shiftWeek(7)" :disabled="isCurrentWeek" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition"
                                    :class="isCurrentWeek ? 'text-gray-200 dark:text-gray-700 cursor-not-allowed' : 'text-gray-500'">
                                    <i class="fa-solid fa-chevron-right text-xs"></i>
                                </button>
                            </div>
                            <!-- 操作モードボタン -->
                            <div class="flex items-center bg-white dark:bg-gray-800 rounded-lg shadow-sm border dark:border-gray-700 p-0.5 gap-0.5">
                                <button @click="reportMode = reportMode === 'edit' ? 'view' : 'edit'"
                                    class="px-2.5 py-1.5 rounded text-xs font-bold transition flex items-center gap-1"
                                    :class="reportMode==='edit' ? 'bg-yellow-400 text-white' : 'text-gray-400 hover:text-yellow-500 hover:bg-yellow-50 dark:hover:bg-gray-700'">
                                    <i class="fa-solid fa-pen text-[10px]"></i> 変更
                                </button>
                                <button @click="reportMode = reportMode === 'delete' ? 'view' : 'delete'"
                                    class="px-2.5 py-1.5 rounded text-xs font-bold transition flex items-center gap-1"
                                    :class="reportMode==='delete' ? 'bg-red-400 text-white' : 'text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-gray-700'">
                                    <i class="fa-solid fa-trash text-[10px]"></i> 削除
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- モード案内バナー -->
                    <div v-if="reportMode !== 'view'" class="flex-shrink-0 mb-2 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2"
                         :class="reportMode==='edit' ? 'bg-yellow-50 dark:bg-yellow-900/20 text-yellow-700 dark:text-yellow-300 border border-yellow-200 dark:border-yellow-800' : 'bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-300 border border-red-200 dark:border-red-800'">
                        <i :class="reportMode==='edit' ? 'fa-solid fa-pen' : 'fa-solid fa-trash'"></i>
                        {{ reportMode==='edit' ? '変更モード：タイムラインのセッションをタップして時間を変更' : '削除モード：タイムラインのセッションをタップして削除' }}
                        <button @click="reportMode='view'" class="ml-auto underline opacity-70 hover:opacity-100 font-normal">キャンセル</button>
                    </div>

                    <!-- サマリー（コンパクト） -->
                    <div class="flex-shrink-0 grid grid-cols-2 gap-2 mb-2">
                        <div class="bg-white dark:bg-gray-800 px-3 py-2 rounded-xl shadow-sm border border-primary-light dark:border-gray-700 flex items-center justify-between">
                            <span class="text-[10px] text-primary font-bold">週合計</span>
                            <span class="text-lg font-bold text-gray-800 dark:text-white">{{ formatHours(weeklyTotal) }}<span class="text-xs text-gray-400 ml-1">h</span></span>
                        </div>
                        <div class="bg-white dark:bg-gray-800 px-3 py-2 rounded-xl shadow-sm border border-green-100 dark:border-gray-700 flex items-center justify-between">
                            <span class="text-[10px] text-green-500 font-bold">日平均</span>
                            <span class="text-lg font-bold text-gray-800 dark:text-white">{{ formatHours(weeklyTotal / 7) }}<span class="text-xs text-gray-400 ml-1">h</span></span>
                        </div>
                    </div>

                    <!-- 教科凡例 -->
                    <div class="flex-shrink-0 flex flex-wrap gap-1.5 mb-2">
                        <div v-for="sub in allWeekSubjects" :key="sub"
                             class="flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold border"
                             :style="{ backgroundColor: subjectColor(sub) + '22', borderColor: subjectColor(sub) + '55', color: subjectColor(sub) }">
                            <span class="w-2 h-2 rounded-full inline-block" :style="{ backgroundColor: subjectColor(sub) }"></span>
                            {{ sub }}
                        </div>
                    </div>

                    <!-- ═══ タイムライングリッド（スクロールなし） ═══ -->
                    <div class="flex-1 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden flex flex-col min-h-0">
                        <!-- 内部スクロールなし：flex-1で残り全部 -->
                        <div class="flex-1 overflow-x-auto overflow-y-hidden min-h-0">
                            <div class="flex h-full" style="min-width: 480px;">

                                <!-- 時刻ラベル列 -->
                                <div class="flex-shrink-0 w-8 relative border-r border-gray-100 dark:border-gray-700"
                                     :style="{ paddingTop: '48px' }">
                                    <div class="absolute inset-x-0" :style="{ top: '48px', bottom: 0 }" >
                                        <div v-for="h in visibleHourTicks" :key="'lbl-'+h"
                                             class="absolute w-full text-right pr-1 text-[8px] font-mono text-gray-300 dark:text-gray-600 leading-none"
                                             :style="{ top: ((h - reportStartHour) / reportVisibleHours * 100) + '%' }">
                                            {{ String(h).padStart(2,'0') }}
                                        </div>
                                    </div>
                                </div>

                                <!-- 7日分の列 -->
                                <div v-for="(dateStr, idx) in weeklyDates" :key="dateStr"
                                     class="flex-1 border-r border-gray-100 dark:border-gray-700 last:border-r-0 flex flex-col min-w-0"
                                     style="min-width: 58px;">

                                    <!-- 日付ヘッダー（48px固定） -->
                                    <div class="flex-shrink-0 text-center py-1 border-b border-gray-100 dark:border-gray-700"
                                         style="height: 48px;"
                                         :class="dateStr === getTodayStr() ? 'bg-primary-light dark:bg-primary/20' : 'bg-white dark:bg-gray-800'">
                                        <div class="text-[11px] font-bold leading-tight"
                                             :class="dateStr === getTodayStr() ? 'text-primary' :
                                                     new Date(dateStr+'T12:00:00').getDay()===0 ? 'text-red-400' :
                                                     new Date(dateStr+'T12:00:00').getDay()===6 ? 'text-blue-400' : 'text-gray-600 dark:text-gray-300'">
                                            {{ ['日','月','火','水','木','金','土'][new Date(dateStr+'T12:00:00').getDay()] }}
                                        </div>
                                        <div class="text-[9px] text-gray-400 leading-tight">{{ dateStr.slice(5).replace('-','/') }}</div>
                                        <div class="text-[9px] font-mono font-bold leading-tight"
                                             :class="calculateDailyStudyTotal(weeklyData[idx]?.subjects || {}) > 0 ? 'text-primary' : 'text-gray-300 dark:text-gray-600'">
                                            {{ calculateDailyStudyTotal(weeklyData[idx]?.subjects || {}) > 0 ? formatHours(calculateDailyStudyTotal(weeklyData[idx]?.subjects || {}))+'h' : '—' }}
                                        </div>
                                    </div>

                                    <!-- タイムライン本体 -->
                                    <div class="flex-1 relative min-h-0">
                                        <!-- 時間グリッド線 -->
                                        <div v-for="h in visibleHourTicks" :key="'grid-'+dateStr+h"
                                             class="absolute w-full border-t border-gray-50 dark:border-gray-700/40 pointer-events-none"
                                             :style="{ top: ((h - reportStartHour) / reportVisibleHours * 100) + '%' }">
                                        </div>

                                        <!-- セッションブロック -->
                                        <template v-if="weeklyData[idx]?.sessions?.length > 0">
                                            <div v-for="(session, si) in weeklyData[idx].sessions" :key="si"
                                                 class="absolute left-0.5 right-0.5 rounded overflow-hidden transition-all"
                                                 :class="[
                                                    reportMode !== 'view' ? 'cursor-pointer hover:brightness-75 hover:ring-2 hover:ring-white' : 'cursor-pointer hover:brightness-90',
                                                    reportMode === 'delete' ? 'ring-1 ring-red-300' : ''
                                                 ]"
                                                 :style="sessionBlockStylePct(session)"
                                                 @click="onSessionClick(dateStr, idx, si, session)">
                                                <div class="px-1 py-0.5 h-full flex flex-col justify-start overflow-hidden"
                                                     :style="{ backgroundColor: subjectColor(session.subject), opacity: 0.92 }">
                                                    <div class="text-white text-[8px] font-bold truncate leading-tight drop-shadow-sm">{{ session.subject }}</div>
                                                    <div v-if="session.duration >= 1200" class="text-white/80 text-[7px] font-mono truncate leading-tight">{{ fmtTime(session.start) }}-{{ fmtTime(session.end) }}</div>
                                                </div>
                                                <!-- 削除モード時のオーバーレイ -->
                                                <div v-if="reportMode==='delete'" class="absolute inset-0 bg-red-500/20 flex items-center justify-center">
                                                    <i class="fa-solid fa-xmark text-white text-[10px] drop-shadow"></i>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- セッション詳細ポップアップ（viewモード時） -->
                <transition name="modal">
                <div v-if="sessionDetailPopup" class="fixed inset-0 z-50 bg-black/50 flex items-end md:items-center justify-center p-4"
                     @click.self="sessionDetailPopup = null">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 w-full max-w-sm shadow-2xl">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-4 h-4 rounded-full flex-shrink-0" :style="{ backgroundColor: subjectColor(sessionDetailPopup.subject) }"></div>
                            <h3 class="text-lg font-bold dark:text-white">{{ sessionDetailPopup.subject }}</h3>
                        </div>
                        <div class="bg-gray-50 dark:bg-gray-700 rounded-xl p-4 space-y-2 text-sm mb-4">
                            <div class="flex justify-between">
                                <span class="text-gray-500">開始</span>
                                <span class="font-mono font-bold">{{ fmtTimeFull(sessionDetailPopup.start) }}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-500">終了</span>
                                <span class="font-mono font-bold">{{ fmtTimeFull(sessionDetailPopup.end) }}</span>
                            </div>
                            <div class="flex justify-between border-t border-gray-200 dark:border-gray-600 pt-2">
                                <span class="text-gray-500">時間</span>
                                <span class="font-mono font-bold text-base" :style="{ color: subjectColor(sessionDetailPopup.subject) }">{{ formatSeconds(sessionDetailPopup.duration) }}</span>
                            </div>
                        </div>
                        <button @click="sessionDetailPopup = null" class="w-full py-2 text-gray-400 text-sm rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition">閉じる</button>
                    </div>
                </div>
                </transition>

                <!-- セッション編集モーダル -->
                <transition name="modal">
                <div v-if="editingSession" class="fixed inset-0 z-50 bg-black/60 flex items-end md:items-center justify-center p-4">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                        <h3 class="text-lg font-bold mb-4 dark:text-white flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full" :style="{ backgroundColor: subjectColor(editingSession.subject) }"></div>
                            {{ editingSession.subject }} を編集
                        </h3>
                        <div class="mb-4 p-3 bg-gray-50 dark:bg-gray-700 rounded-xl text-sm text-gray-500 dark:text-gray-400 font-mono">
                            {{ fmtTime(editingSession.start) }} 〜 {{ fmtTime(editingSession.end) }}
                        </div>
                        <label class="block text-xs font-bold text-gray-500 mb-2">時間（分）</label>
                        <div class="flex items-center gap-2 mb-6">
                            <button @click="editingDurationMin = Math.max(1, editingDurationMin - 5)" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold text-sm text-gray-700 dark:text-white">-5</button>
                            <button @click="editingDurationMin = Math.max(1, editingDurationMin - 1)" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold text-sm text-gray-700 dark:text-white">-1</button>
                            <input type="number" v-model.number="editingDurationMin" min="1"
                                class="flex-1 text-center border-b-2 border-primary text-xl font-bold outline-none bg-transparent dark:text-white py-1">
                            <span class="text-xs text-gray-400">分</span>
                            <button @click="editingDurationMin = editingDurationMin + 1" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold text-sm text-gray-700 dark:text-white">+1</button>
                            <button @click="editingDurationMin = editingDurationMin + 5" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold text-sm text-gray-700 dark:text-white">+5</button>
                        </div>
                        <div class="flex gap-2">
                            <button @click="editingSession = null; reportMode = 'edit'" class="flex-1 py-2 text-gray-500 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-sm">戻る</button>
                            <button @click="confirmEditSession" class="flex-1 py-2 bg-primary text-white rounded-lg font-bold shadow hover:bg-primary-hover text-sm">保存</button>
                        </div>
                    </div>
                </div>
                </transition>

                <!-- 4. SETTINGS TAB -->
                <div v-if="currentTab === 'settings'" class="max-w-xl mx-auto min-h-full pb-8">
                    <header class="mb-6"><h2 class="text-2xl font-bold">設定</h2></header>

                    <!-- Theme Settings -->
                    <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mb-6">
                        <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 font-bold text-sm bg-gray-50 dark:bg-gray-700/50">
                            <i class="fa-solid fa-palette mr-2 text-primary"></i>外観設定
                        </div>
                        <div class="p-6 space-y-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h4 class="font-bold text-sm">ダークモード</h4>
                                    <p class="text-xs text-gray-500">画面を暗くして目の負担を軽減します</p>
                                </div>
                                <button @click="toggleDarkMode" class="w-14 h-8 rounded-full p-1 transition-colors duration-300" :class="isDarkMode ? 'bg-primary' : 'bg-gray-300'">
                                    <div class="w-6 h-6 bg-white rounded-full shadow-md transform transition-transform duration-300" :class="isDarkMode ? 'translate-x-6' : ''"></div>
                                </button>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm mb-2">テーマカラー</h4>
                                <div class="flex items-center gap-4">
                                    <input type="color" v-model="tempThemeColor" @change="changeThemeColor" class="w-10 h-10 rounded cursor-pointer border-none">
                                    <span class="text-xs text-gray-500">現在の色: {{ themeColor }}</span>
                                    <button @click="resetTheme" class="ml-auto text-xs border px-3 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-700">デフォルトに戻す</button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Timer Mode -->
                    <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mb-6">
                        <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 font-bold text-sm bg-gray-50 dark:bg-gray-700/50">
                            <i class="fa-solid fa-wand-magic-sparkles mr-2 text-primary"></i>アニメーション設定
                        </div>
                        <div class="p-6 flex items-center justify-between">
                            <div>
                                <h4 class="font-bold text-sm">タブ切り替えアニメーション</h4>
                                <p class="text-xs text-gray-500">画面切り替え時のエフェクト</p>
                            </div>
                            <div class="flex bg-gray-100 dark:bg-gray-700 p-1 rounded-lg gap-1">
                                <button @click="setTabAnimation('fade')" class="px-3 py-1.5 rounded-md text-xs font-bold transition" :class="tabAnimation==='fade' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">フェード</button>
                                <button @click="setTabAnimation('slide')" class="px-3 py-1.5 rounded-md text-xs font-bold transition" :class="tabAnimation==='slide' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">スライド</button>
                                <button @click="setTabAnimation('zoom')" class="px-3 py-1.5 rounded-md text-xs font-bold transition" :class="tabAnimation==='zoom' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">ズーム</button>
                                <button @click="setTabAnimation('none')" class="px-3 py-1.5 rounded-md text-xs font-bold transition" :class="tabAnimation==='none' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">なし</button>
                            </div>
                        </div>
                    </section>

                    <!-- Timer Mode -->
                    <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mb-6">
                        <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 font-bold text-sm bg-gray-50 dark:bg-gray-700/50">
                            <i class="fa-solid fa-clock mr-2"></i>タイマー設定
                        </div>
                        <div class="p-6 flex items-center justify-between">
                            <div>
                                <h4 class="font-bold text-sm">タイマーモード</h4>
                                <p class="text-xs text-gray-500">学習タイマーの動作方式</p>
                            </div>
                            <div class="flex bg-gray-100 dark:bg-gray-700 p-1 rounded-lg">
                                <button @click="changeTimerMode('countup')" class="px-3 py-1.5 rounded-md text-sm font-bold transition" :class="timerMode==='countup' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">アップ</button>
                                <button @click="changeTimerMode('countdown')" class="px-3 py-1.5 rounded-md text-sm font-bold transition" :class="timerMode==='countdown' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">ダウン</button>
                            </div>
                        </div>
                    </section>

                    <!-- Notification Settings -->
                    <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mb-6">
                        <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 font-bold text-sm bg-gray-50 dark:bg-gray-700/50">
                            <i class="fa-solid fa-bell mr-2 text-primary"></i>通知設定
                        </div>
                        <div class="p-6">
                            <h4 class="font-bold text-sm mb-3">タイマー終了時の通知モード</h4>
                            <div class="grid grid-cols-2 gap-3">
                                <button @click="setNotificationMode('sound_vibrate')" 
                                    class="px-4 py-3 rounded-lg text-xs font-bold border transition flex flex-col items-center gap-2"
                                    :class="notificationMode === 'sound_vibrate' ? 'bg-primary-light dark:bg-gray-700 border-primary text-primary' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-600 text-gray-500'">
                                    <i class="fa-solid fa-bell text-lg"></i>
                                    音 + 振動
                                </button>
                                <button @click="setNotificationMode('vibrate_only')" 
                                    class="px-4 py-3 rounded-lg text-xs font-bold border transition flex flex-col items-center gap-2"
                                    :class="notificationMode === 'vibrate_only' ? 'bg-primary-light dark:bg-gray-700 border-primary text-primary' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-600 text-gray-500'">
                                    <i class="fa-solid fa-mobile-screen-button text-lg"></i>
                                    振動のみ
                                </button>
                                <button @click="setNotificationMode('silent')" 
                                    class="px-4 py-3 rounded-lg text-xs font-bold border transition flex flex-col items-center gap-2"
                                    :class="notificationMode === 'silent' ? 'bg-primary-light dark:bg-gray-700 border-primary text-primary' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-600 text-gray-500'">
                                    <i class="fa-solid fa-bell-slash text-lg"></i>
                                    音無し
                                </button>
                                <button @click="setNotificationMode('flash')" 
                                    class="px-4 py-3 rounded-lg text-xs font-bold border transition flex flex-col items-center gap-2"
                                    :class="notificationMode === 'flash' ? 'bg-primary-light dark:bg-gray-700 border-primary text-primary' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-600 text-gray-500'">
                                    <i class="fa-solid fa-bolt text-lg"></i>
                                    音無し + フラッシュ
                                </button>
                            </div>
                            <p class="text-xs text-gray-400 mt-2">
                                <span v-if="notificationMode==='sound_vibrate'">アラーム音と振動で通知します。</span>
                                <span v-else-if="notificationMode==='vibrate_only'">音は鳴らさず、振動だけで通知します。</span>
                                <span v-else-if="notificationMode==='silent'">音も振動もありません。「Time's Up」画面のみ表示されます。</span>
                                <span v-else-if="notificationMode==='flash'">音も振動もありませんが、画面がゆっくりと明滅します。</span>
                            </p>
                        </div>
                    </section>

                    <!-- Edit Log -->
                    <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mb-6">
                        <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 font-bold text-sm bg-gray-50 dark:bg-gray-700/50 text-red-500">
                            <i class="fa-solid fa-eraser mr-2"></i>記録の修正
