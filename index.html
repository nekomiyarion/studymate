                    }
                };

                const saveData = async () => {
                    await saveDataForDate(getTodayStr(), todayLog.value);
                };
                
                const loadSettings = async () => {
                    let d = { subjects: subjects.value, timerMode: 'countup', themeColor: '#2563eb', themeMode: 'system', notificationMode: 'sound_vibrate', notifSound: true, notifVibrate: true, notifFlash: false, tabAnimation: 'fade', weekStartDay: 1, subjectColors: {} };
                    try {
                        if(isGuestMode.value) {
                            const s = localStorage.getItem('studyMate_settings');
                            if(s) d = JSON.parse(s);
                        } else if(user.value) {
                            const s = await getDoc(doc(db, "users", user.value.uid, "settings", "config"));
                            if(s.exists()) d = { ...d, ...s.data() };
                        }
                    } catch(e) {}
                    subjects.value = d.subjects || subjects.value;
                    timerMode.value = d.timerMode || 'countup';
                    themeColor.value = d.themeColor || '#2563eb';
                    tempThemeColor.value = themeColor.value;
                    themeMode.value = d.themeMode || 'system';
                    notificationMode.value = d.notificationMode || 'sound_vibrate';
                    notifSound.value = d.notifSound !== undefined ? d.notifSound : true;
                    notifVibrate.value = d.notifVibrate !== undefined ? d.notifVibrate : true;
                    notifFlash.value = d.notifFlash !== undefined ? d.notifFlash : false;
                    tabAnimation.value = d.tabAnimation || 'fade';
                    weekStartDay.value = d.weekStartDay !== undefined ? d.weekStartDay : 1;
                    if (d.tabConfig) {
                        // 新しく追加されたタブを末尾に補完
                        const existingIds = d.tabConfig.map(c => c.id);
                        const merged = [...d.tabConfig];
                        ALL_TABS.forEach(t => { if (!existingIds.includes(t.id)) merged.push({ id: t.id, visible: true }); });
                        tabConfig.value = merged;
                    }
                    subjectColors.value = d.subjectColors || {};
                    applyTheme();
                };
                const saveSettings = async () => {
                    const d = { 
                        subjects: subjects.value, 
                        timerMode: timerMode.value, 
                        weekStartDay: weekStartDay.value,
                        tabConfig: tabConfig.value,
                        themeColor: themeColor.value, 
                        themeMode: themeMode.value,
                        notificationMode: notificationMode.value,
                        notifSound: notifSound.value,
                        notifVibrate: notifVibrate.value,
                        notifFlash: notifFlash.value,
                        tabAnimation: tabAnimation.value,
                        subjectColors: subjectColors.value
                    };
                    localStorage.setItem('studyMate_settings', JSON.stringify(d)); // 常にローカルにも保存
                    if(!isGuestMode.value && user.value) {
                        if (isOnline.value) {
                            try {
                                await setDoc(doc(db, "users", user.value.uid, "settings", "config"), d, {merge:true});
                            } catch(e) {
                                // オフライン時はlocalStorageのみ（次回起動時に自動反映）
                            }
                        }
                    }
                };

                const mergeGuestData = async (uid) => {
                    try {
                        const d = getTodayStr();
                        const local = JSON.parse(localStorage.getItem(`studyMate_log_${d}`) || 'null');
                        if(local) {
                            const s = await getDoc(doc(db, "users", uid, "logs", d));
                            const cloud = s.exists() ? s.data() : {total:0, subjects:{}};
                            for(const [k,v] of Object.entries(local.subjects||{})) cloud.subjects[k] = (cloud.subjects[k]||0)+v;
                            await setDoc(doc(db, "users", uid, "logs", d), cloud, {merge:true});
                            localStorage.removeItem(`studyMate_log_${d}`);
                            localStorage.removeItem('studyMate_guest_todayLog');
                        }
                    } catch(e) {}
                };

                // ===== LOCAL TASKS (GUEST MODE & OFFLINE MODE) =====
                const loadLocalTasks = () => {
                    try {
                        const stored = localStorage.getItem('studyMate_local_tasks');
                        if (stored) {
                            const localTasks = JSON.parse(stored);
                            const cloudTaskIds = tasks.value.map(t => t.id);
                            const uniqueLocalTasks = localTasks.filter(lt => !cloudTaskIds.includes(lt.id));
                            tasks.value = [...tasks.value, ...uniqueLocalTasks];
                        }
                    } catch(e) { console.error('Load local tasks error:', e); }
                };

                const saveLocalTasks = () => {
                    try {
                        localStorage.setItem('studyMate_local_tasks', JSON.stringify(tasks.value));
                        if (!isGuestMode.value) localStorage.setItem('studyMate_offline_tasks', 'true');
                        else localStorage.setItem('studyMate_guest_tasks', 'true');
                    } catch(e) { console.error('Save local tasks error:', e); }
                };

                const mergeGuestTasks = async () => {
                    try {
                        if (!accessToken.value) return;
                        const localTasks = JSON.parse(localStorage.getItem('studyMate_local_tasks') || '[]');
                        for (const task of localTasks) {
                            if (task.id && !task.id.startsWith('local_')) continue;
                            try {
                                await fetch('https://tasks.googleapis.com/tasks/v1/lists/@default/tasks', {
                                    method: 'POST',
                                    headers: { Authorization: `Bearer ${accessToken.value}`, 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ title: task.title, status: task.status || 'needsAction' })
                                });
                            } catch(e) {}
                        }
                        localStorage.removeItem('studyMate_local_tasks');
                        localStorage.removeItem('studyMate_guest_tasks');
                        localStorage.removeItem('studyMate_offline_tasks');
                        await fetchTasks();
                    } catch(e) {}
                };

                const handleSubjectClick = (sub) => {
                    if (timerMode.value === 'countdown') openCountdownModal(sub);
                    else startSession(sub, 'countup');
                };

                const openCountdownModal = (sub) => {
                    targetSubject.value = sub;
                    customCountdownMin.value = 5;
                    showCountdownModal.value = true;
                };

                const setCountdown = (m) => { customCountdownMin.value = m; };
                const adjustCustomTime = (d) => { customCountdownMin.value = Math.max(1, customCountdownMin.value + d); };

                const startCountdownSession = () => {
                    if (customCountdownMin.value < 0.1) { alert("時間は0.1分以上に設定してください"); return; }
                    showCountdownModal.value = false;
                    startSession(targetSubject.value, 'countdown', customCountdownMin.value * 60);
                };

                // --- TIMER CONTROL ---
                // セッション開始壁時計（実際の時刻記録用）
                const sessionWallStart = ref(null);

                const startSession = (sub, mode, durationSec = 0, wallStartOverride = null) => {
                    currentSubject.value = sub;
                    breakMode.value = (sub === '休憩');
                    countdownDuration.value = durationSec;
                    
                    if (!startTime.value) startTime.value = Date.now();
                    // wallStartOverride が渡された場合（復元時）はそちらを使う
                    sessionWallStart.value = wallStartOverride || new Date().toISOString();
                    elapsedTime.value = 0;
                    isTimerRunning.value = true;
                    isPaused.value = false;
                    
                    requestWakeLock(); // ★スリープ防止

                    // ★ローカルストレージに状態保存
                    localStorage.setItem(TIMER_STATE_KEY, JSON.stringify({
                        subject: sub, mode: mode, duration: durationSec,
                        startTime: startTime.value, breakMode: breakMode.value, isPaused: false,
                        wallStart: sessionWallStart.value
                    }));
                    
                    if (timerInterval) clearInterval(timerInterval);
                    timerInterval = setInterval(() => {
                        const now = Date.now();
                        const diff = Math.floor((now - startTime.value) / 1000);
                        elapsedTime.value = diff;
                        if (mode === 'countdown' && diff >= durationSec) stopTimer(true);
                    }, 1000);
                };

                const pauseTimer = () => {
                    clearInterval(timerInterval);
                    isPaused.value = true;
                    isTimerRunning.value = false;
                    pauseStartTime.value = Date.now();
                    releaseWakeLock();

                    // 一時停止前の勉強セグメントを中間記録（まだ保存しない・後で上書き）
                    // pauseWallStart: 一時停止が始まった実時刻（resume 時に休憩セグメントを確定するために使う）
                    pauseWallStart.value = new Date().toISOString();

                    const saved = JSON.parse(localStorage.getItem(TIMER_STATE_KEY) || '{}');
                    saved.isPaused = true;
                    saved.pauseStartTime = pauseStartTime.value;
                    saved.pauseWallStart = pauseWallStart.value;
                    localStorage.setItem(TIMER_STATE_KEY, JSON.stringify(saved));
                };

                const resumeTimer = () => {
                    const now = Date.now();
                    const pausedDuration = now - pauseStartTime.value;
                    startTime.value += pausedDuration;
                    isPaused.value = false;
                    isTimerRunning.value = true;

                    // ── 一時停止セグメントをセッションリストに記録 ──
                    if (pauseWallStart.value) {
                        const pStart = new Date(pauseWallStart.value);
                        const pEnd   = new Date(); // resume した実時刻
                        const pDur   = Math.round((pEnd - pStart) / 1000);
                        if (pDur > 0) {
                            if (!todayLog.value.sessions) todayLog.value.sessions = [];
                            todayLog.value.sessions.push({
                                subject:   '__pause__',
                                start:     pStart.toISOString(),
                                end:       pEnd.toISOString(),
                                duration:  pDur,
                                isPause:   true,
                            });
                            saveData(); // fire-and-forget
                        }
                        pauseWallStart.value = null;
                    }
                    // 再開後の新 wallStart を記録（このセグメントは stop 時に確定する）
                    sessionWallStart.value = new Date().toISOString();

                    requestWakeLock();

                    const saved = JSON.parse(localStorage.getItem(TIMER_STATE_KEY) || '{}');
                    saved.isPaused = false;
                    saved.startTime = startTime.value;
                    saved.wallStart = sessionWallStart.value;
                    delete saved.pauseStartTime;
                    delete saved.pauseWallStart;
                    localStorage.setItem(TIMER_STATE_KEY, JSON.stringify(saved));

                    timerInterval = setInterval(() => {
                        const n = Date.now();
                        const diff = Math.floor((n - startTime.value) / 1000);
                        elapsedTime.value = diff;
                        if ((timerMode.value === 'countdown' || breakMode.value) && diff >= countdownDuration.value && countdownDuration.value > 0) {
                            stopTimer(true);
                        }
                    }, 1000);
                };

                const stopTimer = async (finished = false) => {
                    clearInterval(timerInterval);
                    isTimerRunning.value = false;
                    isPaused.value = false;
                    startTime.value = 0;
                    
                    releaseWakeLock(); // ★スリープ防止解除
                    localStorage.removeItem(TIMER_STATE_KEY); // ★保存削除

                    const isNaturalFinish = (finished === true);
                    let addedTime = elapsedTime.value;
                    if ((timerMode.value === 'countdown' || breakMode.value) && countdownDuration.value > 0) {
                        addedTime = Math.min(elapsedTime.value, countdownDuration.value);
                    }

                    const sub = currentSubject.value;
                    if(sub) {
                        // wallStartは記録開始の実時刻
                        const now = new Date();
                        const wallStart = sessionWallStart.value 
                            ? new Date(sessionWallStart.value) 
                            : new Date(now.getTime() - addedTime * 1000);
                        // wallEndはwallStart + 実際に記録する秒数（ポーズ中を除く）
                        // これによりstart/end/durationが必ず整合する
                        const wallEnd = new Date(wallStart.getTime() + addedTime * 1000);
                        
                        // 日をまたいでいるか確認
                        const startDateStr = wallStart.toLocaleDateString('en-CA');
                        const endDateStr = wallEnd.toLocaleDateString('en-CA');
                        
                        if (startDateStr !== endDateStr) {
                            // 日またぎ：前日と当日に分割保存
                            // 前日分：wallStart ～ 23:59:59
                            const midnight = new Date(endDateStr + 'T00:00:00');
                            const prevDayDuration = Math.floor((midnight.getTime() - wallStart.getTime()) / 1000);
                            const todayDuration = Math.floor((wallEnd.getTime() - midnight.getTime()) / 1000);
                            
                            // 前日のデータを読み込んで保存
                            let prevLog = {total:0, subjects:{}, sessions:[]};
                            try {
                                if(isGuestMode.value) {
                                    const raw = localStorage.getItem(`studyMate_log_${startDateStr}`);
                                    if(raw) prevLog = JSON.parse(raw);
                                } else if(user.value) {
                                    const s = await getDoc(doc(db, "users", user.value.uid, "logs", startDateStr));
                                    if(s.exists()) prevLog = s.data();
                                }
                            } catch(e) {}
                            if(!prevLog.subjects) prevLog.subjects = {};
                            if(!prevLog.sessions) prevLog.sessions = [];
                            
                            if(prevDayDuration > 0) {
                                prevLog.subjects[sub] = (prevLog.subjects[sub] || 0) + prevDayDuration;
                                prevLog.sessions.push({ subject: sub, start: wallStart.toISOString(), end: new Date(midnight.getTime() - 1000).toISOString(), duration: prevDayDuration });
                                await saveDataForDate(startDateStr, prevLog);
                            }
                            
                            // 当日分
                            if(todayDuration > 0 && todayLog.value.subjects) {
                                todayLog.value.subjects[sub] = (todayLog.value.subjects[sub] || 0) + todayDuration;
                                if(!todayLog.value.sessions) todayLog.value.sessions = [];
                                todayLog.value.sessions.push({ subject: sub, start: midnight.toISOString(), end: wallEnd.toISOString(), duration: todayDuration });
                                await saveData();
                            }
                        } else {
                            // 通常（同日内）
                            if(todayLog.value.subjects) {
                                todayLog.value.subjects[sub] = (todayLog.value.subjects[sub] || 0) + addedTime;
                            }
                            if(!todayLog.value.sessions) todayLog.value.sessions = [];
                            todayLog.value.sessions.push({ subject: sub, start: wallStart.toISOString(), end: wallEnd.toISOString(), duration: addedTime });
                            await saveData();
                        }
                    }
                    
                    sessionWallStart.value = null;

                    if (isNaturalFinish) playAlarm();
                    
                    elapsedTime.value = 0;
                    currentSubject.value = null;
                    breakMode.value = false; 
                };

                // キャンセル：記録せずにタイマーをリセット
                const cancelSession = () => {
                    clearInterval(timerInterval);
                    isTimerRunning.value = false;
                    isPaused.value = false;
                    startTime.value = 0;
                    elapsedTime.value = 0;
                    currentSubject.value = null;
                    breakMode.value = false;
                    sessionWallStart.value = null;
                    releaseWakeLock();
                    localStorage.removeItem(TIMER_STATE_KEY);
                };

                // ★タイマー復元処理
                const restoreTimerState = () => {
                    const saved = localStorage.getItem(TIMER_STATE_KEY);
                    if (!saved) return;
                    try {
                        const state = JSON.parse(saved);
                        if (state.isPaused) {
                            currentSubject.value = state.subject;
                            breakMode.value = state.breakMode;
                            timerMode.value = state.mode;
                            countdownDuration.value = state.duration;
                            startTime.value = state.startTime;
                            pauseStartTime.value = state.pauseStartTime;
                            isPaused.value = true;
                            isTimerRunning.value = false;
                            elapsedTime.value = Math.floor((state.pauseStartTime - state.startTime) / 1000);
                        } else {
                            const now = Date.now();
                            const diff = Math.floor((now - state.startTime) / 1000);
                            if (state.mode === 'countdown' && diff >= state.duration) {
                                currentSubject.value = state.subject;
                                startTime.value = state.startTime;
                                elapsedTime.value = diff;
                                breakMode.value = state.breakMode;
                                countdownDuration.value = state.duration;
                                sessionWallStart.value = state.wallStart || new Date(state.startTime).toISOString();
                                stopTimer(true);
                            } else {
                                startTime.value = state.startTime;
                                const restoredWallStart = state.wallStart || new Date(state.startTime).toISOString();
                                startSession(state.subject, state.mode, state.duration, restoredWallStart);

                const playAlarm = () => {

                const handleAudioUpload = (e) => {

                const testAudio = () => {

                    a.loop = true; a.play();
                    setTimeout(() => { if(confirm("音が鳴りましたか？(OKで停止)")) a.pause(); else a.pause(); }, 500);
                };

                const changeTimerMode = (m) => { timerMode.value = m; saveSettings(); };
                const setNotificationMode = (m) => { notificationMode.value = m; saveSettings(); };
                const setTabAnimation = (m) => { tabAnimation.value = m; saveSettings(); };

                // ── タイムライン レイアウト ──
                // 表示時間範囲：週のセッションから動的計算（最低6時間表示）
                const reportStartHour = computed(() => {
                    let minH = 23;
                    let found = false;
                    for (const d of weeklyData.value) {
                        for (const s of (d.sessions || [])) {
                            const startDate = new Date(s.start);
                            const sessionDateStr = s.start.slice(0, 10);
                            // そのセッションのstart時刻が、その日付のものかチェック
                            const h = startDate.getHours();
                            // 異常値（別日のISOが混入）は除外: セッションdurationが48時間超はスキップ
                            if (s.duration > 0 && s.duration < 86400) {
                                if (h < minH) { minH = h; found = true; }
                            }
                        }
                    }
                    return found ? Math.max(0, minH - 1) : 6; // データなければ6時スタート
                });
                const reportEndHour = computed(() => {
                    let maxH = 0;
                    let found = false;
                    for (const d of weeklyData.value) {
                        for (const s of (d.sessions || [])) {
                            if (s.duration <= 0 || s.duration >= 86400) continue; // 異常値スキップ
                            const end = new Date(s.end);
                            const h = end.getHours() + (end.getMinutes() > 0 ? 1 : 0);
                            // endが翌日になっているケース(h=0で深夜0時超え)は23時扱い
                            const clampedH = Math.min(h, 24);
                            if (clampedH > maxH) { maxH = clampedH; found = true; }
                        }
                    }
                    if (!found) return reportStartHour.value + 8; // デフォルト8時間表示
                    const raw = Math.min(24, maxH + 1);
                    return Math.max(reportStartHour.value + 4, raw); // 最低4時間幅
                });
                const reportVisibleHours = computed(() => Math.max(1, reportEndHour.value - reportStartHour.value));
                const visibleHourTicks = computed(() => {
                    const ticks = [];
                    for (let h = reportStartHour.value; h <= reportEndHour.value; h++) ticks.push(h);
                    return ticks;
                });

                // セッションブロック位置（%ベース）
                const sessionBlockStylePct = (session) => {
                    if (!session.start || !session.end || session.duration <= 0) return { display: 'none' };
                    const start = new Date(session.start);
                    const startH = start.getHours() + start.getMinutes() / 60;
                    const topPct = ((startH - reportStartHour.value) / reportVisibleHours.value) * 100;
                    const durH = Math.min(session.duration, 86399) / 3600;
                    const heightPct = Math.max((durH / reportVisibleHours.value) * 100, 1.5);
                    // 表示範囲外ならhide
                    if (startH < reportStartHour.value - 0.5 || startH > reportEndHour.value + 0.5) return { display: 'none' };
                    return { top: topPct + '%', height: heightPct + '%' };
                };

                // ISO → "HH:MM"
                const fmtTime = (iso) => new Date(iso).toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
                // ISO → "M/D HH:MM"
                const fmtTimeFull = (iso) => {
                    const d = new Date(iso);
                    return `${d.getMonth()+1}/${d.getDate()} ${d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`;

                // 週の全教科リスト（凡例用）

                // セッションクリック処理（モードによって動作が変わる）
                const onSessionClick = (dateStr, dayIdx, sessionIdx, session) => {

                // ── セッション削除（レポートから） ──
                const deleteSessionFromReport = async (dateStr, dayIdx, sessionIdx) => {

                // ── セッション編集モーダル ──
                const editingSession = ref(null);
                const editingStartTime = ref('');  // "HH:MM"
                const editingEndTime = ref('');    // "HH:MM"
                const editingDurationMin = ref(0); // 表示・バリデーション用
                let editingDateStr = null;
                let editingDayIdx = null;
                let editingSessionIdx = null;

                // ISO文字列 → "HH:MM" 文字列
                const isoToHHMM = (iso) => {
                    const d = new Date(iso);
                    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
                };

                // "HH:MM" + 基準日付のISO → 同日のISO文字列を返す
                const hhmmToIso = (hhmm, baseDateIso) => {
                    const base = new Date(baseDateIso);
                    const [h, m] = hhmm.split(':').map(Number);
                    base.setHours(h, m, 0, 0);
                    return base.toISOString();
                };

                // 時刻変更時にdurationを再計算
                const onEditTimeChange = () => {
                    if (!editingStartTime.value || !editingEndTime.value) return;
                    const [sh, sm] = editingStartTime.value.split(':').map(Number);
                    const [eh, em] = editingEndTime.value.split(':').map(Number);
                    const diffMin = (eh * 60 + em) - (sh * 60 + sm);

                };

                const editSessionFromReport = (dateStr, dayIdx, sessionIdx) => {
                    const s = weeklyData.value[dayIdx]?.sessions?.[sessionIdx];

                    editingStartTime.value = isoToHHMM(s.start);

                const confirmEditSession = async () => {

                    const newStartIso = hhmmToIso(editingStartTime.value, editingSession.value.start);
                    const newEndIso   = hhmmToIso(editingEndTime.value,   editingSession.value.start);
                    const newDuration = editingDurationMin.value * 60;

                    const dayData = JSON.parse(JSON.stringify(weeklyData.value[editingDayIdx]));
                    dayData.sessions[editingSessionIdx].start    = newStartIso;
                    dayData.sessions[editingSessionIdx].end      = newEndIso;
                    dayData.sessions[editingSessionIdx].duration = newDuration;

                    // subjects 合計を再計算
                    const newSubjects = {};
                    for (const s of dayData.sessions) {
                        newSubjects[s.subject] = (newSubjects[s.subject] || 0) + s.duration;

                    editingSession.value = null;

                // セッション削除（ロールバック）
                const deleteSession = async (displayIdx) => {
                    if(!confirm('このセッションを削除しますか？')) return;
                    // displayIdxは逆順ソートのインデックス、元のsessions配列の対応を探す
                    const sorted = [...(todayLog.value.sessions || [])].sort((a,b)=>b.start.localeCompare(a.start));
                    const sessionToDelete = sorted[displayIdx];
                    if(!sessionToDelete) return;
                    
                    const origIdx = todayLog.value.sessions.findIndex(s => s.start === sessionToDelete.start && s.end === sessionToDelete.end && s.subject === sessionToDelete.subject);
                    if(origIdx === -1) return;
                    
                    // sessionsから削除
                    todayLog.value.sessions.splice(origIdx, 1);
                    
                    // subjects の合計時間を再計算（全sessionから積算）
                    const newSubjects = {};
                    for(const s of todayLog.value.sessions) {
                        newSubjects[s.subject] = (newSubjects[s.subject] || 0) + s.duration;
                    }
                    todayLog.value.subjects = newSubjects;
                    await saveData();

                // Report: computed helpers
                const isCurrentWeek = computed(() => {

                    const weekStart = new Date(reportWeekStart.value);
                    const weekEnd = new Date(weekStart);
                    weekEnd.setDate(weekStart.getDate() + 6);
                    return today >= weekStart && today <= weekEnd;
                });

                const reportMonthValue = computed(() => {
                    const d = new Date(reportWeekStart.value);
                    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                });

                const todayMonthValue = computed(() => {
                    const d = new Date();
                    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                });

                const jumpToMonth = (monthStr) => {
                    if(!monthStr) return;
                    const [y, m] = monthStr.split('-').map(Number);
                    const target = new Date(y, m-1, 1);
                    // その月の最初の日曜日週に移動
                    reportWeekStart.value = target;
                    loadWeeklyReport();
                };
                
                const updateSubjectTime = async (sub, deltaMin) => {
                    const oldSec = todayLog.value.subjects[sub] || 0;
                    const newSec = Math.max(0, oldSec + (deltaMin * 60));
                    todayLog.value.subjects[sub] = newSec;
                    if(newSec === 0) delete todayLog.value.subjects[sub];
                    await saveData();
                };

                // Task Logic
                const tokenExpired = ref(false);
                const lastTokenRefresh = ref(Date.now());
                const checkTokenExpiry = () => {
                    const elapsed = Date.now() - lastTokenRefresh.value;
                    if (elapsed > 50 * 60 * 1000 && accessToken.value) tokenExpired.value = true;
                };
                let tokenCheckInterval = null;
                const startTokenCheck = () => {
                    if (tokenCheckInterval) clearInterval(tokenCheckInterval);
                    tokenCheckInterval = setInterval(() => { checkTokenExpiry(); }, 60000);
                };

                // 無音のトークン自動更新（ポップアップなし）
                const silentRefreshToken = async () => {
                    if (!user.value) return;
                    try {
                        // Firebase の getIdToken は認証状態を維持するが Google Tasks には使えない
                        // 代わりに signInWithPopup の代わりに credential を取り直す
                        // まず既存のトークンが使えるか確認
                        const testRes = await fetch('https://tasks.googleapis.com/tasks/v1/lists/@default/tasks?maxResults=1', {
                            headers: { Authorization: `Bearer ${accessToken.value}` }
                        });
                        if (testRes.status === 401) {
                            // 期限切れ → ポップアップなしで再取得を試みる
                            // Google OAuth の silent flow: prompt=none
                            try {
                                const silentProvider = new GoogleAuthProvider();
                                silentProvider.addScope('https://www.googleapis.com/auth/tasks');
                                silentProvider.setCustomParameters({ prompt: 'none' });
                                const r = await signInWithPopup(auth, silentProvider);
                                const credential = GoogleAuthProvider.credentialFromResult(r);
                                if (credential?.accessToken) {
                                    accessToken.value = credential.accessToken;
                                    localStorage.setItem('google_tasks_token', credential.accessToken);
                                    lastTokenRefresh.value = Date.now();
                                    tokenExpired.value = false;
                                    await fetchTasks();
                                }
                            } catch(e) {
                                // prompt=none で失敗した場合は期限切れ表示
                                tokenExpired.value = true;
                            }
                        } else {
                            tokenExpired.value = false;
                        }
                    } catch(e) {}
                };

                const refreshToken = async () => {
                    try {
                        const r = await signInWithPopup(auth, provider);
                        const credential = GoogleAuthProvider.credentialFromResult(r);
                        accessToken.value = credential.accessToken;
                        localStorage.setItem('google_tasks_token', credential.accessToken);
                        lastTokenRefresh.value = Date.now();
                        tokenExpired.value = false;
                        await fetchTasks();
                    } catch(e) {}
                };

                const fetchTasks = async () => { 
                    if(!accessToken.value) return; 
                    try {
                        const r = await fetch('https://tasks.googleapis.com/tasks/v1/lists/@default/tasks?showCompleted=true&showHidden=true', {
                            headers:{Authorization:`Bearer ${accessToken.value}`}
                        });
                        if (r.status === 401) { accessToken.value = null; localStorage.removeItem('google_tasks_token'); tokenExpired.value = true; return; }
                        const d = await r.json();
                        if(d.items) tasks.value = d.items;
                        tokenExpired.value = false;

                const createTask = async (e) => {

                                headers:{Authorization:`Bearer ${accessToken.value}`,'Content-Type':'application/json'},

                            fetchTasks();

                    }

                const toggleTaskStatus = async (t) => {

                    else if (accessToken.value && !t.id.startsWith('local_')) {

                            const response = await fetch(`https://tasks.googleapis.com/tasks/v1/lists/@default/tasks/${t.id}`, {
                                method:'PATCH', headers:{Authorization:`Bearer ${accessToken.value}`,'Content-Type':'application/json'},
                                body:JSON.stringify({status:t.status})

                const updateTaskTitle = async (t) => {

                    else if (accessToken.value && !t.id.startsWith('local_')) {

                            await fetch(`https://tasks.googleapis.com/tasks/v1/lists/@default/tasks/${t.id}`, {

                                body:JSON.stringify({title:t.title})
                            });

                    }
                };
                
                const addSubject = ()=>{ if(newSubjectName.value){ subjects.value.push(newSubjectName.value); newSubjectName.value=""; saveSettings(); } };
                const removeSubject = (i)=>{ if(confirm("削除？")){ subjects.value.splice(i,1); saveSettings(); } };

                const shiftWeek = (d) => {

                        if(n > today) return;

                    reportWeekStart.value=n;

                };
                // ══════════════════════════════════════════════
                // テスト記録機能 v2
                // ══════════════════════════════════════════════
                const EXAM_KEY = 'studyMate_examRecords';
                const EXAM_META_KEY = 'studyMate_examMeta';

                const defaultExamTypes = [
                    { id: 'major', label: '大テスト', color: '#2563eb', builtin: true },

                ];
                const defaultExamSubjects = ['国語','数学','英語','理科','社会','保健体育','音楽','美術','技術'];
                const defaultExamNamePresets = ['前期中間','前期期末','後期中間','後期期末','単元末テスト','小テスト'];

                const newExamSubjectName = ref('');

                // フォーム初期値
                // 日付→年度を計算（4月始まり）
                const dateToNendo = (dateStr) => {

                // フィルター後に存在するテスト名一覧

                const examTypesWithData = computed(() => {

                            const withAvg = recs.filter(r => r.avg !== undefined && r.avg !== '');
                            const avgLinePct = withAvg.length > 0
                                ? withAvg.reduce((s, r) => s + (Number(r.avg) / r.maxScore), 0) / withAvg.length * 100
                                : null;
                            return { ...t, records: recs, avgLinePct };
                        })
                        .filter(t => t.records.length > 0);
                });

                // バー色：平均との比較で色分け、平均なしは種別色
                const examBarColor = (rec, fallbackColor) => {
                    if (rec.avg !== undefined && rec.avg !== '') {
                        return Number(rec.score) >= Number(rec.avg) ? '#4ade80' : '#f87171';
                    }
                    return fallbackColor || '#2563eb';
                };

                // 教科カラー（ハッシュベース）
                const examSubjectColor = (sub) => {
                    const colors = ['#2563eb','#7c3aed','#db2777','#059669','#d97706','#dc2626','#0284c7','#65a30d'];
                    let h = 0;
                    for (let i = 0; i < (sub||'').length; i++) h = (h * 31 + sub.charCodeAt(i)) % colors.length;
                    return colors[h];
                };

                // 種別のcolor/labelをidから取得
                const examTypeColor = (id) => {
                    const t = examTypes.value.find(x => x.id === id);
                    return t ? t.color : '#9ca3af';
                };
                const examTypeLabel = (id) => {
                    const t = examTypes.value.find(x => x.id === id);
                    return t ? t.label : id || '—';
                };

                // ──────── 永続化 ────────
                const loadExamData = () => {
                    try {
                        const raw = localStorage.getItem(EXAM_KEY);
                        if (raw) examRecords.value = JSON.parse(raw);
                        const meta = localStorage.getItem(EXAM_META_KEY);
                        if (meta) {
                            const m = JSON.parse(meta);
                            if (m.types)        examTypes.value        = m.types;
                            if (m.subjects)     examSubjects.value     = m.subjects;
                            if (m.namePresets)  examNamePresets.value  = m.namePresets;
                        }
                    } catch(e) {}
                };

                const saveMeta = () => {
                    localStorage.setItem(EXAM_META_KEY, JSON.stringify({
                        types: examTypes.value,
                        subjects: examSubjects.value,
                        namePresets: examNamePresets.value,
                    }));
                };

                const saveExamData = async () => {
                    localStorage.setItem(EXAM_KEY, JSON.stringify(examRecords.value));
                    saveMeta();
                    if (!isGuestMode.value && user.value && isOnline.value) {
                        try {
                            await setDoc(doc(db, 'users', user.value.uid, 'settings', 'examData'), {
                                records: examRecords.value,
                                types: examTypes.value,
                                subjects: examSubjects.value,
                                namePresets: examNamePresets.value,
                            }, { merge: true });
                        } catch(e) {}
                    }
                };

                const saveExamRecord = async () => {
                    const f = examForm.value;
                    if (!f.date) return;

                    const addSubjectAuto = (subj) => {
                        if (subj && !examSubjects.value.includes(subj)) examSubjects.value.push(subj);
                    };

                    if (f.bulkMode && f.bulkEntries.length > 0) {
                        // 大テスト一括登録
                        if (!f.name) return;
                        for (const entry of f.bulkEntries) {
                            if (!entry.subject || entry.score === '') continue;
                            examRecords.value.push({
                                date: f.date,
                                nendo: f.nendo || String(dateToNendo(f.date)),
                                type: f.type || 'major',
                                name: f.name,
                                unitName: '',
                                subject: entry.subject,
                                score: Number(entry.score),
                                maxScore: entry.maxScore !== '' && entry.maxScore !== undefined ? Number(entry.maxScore) : Number(f.maxScore) || 100,
                                avg: entry.avg !== '' ? Number(entry.avg) : undefined,
                                rank: entry.rank !== '' ? Number(entry.rank) : undefined,
                                rankOf: entry.rankOf !== '' ? Number(entry.rankOf) : undefined,
                                memo: f.memo,
                            });
                            addSubjectAuto(entry.subject);
                        }
                    } else {
                        // 通常登録
                        if (!f.subject || f.score === '') return;
                        examRecords.value.push({
                            date: f.date,
                            nendo: f.nendo || String(dateToNendo(f.date)),
                            type: f.type || 'major',
                            name: f.name,
                            unitName: f.unitName || '',
                            subject: f.subject,
                            score: Number(f.score),
                            maxScore: Number(f.maxScore) || 100,
                            avg: f.avg !== '' ? Number(f.avg) : undefined,
                            rank: f.rank !== '' ? Number(f.rank) : undefined,
                            rankOf: f.rankOf !== '' ? Number(f.rankOf) : undefined,
                            memo: f.memo,
                        });
                        addSubjectAuto(f.subject);
                    }
                    examRecords.value.sort((a, b) => a.date.localeCompare(b.date));
                    await saveExamData();
                    showExamForm.value = false;
                    resetExamForm();
                };

                // 日付変更時に年度を自動更新（手動変更していない場合）
                const onExamDateChange = () => {
                    if (!examForm.value.nendoCustom) {
                        examForm.value.nendo = String(dateToNendo(examForm.value.date));
                    }
                };

                // 一括登録用：行を追加
                const addBulkEntry = () => {
                    examForm.value.bulkEntries.push({ subject: '', score: '', maxScore: '', avg: '', rank: '', rankOf: '' });
                };
                const removeBulkEntry = (i) => {
                    examForm.value.bulkEntries.splice(i, 1);
                };
                // 大テストモード初期化：教科リストから自動補完
                const initBulkMode = () => {
                    if (examForm.value.bulkMode && examForm.value.bulkEntries.length === 0) {
                        examSubjects.value.forEach(s => {
                            examForm.value.bulkEntries.push({ subject: s, score: '', maxScore: '', avg: '', rank: '', rankOf: '' });
                        });
                        if (examForm.value.bulkEntries.length === 0) {
                            examForm.value.bulkEntries.push({ subject: '', score: '', maxScore: '', avg: '', rank: '', rankOf: '' });
                        }
                    }
                };

                // ── 編集モーダル ──
                const editExamModal = ref(false);
                const editExamIdx   = ref(null); // examRecords 内の index
                const editExamForm  = ref(null); // 編集中のコピー

                const openEditExam = (filteredIdx) => {
                    // filteredIdx は filteredExamRecords 内（新→旧順なので逆算）
                    const actualFilteredIdx = filteredExamRecords.value.length - 1 - filteredIdx;
                    const rec = filteredExamRecords.value[actualFilteredIdx];
                    const origIdx = examRecords.value.findIndex(r =>
                        r.date === rec.date && r.subject === rec.subject &&
                        r.score === rec.score && r.name === rec.name && r.type === rec.type);
                    if (origIdx < 0) return;
                    editExamIdx.value = origIdx;
                    editExamForm.value = { ...JSON.parse(JSON.stringify(rec)) };
                    // avg/rank/rankOf が undefined → ''
                    if (editExamForm.value.avg === undefined) editExamForm.value.avg = '';
                    if (editExamForm.value.rank === undefined) editExamForm.value.rank = '';
                    if (editExamForm.value.rankOf === undefined) editExamForm.value.rankOf = '';
                    if (!editExamForm.value.nendo) editExamForm.value.nendo = String(dateToNendo(editExamForm.value.date));
                    editExamModal.value = true;
                };

                const saveEditExam = async () => {
                    if (editExamIdx.value === null) return;
                    const f = editExamForm.value;
                    examRecords.value[editExamIdx.value] = {
                        ...examRecords.value[editExamIdx.value],
                        date:     f.date,
                        nendo:    f.nendo || String(dateToNendo(f.date)),
                        type:     f.type,
                        name:     f.name,
                        unitName: f.unitName || '',
                        subject:  f.subject,
                        score:    Number(f.score),
                        maxScore: Number(f.maxScore) || 100,
                        avg:      f.avg !== '' ? Number(f.avg) : undefined,
                        rank:     f.rank !== '' ? Number(f.rank) : undefined,
                        rankOf:   f.rankOf !== '' ? Number(f.rankOf) : undefined,
                        memo:     f.memo,
                    };
                    examRecords.value.sort((a, b) => a.date.localeCompare(b.date));
                    await saveExamData();
                    editExamModal.value = false;
                    editExamIdx.value   = null;
                    editExamForm.value  = null;
                };

                const deleteExamRecord = async (idx) => {
                    if (!confirm('この記録を削除しますか？')) return;
                    // filteredExamRecords 内の idx → examRecords 内の実際のインデックスを特定
                    const rec = filteredExamRecords.value[idx];
                    const origIdx = examRecords.value.findIndex(r =>
                        r.date === rec.date && r.subject === rec.subject &&
                        r.score === rec.score && r.name === rec.name && r.type === rec.type);
                    if (origIdx >= 0) examRecords.value.splice(origIdx, 1);
                    await saveExamData();
                };

                // 種別管理
                const addExamType = () => {
                    const name = newExamTypeName.value.trim();
                    if (!name) return;
                    const id = 'custom_' + Date.now();
                    const colors = ['#0891b2','#ca8a04','#15803d','#be123c','#6d28d9'];
                    const color = colors[examTypes.value.length % colors.length];
                    examTypes.value.push({ id, label: name, color, builtin: false });
                    newExamTypeName.value = '';
                    saveMeta();
                };
                const removeExamType = (i) => {
                    if (examTypes.value[i].builtin) return;
                    examTypes.value.splice(i, 1);
                    saveMeta();
                };

                // 教科管理
                const addExamSubject = () => {
                    const name = newExamSubjectName.value.trim();
                    if (!name || examSubjects.value.includes(name)) return;
                    examSubjects.value.push(name);
                    newExamSubjectName.value = '';
                    saveMeta();
                };
                const removeExamSubject = (i) => {
                    examSubjects.value.splice(i, 1);
                    saveMeta();
                };

                // テスト名プリセット管理
                const addExamNamePreset = () => {
                    const name = newExamNamePreset.value.trim();
                    if (!name || examNamePresets.value.includes(name)) return;
                    examNamePresets.value.push(name);
                    newExamNamePreset.value = '';
                    saveMeta();
                };
                const removeExamNamePreset = (i) => {
                    examNamePresets.value.splice(i, 1);
                    saveMeta();
                };

                const loadExamFromFirebase = async () => {
                    if (!user.value || isGuestMode.value || !isOnline.value) return;
                    try {
                        const s = await getDoc(doc(db, 'users', user.value.uid, 'settings', 'examData'));
                        if (s.exists()) {
                            const d = s.data();
                            if (d.records)      examRecords.value     = d.records;
                            if (d.types)        examTypes.value       = d.types;
                            if (d.subjects)     examSubjects.value    = d.subjects;
                            if (d.namePresets)  examNamePresets.value = d.namePresets;
                            localStorage.setItem(EXAM_KEY, JSON.stringify(examRecords.value));
                            saveMeta();
                        }
                    } catch(e) {}
                };


                // タイムライン：本体スクロール時にヘッダーの横位置を同期
                const syncHeaderScroll = (e) => {
                    const header = document.getElementById('timeline-header');
                    if (header) header.scrollLeft = e.target.scrollLeft;
                };

                const calculateDailyStudyTotal = (subs) => {
                    return Object.entries(subs || {}).reduce((acc, [k, v]) => k !== '休憩' ? acc + v : acc, 0);
                };
                const loadWeeklyReport = async () => {
                    const start=new Date(reportWeekStart.value);
                    // 週開始曜日に合わせてずらす (0=日, 1=月)
                    const dow = start.getDay(); // 0=日〜6=土
                    const offset = weekStartDay.value === 1
                        ? (dow === 0 ? -6 : 1 - dow)   // 月曜始まり
                        : -dow;                           // 日曜始まり
                    start.setDate(start.getDate() + offset);
                    reportWeekStart.value=new Date(start);
                    const dates=[]; const promises=[];
                    for(let i=0;i<7;i++){
                        const d=new Date(start); d.setDate(start.getDate()+i); const s=d.toLocaleDateString('en-CA'); dates.push(s);
                        if(isGuestMode.value){ const l=localStorage.getItem(`studyMate_log_${s}`); promises.push(Promise.resolve(l?JSON.parse(l):{total:0,subjects:{},sessions:[]})); }
                        else if(user.value) promises.push(getDoc(doc(db,"users",user.value.uid,"logs",s)).then(x=>x.exists()?x.data():{total:0,subjects:{},sessions:[]}));
                        else promises.push(Promise.resolve({total:0,subjects:{},sessions:[]}));
                    }
                    const data=await Promise.all(promises);
                    const studyTotals = data.map(d => calculateDailyStudyTotal(d.subjects));
                    weeklyTotal.value = studyTotals.reduce((a,b)=>a+b,0);
                    weeklyDates.value = dates;
                    weeklyData.value = data;
                    // 今日の日付をデフォルト選択
                    const todayStr = new Date().toLocaleDateString('en-CA');
                    const todayIdx = dates.indexOf(todayStr);
                    if (todayIdx >= 0) {
                        selectedReportDate.value = dates[todayIdx];
                        selectedReportDetail.value = data[todayIdx].subjects;
                        selectedReportSessions.value = data[todayIdx].sessions || [];
                    } else {
                        selectedReportDate.value = null;
                        selectedReportDetail.value = null;
                        selectedReportSessions.value = [];
                    }
                };

                const selectReportDay = (dateStr, idx) => {
                    selectedReportDate.value = dateStr;
                    selectedReportDetail.value = weeklyData.value[idx]?.subjects || {};
                    selectedReportSessions.value = weeklyData.value[idx]?.sessions || [];
                };

                const formattedTime = computed(() => {
                    if (isTimerRunning.value || isPaused.value) {
                        if (timerMode.value === 'countdown' || breakMode.value) {
                            const remaining = Math.max(0, countdownDuration.value - elapsedTime.value);
                            return formatSeconds(remaining);
                        }
                        return formatSeconds(elapsedTime.value);
                    }
                    return formatSeconds(calculateDailyStudyTotal(todayLog.value.subjects));
                });
                
                const currentTotalTimeFormatted = computed(() => {
                    let total = calculateDailyStudyTotal(todayLog.value.subjects);
                    if (!breakMode.value && (isTimerRunning.value || isPaused.value)) {
                        total += elapsedTime.value;
                    }
                    return formatSeconds(total);
                });
                
                const filteredTasks = computed(() => { let t=tasks.value; if(!showCompletedTasks.value)t=t.filter(x=>x.status!=='completed'); return t.sort((a,b)=>a.status==='completed'?1:-1); });
                const weekRangeLabel = computed(() => { const s=reportWeekStart.value; const e=new Date(s); e.setDate(s.getDate()+6); return `${s.getMonth()+1}/${s.getDate()} - ${e.getMonth()+1}/${e.getDate()}`; });
                const formatSeconds = (sec) => { const h=Math.floor(sec/3600).toString().padStart(2,'0'); const m=Math.floor((sec%3600)/60).toString().padStart(2,'0'); const s=(sec%60).toString().padStart(2,'0'); return `${h}:${m}:${s}`; };
                const formatHours = (sec) => (sec/3600).toFixed(1);

                return {
                    user, isGuestMode, isAuthLoading, isOnline, weekStartDay, hardReset, login, startGuest, logout, guestLogout, currentTab, subjects, getTodayStr,
                    loginWithEmail, resetPassword, emailLoginForm, emailAuthError, showEmailAuth,
                    showAccountSettings, linkEmailForm, linkEmailError, linkGoogle, linkEmail, accountMessage, linkedProviders,
                    isTimerRunning, isPaused, timerMode, breakMode, handleSubjectClick, currentSubject, stopTimer, cancelSession, pauseTimer, resumeTimer, formattedTime, todayLog, formatSeconds, pauseWallStart,
                    showCountdownModal, targetSubject, customCountdownMin, setCountdown, adjustCustomTime, startCountdownSession, openCountdownModal,
                    isAlarmRinging, stopAlarm, notificationMode, setNotificationMode,
                    tasks, newTaskTitle, showCompletedTasks, filteredTasks, createTask, deleteTask, toggleTaskStatus, updateTaskTitle,
                    tokenExpired, refreshToken,
                    weekRangeLabel, shiftWeek, loadWeeklyReport, syncHeaderScroll,
                    examRecords, examTypes, examSubjects, examNamePresets, examNameList,
                    examForm, showExamForm, showExamSettings, showExamRecordList, resetExamForm, onExamDateChange,
                    editExamModal, editExamIdx, editExamForm, openEditExam, saveEditExam,
                    dateToNendo,
                    examFilterType, examFilterSubject, examFilterName,
                    filteredExamRecords, examRecordSubjects, examRecordNames, examTypesWithData,
                    newExamTypeName, newExamSubjectName, newExamNamePreset,
                    saveExamRecord, deleteExamRecord, addBulkEntry, removeBulkEntry, initBulkMode,
                    addExamType, removeExamType, addExamSubject, removeExamSubject,
                    addExamNamePreset, removeExamNamePreset,
                    examBarColor, examSubjectColor, examTypeColor, examTypeLabel, weeklyTotal, formatHours, selectedReportDate, selectedReportDetail, calculateDailyStudyTotal,
                    selectedReportSessions, weeklyDates, weeklyData, selectReportDay, deleteSession,
                    isCurrentWeek, reportMonthValue, todayMonthValue, jumpToMonth,
                    reportStartHour, reportEndHour, reportVisibleHours, visibleHourTicks,
                    sessionBlockStylePct, fmtTime, fmtTimeFull, allWeekSubjects,
                    subjectColor, setSubjectColor, resetSubjectColor,
                    reportMode, sessionDetailPopup, onSessionClick, selectedDayDetail,
                    deleteSessionFromReport, editSessionFromReport, confirmEditSession, editingSession, editingStartTime, editingEndTime, editingDurationMin, onEditTimeChange,
                    newSubjectName, addSubject, removeSubject, saveSettings, handleAudioUpload, testAudio, changeTimerMode,
                    showEditLog, updateSubjectTime,
                    showSettingAppearance, showSettingNotif, showSettingAnimation, showSettingTabs, showSettingWeek, showSettingAccount,
                    showSubjectEditor, subjectDragStart, subjectDragOver, subjectDrop, subjectDragEnd,
                    notifSound, notifVibrate, notifFlash,
                    silentRefreshToken,
                    isDarkMode, themeMode, setThemeMode, themeColor, tempThemeColor, changeThemeColor, resetTheme,
                    tabAnimation, setTabAnimation,
                    currentTimeFormatted,
                    showTutorial, tutorialStep, tutorialSteps, 
                    nextTutorial:()=>{if(tutorialStep.value<tutorialSteps.length-1)tutorialStep.value++;else{showTutorial.value=false;localStorage.setItem('studyMate_seenTutorial','true');}}, 
                    startTutorial:()=>{showTutorial.value=true;tutorialStep.value=0;},
                    isMobile, isFullscreen, toggleFullscreen, isLandscape, isStandbyMode, currentTotalTimeFormatted,
                    tabConfig, visibleTabs, hiddenTabs, getTabInfo, openHiddenTab,
                    toggleTabVisible, moveTab, tabDragIdx, tabDragStart, tabDragOver, tabDrop, ALL_TABS
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
