<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Mate</title>
    <link rel="icon" href="./studymate.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary-color)',
                        'primary-hover': 'var(--primary-hover)',
                        'primary-light': 'var(--primary-light)',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --primary-color: #2563eb; 
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
        }

        [v-cloak] { display: none; }
        .completed-task { text-decoration: line-through; color: #9ca3af; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        .tutorial-highlight { 
            position: relative; z-index: 50; 
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.7); 
            background-color: white; pointer-events: none;
        }
        .dark .tutorial-highlight { background-color: #1e293b; }

        @keyframes ring {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        .animate-ring { animation: ring 0.3s infinite; }
        
        @keyframes blink { 50% { opacity: 0.5; } }
        .animate-blink { animation: blink 1.5s infinite; }

        /* ▼▼▼ フラッシュ通知用のアニメーション（修正版） ▼▼▼ */
        /* 白ではなく、暗いグレーでゆっくり明滅するように変更 */
        @keyframes flash-screen {
            0%, 100% { background-color: rgba(0,0,0,0.9); }
            50% { background-color: rgba(70, 70, 70, 0.9); } 
        }
        .animate-flash-screen { animation: flash-screen 1.5s infinite ease-in-out; }
        /* ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */

        .modal-enter-active, .modal-leave-active { transition: opacity 0.3s; }
        .modal-enter-from, .modal-leave-to { opacity: 0; }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-up { animation: slideUp 0.3s ease-out; }

        /* スタンバイモード用のフォント設定 */
        .font-standby {
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        /* ========== タブ切り替えアニメーション ========== */
        /* fade */
        .tab-fade-enter-active { 
            transition: opacity 0.22s ease, transform 0.22s ease; 
            will-change: opacity, transform;
        }
        .tab-fade-leave-active { 
            transition: opacity 0.18s ease, transform 0.18s ease; 
            position: absolute; width: 100%;
            will-change: opacity, transform;
        }
        .tab-fade-enter-from  { opacity: 0; transform: translateY(6px); }
        .tab-fade-leave-to    { opacity: 0; transform: translateY(-6px); }

        /* slide */
        .tab-slide-enter-active { transition: opacity 0.28s cubic-bezier(.4,0,.2,1), transform 0.28s cubic-bezier(.4,0,.2,1); }
        .tab-slide-leave-active { transition: opacity 0.2s cubic-bezier(.4,0,.2,1), transform 0.2s cubic-bezier(.4,0,.2,1); position: absolute; width: 100%; }
        .tab-slide-enter-from  { opacity: 0; transform: translateX(32px); }
        .tab-slide-leave-to    { opacity: 0; transform: translateX(-32px); }

        /* zoom */
        .tab-zoom-enter-active { 
            transition: opacity 0.22s ease, transform 0.22s cubic-bezier(.25, .46, .45, .94); 
            will-change: opacity, transform;
        }
        .tab-zoom-leave-active { 
            transition: opacity 0.16s ease, transform 0.16s ease; 
            position: absolute; width: 100%;
            will-change: opacity, transform;
        }
        .tab-zoom-enter-from  { opacity: 0; transform: scale(0.97); }
        .tab-zoom-leave-to    { opacity: 0; transform: scale(1.01); }

        /* none */
        .tab-none-enter-active, .tab-none-leave-active { transition: none; }
        .tab-none-enter-from, .tab-none-leave-to { opacity: 1; }

        .tab-wrapper { position: relative; width: 100%; height: 100%; }
        /* ================================================= */

        /* ========== スマホ横画面レイアウト ========== */
        .landscape-mobile-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            height: 100%;
            padding: 8px 4px;
            gap: 4px;
        }
        .landscape-mobile-nav .nav-icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 18px;
            transition: all 0.15s;
            gap: 2px;
        }
        /* ============================================ */
    </style>
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Study Mate">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">

    <!-- Service Worker 登録 + アップデート通知 UI -->
    <script>
    (function() {
        if (!('serviceWorker' in navigator)) return;

        navigator.serviceWorker.register('./service-worker.js').then((reg) => {
            console.log('[PWA] Service Worker registered:', reg.scope);
            setTimeout(() => checkForUpdate(reg), 3000);
            reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        showUpdateBanner();
                    }
                });
            });
        }).catch(err => console.warn('[PWA] SW registration failed:', err));

        function checkForUpdate(reg) {
            if (!navigator.onLine) return;
            if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'CHECK_UPDATE' });
            }
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'UPDATE_RESULT') {
                    if (event.data.hasUpdate) showUpdateBanner();
                }
            });
        }

        function showUpdateBanner() {
            if (document.getElementById('pwa-update-banner')) return;
            const banner = document.createElement('div');
            banner.id = 'pwa-update-banner';
            banner.style.cssText = `
                position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
                background: #1e40af; color: white; padding: 12px 20px;
                border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                display: flex; align-items: center; gap: 12px;
                z-index: 9999; font-family: sans-serif; font-size: 14px;
                max-width: 90vw;
            `;
            banner.innerHTML = `
                <span>🎉 アップデートがあります！</span>
                <button onclick="location.reload()" style="
                    background: white; color: #1e40af; border: none;
                    padding: 6px 14px; border-radius: 8px; font-weight: bold;
                    cursor: pointer; font-size: 13px;
                ">今すぐ更新</button>
                <button onclick="this.parentElement.remove()" style="
                    background: transparent; color: rgba(255,255,255,0.7);
                    border: none; cursor: pointer; font-size: 18px; line-height: 1;
                ">×</button>
            `;
            document.body.appendChild(banner);
            setTimeout(() => banner && banner.remove(), 10000);
        }
    })();
    </script>

</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="app" v-cloak class="h-full flex flex-col md:flex-row relative">
        
        <!-- ================= LOADING SCREEN ================= -->

                <p class="text-gray-500 font-bold animate-pulse">Loading...</p>
            </div>
        </div>

            <h1 class="text-5xl font-bold mb-2 text-primary tracking-tighter text-center transition-colors">Study Mate</h1>
            <p class="text-gray-500 dark:text-gray-400 mb-8 text-center">勉強も、休憩も、これひとつで。</p>

            <!-- メール認証フォーム（表示/非表示切り替え） -->

                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-lg dark:text-white">{{ emailLoginForm.mode === 'login' ? 'メールでログイン' : 'アカウント作成' }}</h3>
                    <button @click="showEmailAuth = false" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3">
                    <input type="email" v-model="emailLoginForm.email" placeholder="メールアドレス"
                        class="w-full border dark:border-gray-600 rounded-lg px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                    <input type="password" v-model="emailLoginForm.password" placeholder="パスワード（6文字以上）"
                        class="w-full border dark:border-gray-600 rounded-lg px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white"
                        @keydown.enter="loginWithEmail">
                    <input v-if="emailLoginForm.mode === 'register'" type="password" v-model="emailLoginForm.confirm" placeholder="パスワード確認"
                        class="w-full border dark:border-gray-600 rounded-lg px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                    <p v-if="emailAuthError" class="text-xs text-red-500 bg-red-50 dark:bg-red-900/20 px-3 py-2 rounded-lg">{{ emailAuthError }}</p>
                    <button @click="loginWithEmail" class="w-full py-3 bg-primary text-white rounded-xl font-bold text-sm hover:bg-primary-hover transition shadow">
                        {{ emailLoginForm.mode === 'login' ? 'ログイン' : 'アカウントを作成' }}
                    </button>
                    <div class="flex justify-between text-xs text-primary">
                        <button @click="emailLoginForm.mode = emailLoginForm.mode === 'login' ? 'register' : 'login'; emailAuthError=''" class="hover:underline">
                            {{ emailLoginForm.mode === 'login' ? '新規アカウントを作成' : 'ログインに戻る' }}
                        </button>
                        <button v-if="emailLoginForm.mode === 'login'" @click="resetPassword" class="hover:underline">パスワードを忘れた</button>
                    </div>
                </div>
            </div>

            <div v-else class="space-y-3 w-full max-w-sm">
                <button @click="login" class="w-full px-8 py-4 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl shadow-lg hover:bg-primary-light dark:hover:bg-gray-700 flex items-center justify-center gap-4 font-bold text-gray-700 dark:text-gray-200 transition transform hover:scale-105">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6">
                    <span>Googleでログイン</span>
                </button>
                <button @click="showEmailAuth = true; emailLoginForm.mode = 'login'; emailAuthError = ''" class="w-full px-8 py-4 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl shadow-lg hover:bg-primary-light dark:hover:bg-gray-700 flex items-center justify-center gap-4 font-bold text-gray-700 dark:text-gray-200 transition transform hover:scale-105">
                    <i class="fa-solid fa-envelope text-primary text-xl"></i>
                    <span>メールアドレスでログイン</span>
                </button>
                <button @click="startGuest" class="w-full px-8 py-4 bg-gray-800 dark:bg-gray-700 text-white rounded-xl shadow-lg hover:bg-gray-700 dark:hover:bg-gray-600 flex items-center justify-center gap-4 font-bold transition transform hover:scale-105">

                </button>
            </div>

            <div class="mt-6 flex gap-6 text-xs text-gray-400">

                <a href="https://nekomiyarion.github.io/studymate/privacy.html" target="_blank" class="hover:text-primary underline">プライバシーポリシー</a>
            </div>

                    </button>
                    <button @click="loadWeeklyReport(); currentTab = 'report'" class="nav-icon-btn w-full"
                        :class="currentTab === 'report' ? 'text-primary bg-primary-light dark:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i class="fa-solid fa-chart-simple"></i>
                    </button>
                    <button @click="currentTab = 'settings'" class="nav-icon-btn w-full"
                        :class="currentTab === 'settings' ? 'text-primary bg-primary-light dark:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>

                <!-- 通常モード（スマホ縦 or PC）ナビ -->

                    <button @click="currentTab = 'timer'" class="nav-btn p-2 rounded-xl flex flex-col md:flex-row items-center gap-1 md:gap-3 md:px-4 md:py-3 transition" 
                        :class="currentTab === 'timer' ? 'text-primary md:bg-primary-light dark:md:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i class="fa-solid fa-stopwatch text-xl md:text-lg"></i>
                        <span class="text-[10px] md:text-sm font-bold">記録</span>
                    </button>
                    <button @click="currentTab = 'tasks'" class="nav-btn p-2 rounded-xl flex flex-col md:flex-row items-center gap-1 md:gap-3 md:px-4 md:py-3 transition" 
                        :class="currentTab === 'tasks' ? 'text-primary md:bg-primary-light dark:md:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i class="fa-solid fa-list-check text-xl md:text-lg"></i>
                        <span class="text-[10px] md:text-sm font-bold">Todo</span>
                    </button>
                    <button @click="loadWeeklyReport(); currentTab = 'report'" class="nav-btn p-2 rounded-xl flex flex-col md:flex-row items-center gap-1 md:gap-3 md:px-4 md:py-3 transition"

                <div :key="currentTab" class="w-full">

                                <span class="font-bold tabular-nums flex-shrink-0">{{ currentTimeFormatted }}</span>
                                <span class="text-gray-300 dark:text-gray-600 flex-shrink-0">|</span>
                                <span class="flex-shrink-0">{{ new Date().toLocaleDateString('ja-JP', {month:'numeric', day:'numeric'}) }}</span>

                            <button v-if="isMobile && !isFullscreen && !isStandbyMode && !isLandscape"

                    <div class="flex-1 flex flex-col gap-6 md:gap-12 items-center justify-center"

                        <!-- Left: Display Area -->

                             :class="isStandbyMode ? 'w-full h-full' : 'w-full md:w-1/2 py-6 bg-white dark:bg-gray-800 md:bg-transparent md:dark:bg-transparent rounded-3xl md:rounded-none shadow-sm md:shadow-none border md:border-none border-gray-100 dark:border-gray-700'">
                            
                            <!-- Status Indicators -->

                                <i class="fa-solid fa-mug-hot mr-1"></i>休憩中
                            </div>
                            <div v-else-if="timerMode === 'countdown' && isTimerRunning" 
                                 class="font-bold px-3 py-1 rounded-full text-sm z-10"
                                 :class="isStandbyMode ? 'absolute top-6 right-6 bg-gray-800/50 text-primary-light' : 'absolute top-0 text-primary bg-primary-light dark:bg-gray-700'">
                                <i class="fa-solid fa-hourglass-half mr-1"></i>カウントダウン
                            </div>
                            <div v-else-if="isPaused" 
                                 class="font-bold px-3 py-1 rounded-full text-sm animate-blink z-10"
                                 :class="isStandbyMode ? 'absolute top-6 right-6 bg-yellow-900/50 text-yellow-500' : 'absolute top-0 text-yellow-500 bg-yellow-50 dark:bg-yellow-900/30'">
                                <i class="fa-solid fa-pause mr-1"></i>一時停止中
                            </div>

                            <!-- Subject Label -->
                            <p class="font-bold mb-2 transition-all z-10"
                               :class="isStandbyMode ? 'text-gray-500 text-xl absolute top-6 left-8' : 'text-sm text-gray-500 dark:text-gray-400'">

                            </div>

                                <p class="font-mono font-bold transition-colors" 
                                   :class="isStandbyMode ? 'text-gray-500 text-2xl' : 'text-gray-400 dark:text-gray-500 text-lg'">
                                    <span class="text-xs mr-2 opacity-70">TOTAL</span>{{ currentTotalTimeFormatted }}
                                </p>
                            </div>
                            
                            <!-- Controls (Standby時は下部に薄く表示) -->
                            <div v-if="isTimerRunning || isPaused" class="w-full max-w-sm flex flex-col gap-2 z-10"

                                <div class="flex gap-3">
                                    <button @click="stopTimer(false)" class="flex-1 py-5 text-white text-xl font-bold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2"

                                        <i class="fa-solid fa-stop"></i><span v-if="!isStandbyMode">STOP</span>
                                    </button>
                                    <button v-if="!isPaused" @click="pauseTimer" class="flex-1 py-5 bg-yellow-400 hover:bg-yellow-500 text-white text-xl font-bold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-pause"></i><span v-if="!isStandbyMode">PAUSE</span>
                                    </button>
                                    <button v-else @click="resumeTimer" class="flex-1 py-5 bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-play"></i><span v-if="!isStandbyMode">RESUME</span>
                                    </button>
                                </div>
                            </div>
                            
                            <p v-if="isTimerRunning && !isStandbyMode" class="text-center mt-3 text-gray-400 text-sm animate-pulse">{{ breakMode ? 'リラックス中...' : (timerMode === 'countdown' ? '集中...' : 'Focus...') }}</p>
                        </div>

                        <!-- Right: Buttons (スタンバイ時は非表示) -->
                        <div class="w-full md:w-1/2" v-if="!isStandbyMode && !isTimerRunning && !isPaused">
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4 mb-4">
                                <button v-for="sub in subjects" :key="sub" @click="handleSubjectClick(sub)"
                                    class="h-16 md:h-24 bg-white dark:bg-gray-800 border-2 border-primary-light dark:border-gray-600 hover:border-primary dark:hover:border-primary rounded-2xl font-bold text-gray-700 dark:text-gray-200 shadow-sm transition active:scale-95 flex flex-col items-center justify-center">
                                    <span class="text-lg">{{ sub }}</span>
                                    <span class="text-[10px] text-gray-400 font-normal md:mt-1">{{ timerMode === 'countdown' ? 'SET' : 'START' }}</span>
                                </button>
                            </div>

                            <button @click="openCountdownModal('休憩')" class="w-full mb-8 py-3 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 hover:bg-green-100 dark:hover:bg-green-900/40 text-green-600 dark:text-green-400 font-bold rounded-xl flex items-center justify-center gap-2 transition">
                                <i class="fa-solid fa-mug-hot"></i> 休憩タイマーをセット
                            </button>

                            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                                <div class="bg-gray-50 dark:bg-gray-700/50 px-5 py-3 border-b border-gray-100 dark:border-gray-700 text-xs font-bold text-gray-400 uppercase">
                                    <span>本日の内訳</span>
                                </div>
                                <div class="p-2 max-h-60 overflow-y-auto">
                                    <div v-if="Object.keys(todayLog.subjects).length === 0" class="text-center py-6 text-gray-400 text-sm">記録なし</div>
                                    <div v-for="(time, sub) in todayLog.subjects" :key="sub">
                                        <div v-if="time > 0" class="flex justify-between items-center text-sm border-b border-gray-100 dark:border-gray-700 last:border-0 p-3 hover:bg-gray-50 dark:hover:bg-gray-700/50">

                                            <span class="font-mono font-bold px-2 py-0.5 rounded text-gray-800 dark:text-gray-100" 
                                                  :class="sub==='休憩'?'bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-400':'bg-primary-light dark:bg-primary/20 text-primary dark:text-primary'">
                                                {{ formatSeconds(time) }}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>


                </div>

                <!-- 2. TODO TAB -->
                <div v-if="currentTab === 'tasks'" class="max-w-2xl mx-auto min-h-full pb-8">
                    <header class="mb-6 flex flex-wrap gap-4 justify-between items-end">
                        <h2 class="text-2xl font-bold">Todoリスト</h2>
                        <div class="flex gap-2 items-center">
                            <div v-if="tokenExpired && !isGuestMode" class="flex items-center gap-1.5 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 px-2.5 py-1.5 rounded-lg">
                                <i class="fa-solid fa-circle-exclamation text-red-600 dark:text-red-400 text-xs"></i>
                                <span class="text-[10px] font-bold text-red-700 dark:text-red-300">セッション切れ</span>
                            </div>
                            <button v-if="!isGuestMode" @click="refreshToken" class="text-xs bg-white dark:bg-gray-800 border border-primary-light dark:border-gray-600 text-primary px-3 py-1.5 rounded-lg hover:bg-gray-50 transition">
                                <i class="fa-solid fa-rotate mr-1"></i>再接続
                            </button>
                            <label class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400 cursor-pointer bg-white dark:bg-gray-800 px-3 py-1.5 rounded border dark:border-gray-700">
                                <input type="checkbox" v-model="showCompletedTasks" class="rounded text-primary">
                                完了済み
                            </label>
                        </div>
                    </header>

                    <!-- Guest Mode Info Banner -->
                    <div v-if="isGuestMode" class="bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-800 rounded-xl p-4 mb-6 flex items-start gap-3">
                        <i class="fa-solid fa-info-circle text-yellow-600 dark:text-yellow-400 mt-0.5"></i>
                        <div class="flex-1">
                            <p class="text-sm font-bold text-yellow-800 dark:text-yellow-300 mb-1">ゲストモードで利用中</p>
                            <p class="text-xs text-yellow-700 dark:text-yellow-400 mb-2">タスクはこのデバイスに保存されます。ログインすると、Googleアカウントに同期できます。</p>
                            <button @click="login" class="text-xs bg-yellow-600 dark:bg-yellow-700 text-white px-3 py-1.5 rounded-lg hover:bg-yellow-700 dark:hover:bg-yellow-600 font-bold">
                                ログインして同期
                            </button>
                        </div>
                    </div>

                    <div class="flex gap-2 mb-6">
                        <div class="relative flex-1">
                            <span class="absolute left-4 top-3.5 text-gray-400"><i class="fa-solid fa-plus"></i></span>
                            <input type="text" v-model="newTaskTitle" placeholder="タスクを入力..." 
                                   class="w-full border-none rounded-xl px-10 py-3.5 shadow-sm outline-none ring-1 ring-gray-200 dark:ring-gray-700 focus:ring-2 focus:ring-primary bg-white dark:bg-gray-800 dark:text-white transition"
                                   @keydown.enter="createTask">
                        </div>
                        <button @click="createTask({isComposing:false})" class="bg-primary text-white px-4 rounded-xl shadow hover:bg-primary-hover font-bold">追加</button>
                    </div>
                    <div class="space-y-3">
                        <div v-if="filteredTasks.length === 0" class="text-center py-12 text-gray-400 bg-white dark:bg-gray-800 rounded-xl border border-dashed border-gray-300 dark:border-gray-700">
                            タスクはありません
                        </div>
                        <div v-for="task in filteredTasks" :key="task.id" 
                             class="group bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-start gap-3 transition hover:shadow-md">
                            <input type="checkbox" :checked="task.status === 'completed'" @change="toggleTaskStatus(task)" class="mt-1.5 w-5 h-5 cursor-pointer accent-primary">
                            <input v-model="task.title" @blur="updateTaskTitle(task)" @keydown.enter="$event.target.blur()" class="flex-1 bg-transparent border-none outline-none text-sm p-0 focus:ring-0 text-gray-800 dark:text-gray-100" :class="{ 'completed-task': task.status === 'completed' }">
                            <button @click="deleteTask(task.id)" class="text-gray-300 hover:text-red-400 px-2 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                </div>

                <!-- 3. REPORT TAB -->
                <div v-if="currentTab === 'report'" class="max-w-full mx-auto flex flex-col" :style="{ height: (isMobile && !isLandscape) ? 'calc(100dvh - 5rem - 2rem)' : 'calc(100vh - 4rem)', minHeight: 0 }">
                    <!-- ヘッダー：全要素を1行に収める -->
                    <div class="flex-shrink-0 mb-2 flex items-center gap-1.5 min-w-0 overflow-hidden">
                        <!-- タイトル（スマホで省略） -->
                        <h2 class="font-bold whitespace-nowrap flex-shrink-0 hidden xs:block" style="font-size: clamp(14px, 2vw, 22px);">週間レポート</h2>
                        <!-- 月ピッカー -->
                        <input type="month" :value="reportMonthValue" @change="jumpToMonth($event.target.value)"
                               :max="todayMonthValue"
                               class="flex-shrink-0 border dark:border-gray-600 rounded-lg px-1.5 py-1 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 outline-none focus:ring-2 focus:ring-primary cursor-pointer"
                               style="font-size: clamp(10px, 1.2vw, 13px); max-width: clamp(100px, 18vw, 140px);">

                        <div class="flex items-center bg-white dark:bg-gray-800 rounded-lg shadow-sm border dark:border-gray-700 p-0.5 flex-shrink-0">
                            <button @click="shiftWeek(-7)" class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-gray-500"><i class="fa-solid fa-chevron-left" style="font-size:10px;"></i></button>
                            <span class="px-1 font-bold whitespace-nowrap" style="font-size: clamp(9px, 1.1vw, 12px);">{{ weekRangeLabel }}</span>
                            <button @click="shiftWeek(7)" :disabled="isCurrentWeek" class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition"
                                :class="isCurrentWeek ? 'text-gray-200 dark:text-gray-700 cursor-not-allowed' : 'text-gray-500'">
                                <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
                            </button>
                        </div>
                        <!-- 操作モードボタン -->
                        <div class="flex items-center bg-white dark:bg-gray-800 rounded-lg shadow-sm border dark:border-gray-700 p-0.5 gap-0.5 flex-shrink-0">
                            <button @click="reportMode = reportMode === 'edit' ? 'view' : 'edit'"
                                class="px-2 py-1 rounded font-bold transition flex items-center gap-0.5"
                                style="font-size: clamp(10px, 1.2vw, 12px);"
                                :class="reportMode==='edit' ? 'bg-yellow-400 text-white' : 'text-gray-400 hover:text-yellow-500 hover:bg-yellow-50 dark:hover:bg-gray-700'">
                                <i class="fa-solid fa-pen" style="font-size:9px;"></i> 変更
                            </button>
                            <button @click="reportMode = reportMode === 'delete' ? 'view' : 'delete'"
                                class="px-2 py-1 rounded font-bold transition flex items-center gap-0.5"
                                style="font-size: clamp(10px, 1.2vw, 12px);"
                                :class="reportMode==='delete' ? 'bg-red-400 text-white' : 'text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-gray-700'">
                                <i class="fa-solid fa-trash" style="font-size:9px;"></i> 削除
                            </button>
                        </div>
                    </div>

                    <!-- モード案内バナー -->
                    <div v-if="reportMode !== 'view'" class="flex-shrink-0 mb-2 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2"
                         :class="reportMode==='edit' ? 'bg-yellow-50 dark:bg-yellow-900/20 text-yellow-700 dark:text-yellow-300 border border-yellow-200 dark:border-yellow-800' : 'bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-300 border border-red-200 dark:border-red-800'">
                        <i :class="reportMode==='edit' ? 'fa-solid fa-pen' : 'fa-solid fa-trash'"></i>
                        {{ reportMode==='edit' ? '変更モード：タイムラインのセッションをタップして時間を変更' : '削除モード：タイムラインのセッションをタップして削除' }}
                        <button @click="reportMode='view'" class="ml-auto underline opacity-70 hover:opacity-100 font-normal">キャンセル</button>
                    </div>

                    <!-- サマリー（コンパクト） -->

                            <span class="text-primary font-bold" style="font-size: clamp(10px, 1.1vw, 14px);">週合計</span>
                            <span class="font-bold text-gray-800 dark:text-white" style="font-size: clamp(16px, 2vw, 26px);">{{ formatHours(weeklyTotal) }}<span class="text-gray-400 ml-1" style="font-size: clamp(11px, 1.2vw, 15px);">h</span></span>
                        </div>
                        <div class="bg-white dark:bg-gray-800 px-3 py-2 rounded-xl shadow-sm border border-green-100 dark:border-gray-700 flex items-center justify-between">
                            <span class="text-green-500 font-bold" style="font-size: clamp(10px, 1.1vw, 14px);">日平均</span>
                            <span class="font-bold text-gray-800 dark:text-white" style="font-size: clamp(16px, 2vw, 26px);">{{ formatHours(weeklyTotal / 7) }}<span class="text-gray-400 ml-1" style="font-size: clamp(11px, 1.2vw, 15px);">h</span></span>
                        </div>
                    </div>

                    <!-- 凡例 + 日別詳細パネル（横並び） -->
                    <div class="flex-shrink-0 flex gap-2 mb-2 min-h-0" style="max-height: clamp(80px, 12vw, 140px);">
                        <!-- 左：教科凡例 -->
                        <div class="flex flex-col gap-1 overflow-y-auto flex-shrink-0 pr-2 border-r border-gray-100 dark:border-gray-700" style="min-width: clamp(70px, 10vw, 140px); max-width: clamp(100px, 14vw, 180px);">
                            <div v-for="sub in allWeekSubjects" :key="sub"
                                 class="flex items-center gap-1 font-bold whitespace-nowrap"
                                 style="font-size: clamp(10px, 1.1vw, 14px);"
                                 :style="{ color: subjectColor(sub) }">
                                <span class="rounded-full flex-shrink-0" style="width: clamp(8px, 1vw, 12px); height: clamp(8px, 1vw, 12px);" :style="{ backgroundColor: subjectColor(sub) }"></span>
                                <span class="truncate">{{ sub }}</span>
                            </div>
                            <div v-if="allWeekSubjects.length === 0" class="text-gray-300" style="font-size: clamp(10px, 1.1vw, 14px);">記録なし</div>

                            <div v-if="!selectedDayDetail"></div>

                                <div class="flex items-center gap-1.5 mb-1.5">
                                    <span class="font-bold text-gray-600 dark:text-gray-300" style="font-size: clamp(11px, 1.2vw, 15px);">{{ selectedDayDetail.dateStr }}</span>
                                    <span class="font-mono font-bold px-1.5 py-0.5 rounded-full bg-primary-light dark:bg-primary/20 text-primary" style="font-size: clamp(10px, 1.1vw, 14px);">

                                    <button @click="selectedDayDetail = null" class="ml-auto text-gray-300 hover:text-gray-500" style="font-size: clamp(10px, 1.1vw, 14px);"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                                <div v-if="Object.keys(selectedDayDetail.subjects).length === 0" class="text-gray-300" style="font-size: clamp(10px, 1.1vw, 14px);">記録なし</div>
                                <div v-else class="flex flex-wrap gap-1">
                                    <div v-for="(sec, sub) in selectedDayDetail.subjects" :key="sub"
                                         class="flex items-center gap-1 px-1.5 py-0.5 rounded font-bold"
                                         style="font-size: clamp(10px, 1.1vw, 14px);"
                                         :style="{ backgroundColor: subjectColor(sub)+'22', color: subjectColor(sub) }">
                                        <span class="rounded-full flex-shrink-0" style="width: clamp(6px, 0.7vw, 10px); height: clamp(6px, 0.7vw, 10px);" :style="{ backgroundColor: subjectColor(sub) }"></span>
                                        {{ sub }}&nbsp;<span class="font-mono font-normal opacity-80">{{ formatSeconds(sec) }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ═══ タイムライングリッド（時間幅が長い場合はy方向スクロール） ═══ -->
                    <div class="flex-1 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden flex flex-col min-h-0">
                        <div class="flex-1 overflow-x-auto min-h-0" :class="reportVisibleHours > 10 ? 'overflow-y-auto' : 'overflow-y-hidden'">
                            <div class="flex" :style="{ minWidth: '480px', height: reportVisibleHours > 10 ? (reportVisibleHours * 52) + 'px' : '100%', minHeight: '100%' }">

                                <!-- 時刻ラベル列：幅・文字サイズをレスポンシブ対応 -->
                                <div class="flex-shrink-0 relative border-r border-gray-100 dark:border-gray-700"
                                     style="width: clamp(28px, 4vw, 52px); padding-top: clamp(44px, 7vw, 64px);">

                                        <div v-for="h in visibleHourTicks" :key="'lbl-'+h"
                                             class="absolute w-full text-right font-mono font-bold text-gray-500 dark:text-gray-400 leading-none"
                                             style="font-size: clamp(9px, 1.1vw, 13px); padding-right: clamp(3px, 0.4vw, 6px);"
                                             :style="{ top: ((h - reportStartHour) / reportVisibleHours * 100) + '%' }">
                                            {{ String(h).padStart(2,'0') }}
                                        </div>
                                    </div>
                                </div>

                                <!-- 7日分の列 -->
                                <div v-for="(dateStr, idx) in weeklyDates" :key="dateStr"
                                     class="flex-1 border-r border-gray-100 dark:border-gray-700 last:border-r-0 flex flex-col min-w-0"
                                     style="min-width: clamp(52px, 10vw, 120px);">

                                    <!-- 日付ヘッダー：高さ・文字もclampでスケール -->
                                    <div class="flex-shrink-0 text-center border-b border-gray-100 dark:border-gray-700 cursor-pointer select-none transition hover:brightness-95 active:brightness-90 flex flex-col items-center justify-center"
                                         style="height: clamp(44px, 7vw, 64px); padding: clamp(2px, 0.5vw, 6px) 0;"
                                         :class="dateStr === getTodayStr() ? 'bg-primary-light dark:bg-primary/20' : 'bg-white dark:bg-gray-800'"
                                         @click="selectedDayDetail = { dateStr, subjects: weeklyData[idx]?.subjects || {} }">
                                        <!-- 曜日 -->
                                        <div class="font-bold leading-tight"
                                             style="font-size: clamp(11px, 1.4vw, 16px);"
                                             :class="dateStr === getTodayStr() ? 'text-primary' :
                                                     new Date(dateStr+'T12:00:00').getDay()===0 ? 'text-red-400' :
                                                     new Date(dateStr+'T12:00:00').getDay()===6 ? 'text-blue-400' : 'text-gray-600 dark:text-gray-300'">
                                            {{ ['日','月','火','水','木','金','土'][new Date(dateStr+'T12:00:00').getDay()] }}
                                        </div>
                                        <!-- 日付 -->
                                        <div class="text-gray-400 leading-tight" style="font-size: clamp(9px, 1.1vw, 13px);">
                                            {{ dateStr.slice(5).replace('-','/') }}
                                        </div>
                                        <!-- 勉強時間 -->
                                        <div class="font-mono font-bold leading-tight" style="font-size: clamp(9px, 1.1vw, 13px);"
                                             :class="calculateDailyStudyTotal(weeklyData[idx]?.subjects || {}) > 0 ? 'text-primary' : 'text-gray-300 dark:text-gray-600'">
                                            {{ calculateDailyStudyTotal(weeklyData[idx]?.subjects || {}) > 0 ? formatHours(calculateDailyStudyTotal(weeklyData[idx]?.subjects || {}))+'h' : '—' }}
                                        </div>
                                    </div>

                                    <!-- タイムライン本体 -->
                                    <div class="flex-1 relative min-h-0">
                                        <!-- 時間グリッド線 -->
                                        <div v-for="h in visibleHourTicks" :key="'grid-'+dateStr+h"
                                             class="absolute w-full pointer-events-none"
                                             :class="h % 3 === 0 ? 'border-t border-gray-300 dark:border-gray-500' : 'border-t border-gray-200 dark:border-gray-600/70'"
                                             :style="{ top: ((h - reportStartHour) / reportVisibleHours * 100) + '%' }">
                                        </div>

                                        <!-- セッションブロック -->
                                        <template v-if="weeklyData[idx]?.sessions?.length > 0">
                                            <div v-for="(session, si) in weeklyData[idx].sessions" :key="si"
                                                 class="absolute rounded overflow-hidden transition-all"
                                                 style="left: clamp(1px, 0.3vw, 3px); right: clamp(1px, 0.3vw, 3px);"
                                                 :class="[
                                                    reportMode !== 'view' ? 'cursor-pointer hover:brightness-75 hover:ring-2 hover:ring-white' : 'cursor-pointer hover:brightness-90',
                                                    reportMode === 'delete' ? 'ring-1 ring-red-300' : ''
                                                 ]"
                                                 :style="sessionBlockStylePct(session)"
                                                 @click="onSessionClick(dateStr, idx, si, session)">
                                                <div class="px-0.5 py-0.5 h-full flex flex-col justify-start overflow-hidden"
                                                     :style="{ backgroundColor: subjectColor(session.subject), opacity: 0.92 }">
                                                    <div class="text-white font-bold truncate leading-tight drop-shadow-sm"
                                                         style="font-size: clamp(8px, 1vw, 12px);">{{ session.subject }}</div>
                                                    <div v-if="session.duration >= 1200"
                                                         class="text-white/80 font-mono truncate leading-tight"
                                                         style="font-size: clamp(7px, 0.85vw, 11px);">{{ fmtTime(session.start) }}-{{ fmtTime(session.end) }}</div>
                                                </div>
                                                <!-- 削除モード時のオーバーレイ -->
                                                <div v-if="reportMode==='delete'" class="absolute inset-0 bg-red-500/20 flex items-center justify-center">
                                                    <i class="fa-solid fa-xmark text-white drop-shadow" style="font-size: clamp(9px, 1vw, 13px);"></i>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- セッション詳細ポップアップ（viewモード時） -->
                <transition name="modal">
                <div v-if="sessionDetailPopup" class="fixed inset-0 z-50 bg-black/50 flex items-end md:items-center justify-center p-4"
                     @click.self="sessionDetailPopup = null">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 w-full max-w-sm shadow-2xl">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-4 h-4 rounded-full flex-shrink-0" :style="{ backgroundColor: subjectColor(sessionDetailPopup.subject) }"></div>
                            <h3 class="text-lg font-bold dark:text-white">{{ sessionDetailPopup.subject }}</h3>
                        </div>
                        <div class="bg-gray-50 dark:bg-gray-700 rounded-xl p-4 space-y-2 text-sm mb-4">
                            <div class="flex justify-between">
                                <span class="text-gray-500">開始</span>
                                <span class="font-mono font-bold">{{ fmtTimeFull(sessionDetailPopup.start) }}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-500">終了</span>
                                <span class="font-mono font-bold">{{ fmtTimeFull(sessionDetailPopup.end) }}</span>
                            </div>
                            <div class="flex justify-between border-t border-gray-200 dark:border-gray-600 pt-2">
                                <span class="text-gray-500">時間</span>
                                <span class="font-mono font-bold text-base" :style="{ color: subjectColor(sessionDetailPopup.subject) }">{{ formatSeconds(sessionDetailPopup.duration) }}</span>
                            </div>
                        </div>
                        <button @click="sessionDetailPopup = null" class="w-full py-2 text-gray-400 text-sm rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition">閉じる</button>
                    </div>
                </div>
                </transition>

                <!-- セッション編集モーダル -->
                <transition name="modal">
                <div v-if="editingSession" class="fixed inset-0 z-50 bg-black/60 flex items-end md:items-center justify-center p-4">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                        <h3 class="text-lg font-bold mb-4 dark:text-white flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full" :style="{ backgroundColor: subjectColor(editingSession.subject) }"></div>
                            {{ editingSession.subject }} を編集
                        </h3>
                        <div class="mb-4 p-3 bg-gray-50 dark:bg-gray-700 rounded-xl text-sm text-gray-500 dark:text-gray-400 font-mono">
                            {{ fmtTime(editingSession.start) }} 〜 {{ fmtTime(editingSession.end) }}
                        </div>
                        <label class="block text-xs font-bold text-gray-500 mb-2">時間（分）</label>
                        <div class="flex items-center gap-2 mb-6">
                            <button @click="editingDurationMin = Math.max(1, editingDurationMin - 5)" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold text-sm text-gray-700 dark:text-white">-5</button>
                            <button @click="editingDurationMin = Math.max(1, editingDurationMin - 1)" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold text-sm text-gray-700 dark:text-white">-1</button>
                            <input type="number" v-model.number="editingDurationMin" min="1"
                                class="flex-1 text-center border-b-2 border-primary text-xl font-bold outline-none bg-transparent dark:text-white py-1">
                            <span class="text-xs text-gray-400">分</span>
                            <button @click="editingDurationMin = editingDurationMin + 1" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold text-sm text-gray-700 dark:text-white">+1</button>
                            <button @click="editingDurationMin = editingDurationMin + 5" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold text-sm text-gray-700 dark:text-white">+5</button>
                        </div>
                        <div class="flex gap-2">
                            <button @click="editingSession = null; reportMode = 'edit'" class="flex-1 py-2 text-gray-500 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-sm">戻る</button>
                            <button @click="confirmEditSession" class="flex-1 py-2 bg-primary text-white rounded-lg font-bold shadow hover:bg-primary-hover text-sm">保存</button>
                        </div>
                    </div>
                </div>
                </transition>

                <!-- 4. SETTINGS TAB -->
                <div v-if="currentTab === 'settings'" class="max-w-xl mx-auto pb-8 w-full">
                    <header class="mb-6"><h2 class="text-2xl font-bold">設定</h2></header>

                    <!-- 1. 外観設定 -->
                    <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mb-4">
                        <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-700 font-bold text-sm bg-gray-50 dark:bg-gray-700/50">
                            <i class="fa-solid fa-palette mr-1.5 text-primary"></i>外観設定
                        </div>
                        <div class="px-4 py-3 space-y-3">
                            <!-- テーマモード：横1行セグメント -->
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-xs font-bold text-gray-600 dark:text-gray-300 flex-shrink-0">テーマ</span>
                                <div class="flex bg-gray-100 dark:bg-gray-700 p-0.5 rounded-lg gap-0.5 flex-shrink-0">
                                    <button @click="setThemeMode('light')"
                                        class="flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold transition"
                                        :class="themeMode==='light' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">
                                        <i class="fa-solid fa-sun text-yellow-400"></i>ライト
                                    </button>
                                    <button @click="setThemeMode('dark')"
                                        class="flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold transition"
                                        :class="themeMode==='dark' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">
                                        <i class="fa-solid fa-moon text-indigo-400"></i>ダーク
                                    </button>
                                    <button @click="setThemeMode('system')"
                                        class="flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold transition"
                                        :class="themeMode==='system' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">
                                        <i class="fa-solid fa-display text-gray-400"></i>自動
                                    </button>
                                </div>
                            </div>
                            <!-- テーマカラー：コンパクト1行 -->
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-gray-600 dark:text-gray-300 flex-shrink-0">カラー</span>
                                <input type="color" v-model="tempThemeColor" @change="changeThemeColor" class="w-8 h-8 rounded cursor-pointer border border-gray-200 dark:border-gray-600 flex-shrink-0">
                                <span class="text-xs text-gray-400 font-mono flex-shrink-0">{{ themeColor }}</span>
                                <button @click="resetTheme" class="ml-auto text-xs text-gray-400 hover:text-primary border border-gray-200 dark:border-gray-600 px-2.5 py-1 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 flex-shrink-0">リセット</button>
                            </div>
                        </div>
                    </section>

                    <!-- 2. 教科の編集・カラー設定（折り畳み） -->
                    <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mb-4">
                        <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-700 font-bold text-sm bg-gray-50 dark:bg-gray-700/50 flex items-center justify-between cursor-pointer"
                             @click="showSubjectEditor = !showSubjectEditor">
                            <span><i class="fa-solid fa-pen-to-square mr-1.5 text-primary"></i>教科の編集・カラー設定</span>
                            <i class="fa-solid text-gray-400 transition-transform duration-200 text-xs"
                               :class="showSubjectEditor ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                        </div>
                        <div v-if="showSubjectEditor" class="p-4">
                            <p class="text-xs text-gray-400 mb-3">ドラッグで並び替え・色変更・名前変更ができます。</p>
                            <ul class="space-y-2 mb-3" ref="subjectList">
                                <li v-for="(sub, index) in subjects" :key="sub"
                                    class="flex items-center gap-2 bg-gray-50 dark:bg-gray-700/50 rounded-lg px-2 py-1.5 cursor-grab active:cursor-grabbing"
                                    :data-index="index"
                                    draggable="true"
                                    @dragstart="subjectDragStart($event, index)"
                                    @dragover.prevent="subjectDragOver($event, index)"
                                    @drop="subjectDrop($event, index)"
                                    @dragend="subjectDragEnd">
                                    <!-- ドラッグハンドル -->
                                    <i class="fa-solid fa-grip-vertical text-gray-300 text-xs flex-shrink-0 cursor-grab"></i>
                                    <!-- 色 -->
                                    <div class="relative flex-shrink-0">
                                        <div class="w-7 h-7 rounded-full border-2 border-white shadow cursor-pointer hover:scale-110 transition"
                                             :style="{ backgroundColor: subjectColor(sub) }"
                                             @click.stop="$refs['colorPicker_'+index][0].click()"></div>
                                        <input type="color" :ref="'colorPicker_'+index"
                                               :value="subjectColor(sub)"
                                               @change="setSubjectColor(sub, $event.target.value)"
                                               class="absolute inset-0 opacity-0 w-0 h-0 pointer-events-none">
                                    </div>
                                    <!-- 名前 -->
                                    <input type="text" v-model="subjects[index]" @change="saveSettings"
                                           class="flex-1 border dark:border-gray-600 rounded-lg px-2 py-1 text-sm focus:border-primary outline-none bg-white dark:bg-gray-700 focus:bg-white dark:focus:bg-gray-600 transition min-w-0"
                                           @click.stop>
                                    <!-- リセット -->
                                    <button @click.stop="resetSubjectColor(sub)" class="text-gray-300 hover:text-gray-500 p-1 transition flex-shrink-0" title="色リセット">
                                        <i class="fa-solid fa-rotate-left text-xs"></i>
                                    </button>
                                    <!-- 削除 -->
                                    <button @click.stop="removeSubject(index)" class="text-gray-300 hover:text-red-500 p-1 transition flex-shrink-0">
                                        <i class="fa-solid fa-circle-minus"></i>
                                    </button>
                                </li>
                                <!-- 休憩（削除・移動不可） -->
                                <li class="flex items-center gap-2 pt-2 border-t border-gray-100 dark:border-gray-700">
                                    <i class="fa-solid fa-lock text-gray-200 text-xs flex-shrink-0"></i>
                                    <div class="relative flex-shrink-0">
                                        <div class="w-7 h-7 rounded-full border-2 border-white shadow cursor-pointer hover:scale-110 transition"
                                             :style="{ backgroundColor: subjectColor('休憩') }"
                                             @click="$refs.breakColorPicker.click()"></div>
                                        <input type="color" ref="breakColorPicker"
                                               :value="subjectColor('休憩')"
                                               @change="setSubjectColor('休憩', $event.target.value)"
                                               class="absolute inset-0 opacity-0 w-0 h-0 pointer-events-none">
                                    </div>
                                    <span class="flex-1 text-xs font-medium text-gray-400 dark:text-gray-500 px-1">休憩（固定）</span>
                                    <button @click="resetSubjectColor('休憩')" class="text-gray-300 hover:text-gray-500 p-1 transition">
                                        <i class="fa-solid fa-rotate-left text-xs"></i>
                                    </button>
                                    <div class="w-6"></div>
                                </li>
                            </ul>
                            <div class="flex gap-2">
                                <input type="text" v-model="newSubjectName" placeholder="新しい教科名を追加" class="flex-1 border dark:border-gray-600 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-white dark:bg-gray-800">
                                <button @click="addSubject" class="bg-primary text-white px-4 rounded-lg text-sm font-bold shadow hover:bg-primary-hover">追加</button>
                            </div>
                        </div>
                    </section>

                    <!-- 3. 通知設定（スイッチ方式 + 通知音統合） -->
                    <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mb-4">
                        <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-700 font-bold text-sm bg-gray-50 dark:bg-gray-700/50">
                            <i class="fa-solid fa-bell mr-1.5 text-primary"></i>通知設定
                        </div>
                        <div class="px-4 py-3 space-y-0 divide-y divide-gray-100 dark:divide-gray-700">
                            <!-- 音 -->
                            <div class="flex items-center justify-between py-2.5">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-volume-high w-4 text-center text-gray-500"></i>
                                    <span class="text-sm font-medium">通知音</span>
                                </div>
                                <button @click="notifSound = !notifSound; saveSettings()"
                                    class="w-11 h-6 rounded-full p-0.5 transition-colors duration-200"
                                    :class="notifSound ? 'bg-primary' : 'bg-gray-300 dark:bg-gray-600'">
                                    <div class="w-5 h-5 bg-white rounded-full shadow-sm transform transition-transform duration-200"
                                         :class="notifSound ? 'translate-x-5' : 'translate-x-0'"></div>
                                </button>
                            </div>
                            <!-- 振動 -->
                            <div class="flex items-center justify-between py-2.5">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-mobile-screen-button w-4 text-center text-gray-500"></i>
                                    <span class="text-sm font-medium">振動</span>
                                </div>
                                <button @click="notifVibrate = !notifVibrate; saveSettings()"
                                    class="w-11 h-6 rounded-full p-0.5 transition-colors duration-200"
                                    :class="notifVibrate ? 'bg-primary' : 'bg-gray-300 dark:bg-gray-600'">
                                    <div class="w-5 h-5 bg-white rounded-full shadow-sm transform transition-transform duration-200"
                                         :class="notifVibrate ? 'translate-x-5' : 'translate-x-0'"></div>
                                </button>
                            </div>
                            <!-- フラッシュ -->
                            <div class="flex items-center justify-between py-2.5">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-bolt w-4 text-center text-gray-500"></i>
                                    <span class="text-sm font-medium">フラッシュ</span>
                                </div>
                                <button @click="notifFlash = !notifFlash; saveSettings()"
                                    class="w-11 h-6 rounded-full p-0.5 transition-colors duration-200"
                                    :class="notifFlash ? 'bg-primary' : 'bg-gray-300 dark:bg-gray-600'">
                                    <div class="w-5 h-5 bg-white rounded-full shadow-sm transform transition-transform duration-200"
                                         :class="notifFlash ? 'translate-x-5' : 'translate-x-0'"></div>
                                </button>
                            </div>
                            <!-- 通知音ファイル（音がONの時のみ表示） -->
                            <div v-if="notifSound" class="py-2.5">
                                <p class="text-xs text-gray-400 mb-1.5">通知音ファイル（mp3推奨）</p>
                                <div class="flex items-center gap-2">
                                    <input type="file" accept="audio/*" @change="handleAudioUpload" class="flex-1 text-xs text-gray-500 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-primary-light file:text-primary hover:file:bg-blue-100 dark:file:bg-gray-700 dark:file:text-gray-200">
                                    <button @click="testAudio" class="text-xs text-primary hover:underline flex-shrink-0"><i class="fa-solid fa-play mr-1"></i>テスト</button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- 4. アニメーション設定 -->
                    <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mb-4">
                        <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-700 font-bold text-sm bg-gray-50 dark:bg-gray-700/50">
                            <i class="fa-solid fa-wand-magic-sparkles mr-1.5 text-primary"></i>アニメーション設定
                        </div>
                        <div class="px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
                            <div class="flex-shrink-0">
                                <h4 class="font-bold text-sm">タブ切り替え</h4>
                                <p class="text-xs text-gray-400">画面切り替え時のエフェクト</p>
                            </div>
                            <div class="flex bg-gray-100 dark:bg-gray-700 p-0.5 rounded-lg gap-0.5 flex-shrink-0">
                                <button @click="setTabAnimation('fade')" class="px-2.5 py-1.5 rounded-md text-xs font-bold transition" :class="tabAnimation==='fade' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">フェード</button>
                                <button @click="setTabAnimation('slide')" class="px-2.5 py-1.5 rounded-md text-xs font-bold transition" :class="tabAnimation==='slide' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">スライド</button>
                                <button @click="setTabAnimation('zoom')" class="px-2.5 py-1.5 rounded-md text-xs font-bold transition" :class="tabAnimation==='zoom' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">ズーム</button>
                                <button @click="setTabAnimation('none')" class="px-2.5 py-1.5 rounded-md text-xs font-bold transition" :class="tabAnimation==='none' ? 'bg-white dark:bg-gray-600 shadow text-primary' : 'text-gray-400'">なし</button>
                            </div>
                        </div>
                    </section>

                    <!-- 6. アカウント設定 -->
                    <section v-if="user && !isGuestMode" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mb-6">
                        <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 font-bold text-sm bg-gray-50 dark:bg-gray-700/50 flex items-center justify-between">
                            <span><i class="fa-solid fa-user-gear mr-2 text-primary"></i>アカウント設定</span>
                            <button @click="showAccountSettings = !showAccountSettings" class="text-xs text-primary hover:underline">
                                {{ showAccountSettings ? '閉じる' : '開く' }}
                            </button>
                        </div>
                        <div v-if="showAccountSettings" class="p-6 space-y-5">
                            <p class="text-xs text-gray-400">ログイン中: {{ user.email || user.displayName || user.uid.slice(0,8)+'...' }}</p>
                            <p class="text-xs text-gray-400">連携済み: 
                                <span v-for="p in linkedProviders" :key="p" class="inline-block bg-gray-100 dark:bg-gray-700 rounded px-1.5 py-0.5 text-[10px] font-mono mr-1">{{ p }}</span>
                            </p>

                            <!-- Google連携追加 -->
                            <div v-if="!linkedProviders.includes('google.com')" class="border border-gray-100 dark:border-gray-700 rounded-xl p-4">
                                <h5 class="font-bold text-sm mb-2"><i class="fa-brands fa-google mr-1.5 text-red-500"></i>Google連携を追加</h5>
                                <p class="text-xs text-gray-400 mb-3">Googleアカウントを連携すると、Googleタスクも使えるようになります</p>
                                <button @click="linkGoogle" class="w-full py-2 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg text-sm font-bold text-gray-700 dark:text-gray-200 flex items-center justify-center gap-2 hover:bg-gray-50 dark:hover:bg-gray-600 transition">
                                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4 h-4">Googleアカウントと連携
                                </button>
                            </div>
                            <div v-else class="flex items-center gap-2 text-xs text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/20 px-3 py-2 rounded-lg">
                                <i class="fa-solid fa-circle-check"></i> Google連携済み
                            </div>

                            <!-- メールアドレス追加 -->
                            <div v-if="!linkedProviders.includes('password')" class="border border-gray-100 dark:border-gray-700 rounded-xl p-4">
                                <h5 class="font-bold text-sm mb-3"><i class="fa-solid fa-envelope mr-1.5 text-primary"></i>メールアドレスを追加</h5>
                                <div class="space-y-2">
                                    <input type="email" v-model="linkEmailForm.email" placeholder="メールアドレス"
                                        class="w-full border dark:border-gray-600 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-700 dark:text-white">
                                    <input type="password" v-model="linkEmailForm.password" placeholder="パスワード（6文字以上）"

                const SYNC_QUEUE_KEY = 'studymate_sync_queue';

                const addToSyncQueue = (dateStr, data) => {
                    try {
                        const q = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
                        // 同じ日付のエントリは上書き
                        const idx = q.findIndex(e => e.dateStr === dateStr);
                        if (idx >= 0) q[idx] = { dateStr, data, ts: Date.now() };
                        else q.push({ dateStr, data, ts: Date.now() });
                        localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q));
                        console.log('[Offline] Queued:', dateStr);
                    } catch(e) {}
                };

                const flushSyncQueue = async () => {
                    if (!user.value || isGuestMode.value || !isOnline.value) return;
                    try {
                        const q = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
                        if (q.length === 0) return;
                        console.log('[Sync] Flushing', q.length, 'items...');
                        const done = [];
                        for (const entry of q) {
                            try {
                                await setDoc(doc(db, "users", user.value.uid, "logs", entry.dateStr), entry.data, {merge:true});
                                done.push(entry.dateStr);
                            } catch(e) {
                                console.warn('[Sync] Failed for', entry.dateStr, e);
                            }
                        }
                        // 成功分を削除
                        const remaining = q.filter(e => !done.includes(e.dateStr));
                        localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(remaining));
                        if (done.length > 0) {
                            console.log('[Sync] Synced:', done);
                            // 設定もFirebaseに同期
                            const settingsRaw = localStorage.getItem('studyMate_settings');
                            if (settingsRaw) {
                                await setDoc(doc(db, "users", user.value.uid, "settings", "config"), JSON.parse(settingsRaw), {merge:true}).catch(()=>{});
                            }
                            showSyncBanner(done.length);
                        }
                    } catch(e) {}
                };

                const showSyncBanner = (count) => {
                    // 同期完了バナー（2秒で自動消去）
                    const existing = document.getElementById('sync-banner');

                    el.textContent = '✓ オフラインデータを同期しました';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 3000);
                };
                const isAuthLoading = ref(true); 
                const accessToken = ref(null);
                const currentTab = ref('timer');
                
                // Mobile & Fullscreen & Standby Mode
                const isMobile = ref(false);
                const isFullscreen = ref(false);
                const isLandscape = ref(window.innerWidth > window.innerHeight);
                const wakeLock = ref(null); 
                const TIMER_STATE_KEY = 'studyMate_timer_state'; 

                // --- THEME & COLOR ---
                const themeMode = ref('system'); // 'light' | 'dark' | 'system'
                const themeColor = ref('#2563eb');
                const tempThemeColor = ref('#2563eb');

                const systemDarkMQ = window.matchMedia('(prefers-color-scheme: dark)');

                    if (themeMode.value === 'dark') return true;
                    if (themeMode.value === 'light') return false;
                    return systemDarkMQ.matches;

                    '社会': '#f59e0b', '英語': '#8b5cf6', 'その他': '#6b7280', '休憩': '#22c55e'
                };
                const PALETTE = ['#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#10b981','#06b6d4','#3b82f6','#6366f1','#8b5cf6','#ec4899'];
                let paletteIdx = 0;
                const subjectColors = ref({});

                const subjectColor = (sub) => {
                    if (subjectColors.value[sub]) return subjectColors.value[sub];
                    if (DEFAULT_SUBJECT_COLORS[sub]) return DEFAULT_SUBJECT_COLORS[sub];

                    const c = PALETTE[paletteIdx % PALETTE.length];
                    paletteIdx++;
                    subjectColors.value[sub] = c;
                    return c;

                    subjectColors.value[sub] = color;
                    subjectColors.value = { ...subjectColors.value };

                systemDarkMQ.addEventListener('change', () => { if (themeMode.value === 'system') applyTheme(); });

                // --- WAKE LOCK (スリープ防止) ---

                            wakeLock.value = await navigator.wakeLock.request('screen');
                        }
                    } catch (err) { console.log(err); }
                };
                const releaseWakeLock = async () => {
                    if (wakeLock.value) { await wakeLock.value.release(); wakeLock.value = null; }
                };
                const handleVisibilityChange = async () => {
                    if (wakeLock.value !== null && document.visibilityState === 'visible') await requestWakeLock();
                };

                // Fullscreen & Orientation functions
                const checkMobile = () => { isMobile.value = window.innerWidth < 768; };

                        document.documentElement.requestFullscreen().then(() => { isFullscreen.value = true; }).catch(e=>alert(e));
                    } else {
                        document.exitFullscreen().then(() => { isFullscreen.value = false; });
                    }
                };
                const handleFullscreenChange = () => { isFullscreen.value = !!document.fullscreenElement; };
                
                // Standby Mode Computed

                    return isMobile.value && isFullscreen.value && isLandscape.value && currentTab.value === 'timer';

                    checkMobile();
                    checkOrientation();
                    window.addEventListener('resize', checkOrientation); // リサイズで向き検知
                    document.addEventListener('fullscreenchange', handleFullscreenChange);

                    // ── オンライン/オフライン検知 ──
                    window.addEventListener('online', () => {
                        isOnline.value = true;
                        console.log('[Network] Back online → syncing...');
                        // Service Worker にバックグラウンド同期を登録
                        if ('serviceWorker' in navigator && 'SyncManager' in window) {
                            navigator.serviceWorker.ready.then(reg => {
                                reg.sync.register('studymate-sync').catch(()=>{});
                            });
                        }
                        // 同期キューをフラッシュ
                        setTimeout(() => flushSyncQueue(), 1000);
                    });
                    window.addEventListener('offline', () => {
                        isOnline.value = false;
                        console.log('[Network] Gone offline');
                    });

                    // Service Worker からの同期指示を受信
                    if ('serviceWorker' in navigator) {
                        navigator.serviceWorker.addEventListener('message', (event) => {
                            if (event.data && event.data.type === 'DO_SYNC') {

                    // ★タイマー状態の復元（リロード・再開対策）
                    restoreTimerState();

                    onAuthStateChanged(auth, async (currentUser) => {

                            if (accessToken.value) {

                const hardReset = () => {

                // ── メール認証 ──
                const emailLoginForm = ref({ email: '', password: '', confirm: '', mode: 'login' }); // mode: login | register

                const linkEmailForm = ref({ email: '', password: '', confirm: '' });

                const resetPassword = async () => {

                // アカウント設定：Google連携追加
                const linkGoogle = async () => {

                        const credential = GoogleAuthProvider.credentialFromResult(r);
                        if (credential?.accessToken) {

                            fetchTasks();

                        accountMessage.value = 'Googleアカウントを連携しました！';
                    } catch(e) {
                        if (e.code === 'auth/credential-already-in-use') accountMessage.value = 'このGoogleアカウントは既に別のアカウントに連携されています';
                        else if (e.code === 'auth/provider-already-linked') accountMessage.value = '既にGoogleアカウントが連携されています';
                        else accountMessage.value = e.message;
                    }
                };

                // アカウント設定：メールアドレス追加
                const linkEmail = async () => {
                    linkEmailError.value = '';
                    if (linkEmailForm.value.password !== linkEmailForm.value.confirm) {
                        linkEmailError.value = 'パスワードが一致しません'; return;
                    }
                    try {
                        const credential = EmailAuthProvider.credential(linkEmailForm.value.email, linkEmailForm.value.password);

                            'auth/email-already-in-use': 'このメールアドレスは既に使用されています',
