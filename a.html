<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study Mate</title>
    <link rel="icon" href="./studymate.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary-color)',
                        'primary-hover': 'var(--primary-hover)',
                        'primary-light': 'var(--primary-light)',
                    },
                    fontFamily: {
                        standby: ['"SF Pro Display"', '"Roboto"', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --primary-color: #2563eb; 
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
        }

        [v-cloak] { display: none; }
        .completed-task { text-decoration: line-through; color: #9ca3af; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* スタンバイモード関連のアニメーションと変形 */
        .standby-wrapper {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* 強制横画面（CSS Transformで回転） */
        .force-landscape {
            position: fixed;
            top: 0; left: 0;
            width: 100vh; height: 100vw;
            transform-origin: top left;
            transform: rotate(90deg) translateY(-100%);
            z-index: 9999;
            overflow: hidden;
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes ring {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        .animate-ring { animation: ring 0.3s infinite; }
        
        @keyframes blink { 50% { opacity: 0.5; } }
        .animate-blink { animation: blink 1.5s infinite; }

        @keyframes flash-screen {
            0%, 100% { background-color: rgba(0,0,0,0.9); }
            50% { background-color: rgba(70, 70, 70, 0.9); } 
        }
        .animate-flash-screen { animation: flash-screen 1.5s infinite ease-in-out; }

        .slide-up-enter-active, .slide-up-leave-active { transition: all 0.3s ease-out; }
        .slide-up-enter-from, .slide-up-leave-to { transform: translateY(20px); opacity: 0; }

        /* スタンドバイモードの特別フォント */
        .font-standby-clock {
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
            letter-spacing: -0.03em;
            text-shadow: 0 0 20px rgba(var(--primary-color), 0.3);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="app" v-cloak class="h-full flex flex-col md:flex-row relative">
        
        <!-- ================= LOADING SCREEN ================= -->
        <div v-if="isAuthLoading" class="fixed inset-0 z-[100] bg-gray-50 dark:bg-gray-900 flex items-center justify-center">
            <div class="flex flex-col items-center">
                <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-primary mb-4"></div>
                <p class="text-gray-500 font-bold animate-pulse">Study Mate Loading...</p>
            </div>
        </div>

        <!-- ================= Login / Guest Landing ================= -->
        <div v-else-if="!user && !isGuestMode" class="w-full h-full flex flex-col items-center justify-center bg-gray-50 dark:bg-gray-900 p-6 z-50 absolute inset-0 overflow-y-auto">
            <img src="./studymate.png" onerror="this.style.display='none'" alt="Logo" class="w-24 h-24 mb-4 rounded-2xl shadow-lg">
            <h1 class="text-5xl font-bold mb-2 text-primary tracking-tighter text-center transition-colors">Study Mate</h1>
            <p class="text-gray-500 dark:text-gray-400 mb-10 text-center">勉強も、休憩も、これひとつで。</p>
            
            <div class="space-y-4 w-full max-w-sm">
                <button @click="login" class="w-full px-8 py-4 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl shadow-lg hover:bg-primary-light dark:hover:bg-gray-700 flex items-center justify-center gap-4 font-bold text-gray-700 dark:text-gray-200 transition transform hover:scale-105">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6">
                    <span>Googleでログイン</span>
                </button>
                <button @click="startGuest" class="w-full px-8 py-4 bg-gray-800 dark:bg-gray-700 text-white rounded-xl shadow-lg hover:bg-gray-700 dark:hover:bg-gray-600 flex items-center justify-center gap-4 font-bold transition transform hover:scale-105">
                    <i class="fa-solid fa-user-secret"></i>
                    <span>ゲストとして利用する</span>
                </button>
            </div>
            <div class="absolute bottom-4 right-4">
                <button @click="hardReset" class="text-xs text-gray-300 underline hover:text-red-500">不具合時リセット</button>
            </div>
        </div>

        <!-- ================= Main App ================= -->
        <template v-else>
            
            <!-- Navigation (スタンバイモード時は非表示) -->
            <nav v-show="!isActiveStandby" class="md:w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col md:h-full flex-shrink-0 order-2 md:order-1 fixed md:relative bottom-0 w-full md:w-auto z-40 h-20 md:h-auto shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] md:shadow-none pb-safe">
                <div class="hidden md:flex items-center gap-3 p-6 border-b border-gray-100 dark:border-gray-700">
                    <img src="./studymate.png" onerror="this.style.display='none'" class="w-8 h-8 rounded-lg">
                    <span class="font-bold text-xl tracking-tight">Study Mate</span>
                </div>
                <div class="flex md:flex-col justify-around md:justify-start h-full md:p-4 md:gap-2 items-center md:items-stretch">
                    <button @click="currentTab = 'timer'" class="nav-btn p-2 rounded-xl flex flex-col md:flex-row items-center gap-1 md:gap-3 md:px-4 md:py-3 transition" :class="currentTab === 'timer' ? 'text-primary md:bg-primary-light dark:md:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i class="fa-solid fa-stopwatch text-xl md:text-lg"></i><span class="text-[10px] md:text-sm font-bold">記録</span>
                    </button>
                    <button @click="currentTab = 'tasks'" class="nav-btn p-2 rounded-xl flex flex-col md:flex-row items-center gap-1 md:gap-3 md:px-4 md:py-3 transition" :class="currentTab === 'tasks' ? 'text-primary md:bg-primary-light dark:md:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i class="fa-solid fa-list-check text-xl md:text-lg"></i><span class="text-[10px] md:text-sm font-bold">Todo</span>
                    </button>
                    <button @click="loadWeeklyReport(); currentTab = 'report'" class="nav-btn p-2 rounded-xl flex flex-col md:flex-row items-center gap-1 md:gap-3 md:px-4 md:py-3 transition" :class="currentTab === 'report' ? 'text-primary md:bg-primary-light dark:md:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i class="fa-solid fa-chart-simple text-xl md:text-lg"></i><span class="text-[10px] md:text-sm font-bold">レポート</span>
                    </button>
                    <button @click="currentTab = 'settings'" class="nav-btn p-2 rounded-xl flex flex-col md:flex-row items-center gap-1 md:gap-3 md:px-4 md:py-3 transition" :class="currentTab === 'settings' ? 'text-primary md:bg-primary-light dark:md:bg-gray-700' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'">
                        <i class="fa-solid fa-gear text-xl md:text-lg"></i><span class="text-[10px] md:text-sm font-bold">設定</span>
                    </button>
                </div>
            </nav>

            <!-- Content Area -->
            <!-- forceStandbyがtrueの場合、force-landscapeクラスを適用 -->
            <main class="flex-1 h-full overflow-y-auto bg-gray-50 dark:bg-gray-900 p-4 md:p-8 pb-28 md:pb-8 order-1 md:order-2 relative transition-all duration-500"
                  :class="[
                      isActiveStandby ? 'fixed inset-0 z-[200] bg-black text-white p-0 overflow-hidden' : '',
                      forceStandby ? 'force-landscape' : ''
                  ]">
                
                <!-- 1. TIMER TAB -->
                <div v-if="currentTab === 'timer'" class="h-full flex flex-col transition-all duration-500"
                     :class="isActiveStandby ? 'justify-center items-center w-full' : 'max-w-4xl mx-auto pb-8'">
                    
                    <!-- Header (通常時のみ表示) -->
                    <header v-if="!isActiveStandby" class="mb-6 md:mb-10 flex justify-between items-center">
                        <h2 class="text-2xl font-bold">今日の学習</h2>
                        <div class="flex items-center gap-2">
                             <div class="text-sm font-mono text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-800 px-3 py-1 rounded-full shadow-sm border dark:border-gray-700">
                                {{ new Date().toLocaleDateString() }}
                            </div>
                        </div>
                    </header>

                    <div class="flex-1 flex flex-col gap-6 md:gap-12 items-center justify-center transition-all"
                         :class="!isActiveStandby ? 'md:flex-row md:items-start' : 'w-full h-full relative'">
                        
                        <!-- Left: Display Area -->
                        <div class="flex flex-col items-center justify-center relative transition-all duration-700"
                             :class="isActiveStandby ? 'w-full h-full scale-110' : 'w-full md:w-1/2 py-6 bg-white dark:bg-gray-800 md:bg-transparent md:dark:bg-transparent rounded-3xl md:rounded-none shadow-sm md:shadow-none border md:border-none border-gray-100 dark:border-gray-700'">
                            
                            <!-- Apple Standby Style UI -->
                            <div v-if="isActiveStandby" class="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none">
                                <div class="w-[80vw] h-[80vw] bg-gradient-to-tr from-primary/30 to-purple-500/30 rounded-full blur-3xl animate-pulse"></div>
                            </div>

                            <!-- Status Indicators -->
                            <div v-if="breakMode && isTimerRunning" 
                                 class="font-bold px-4 py-1.5 rounded-full text-sm animate-pulse z-10 uppercase tracking-widest"
                                 :class="isActiveStandby ? 'absolute top-12 text-green-400 bg-green-900/40 backdrop-blur-md' : 'absolute top-0 text-green-500 bg-green-50 dark:bg-green-900/30'">
                                <i class="fa-solid fa-mug-hot mr-2"></i>Break Time
                            </div>
                            <div v-else-if="timerMode === 'countdown' && isTimerRunning" 
                                 class="font-bold px-4 py-1.5 rounded-full text-sm z-10 uppercase tracking-widest"
                                 :class="isActiveStandby ? 'absolute top-12 text-blue-300 bg-blue-900/40 backdrop-blur-md' : 'absolute top-0 text-primary bg-primary-light dark:bg-gray-700'">
                                <i class="fa-solid fa-hourglass-half mr-2"></i>Timer
                            </div>
                            <div v-else-if="isPaused" 
                                 class="font-bold px-4 py-1.5 rounded-full text-sm animate-blink z-10 uppercase tracking-widest"
                                 :class="isActiveStandby ? 'absolute top-12 text-yellow-400 bg-yellow-900/40 backdrop-blur-md' : 'absolute top-0 text-yellow-500 bg-yellow-50 dark:bg-yellow-900/30'">
                                <i class="fa-solid fa-pause mr-2"></i>Paused
                            </div>

                            <!-- Subject Label -->
                            <p class="font-bold mb-2 transition-all z-10"
                               :class="isActiveStandby ? 'text-gray-400 text-3xl font-standby absolute bottom-12 left-12' : 'text-sm text-gray-500 dark:text-gray-400'">
                                {{ isTimerRunning || isPaused ? (breakMode ? 'REST' : currentSubject) : 'Study Total' }}
                            </p>
                            
                            <!-- MAIN TIMER DISPLAY -->
                            <div class="font-standby-clock font-bold tracking-tighter transition-all duration-300 leading-none select-none z-10" 
                                 :class="[
                                    breakMode ? 'text-green-500' : (isPaused ? 'text-yellow-500' : (isActiveStandby ? (isDarkMode ? 'text-white' : 'text-primary-light') : 'text-primary')),
                                    isActiveStandby ? 'text-[28vh] drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]' : 'text-7xl md:text-8xl mb-2'
                                 ]">
                                {{ formattedTime }}
                            </div>

                            <!-- REALTIME TOTAL DISPLAY (Standby時は右下に) -->
                            <div v-if="isTimerRunning || isPaused" class="flex flex-col items-center mt-2 z-10"
                                 :class="isActiveStandby ? 'absolute bottom-12 right-12 flex-row gap-3 mt-0' : ''">
                                <p class="font-mono font-bold transition-colors" 
                                   :class="isActiveStandby ? 'text-gray-400 text-3xl' : 'text-gray-400 dark:text-gray-500 text-lg'">
                                    <span class="text-xs mr-2 opacity-70">TOTAL</span>{{ currentTotalTimeFormatted }}
                                </p>
                            </div>
                            
                            <!-- Controls (Standby時は画面タップで表示/非表示も可能だが今回は下部に薄く) -->
                            <div v-if="isTimerRunning || isPaused" class="w-full max-w-sm flex gap-3 z-20 transition-opacity duration-300"
                                 :class="isActiveStandby ? 'absolute bottom-8 px-12 opacity-0 hover:opacity-100 focus-within:opacity-100' : 'mt-6'">
                                <button @click="stopTimer(false)" class="flex-1 py-6 text-white text-2xl font-bold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2"
                                    :class="breakMode ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600'">
                                    <i class="fa-solid fa-stop"></i><span v-if="!isActiveStandby">STOP</span>
                                </button>
                                <button v-if="!isPaused" @click="pauseTimer" class="flex-1 py-6 bg-yellow-400 hover:bg-yellow-500 text-white text-2xl font-bold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-pause"></i><span v-if="!isActiveStandby">PAUSE</span>
                                </button>
                                <button v-else @click="resumeTimer" class="flex-1 py-6 bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-play"></i><span v-if="!isActiveStandby">RESUME</span>
                                </button>
                            </div>

                             <!-- Exit Standby Button -->
                            <button v-if="isActiveStandby" @click="exitStandby" class="absolute top-8 right-8 text-white/30 hover:text-white z-50 text-2xl">
                                <i class="fa-solid fa-compress"></i>
                            </button>
                        </div>

                        <!-- Right: Buttons (スタンバイ時は非表示) -->
                        <div class="w-full md:w-1/2" v-if="!isActiveStandby && !isTimerRunning && !isPaused">
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4 mb-4">
                                <button v-for="sub in subjects" :key="sub" @click="handleSubjectClick(sub)"
                                    class="h-16 md:h-24 bg-white dark:bg-gray-800 border-2 border-primary-light dark:border-gray-600 hover:border-primary dark:hover:border-primary rounded-2xl font-bold text-gray-700 dark:text-gray-200 shadow-sm transition active:scale-95 flex flex-col items-center justify-center">
                                    <span class="text-lg">{{ sub }}</span>
                                    <span class="text-[10px] text-gray-400 font-normal md:mt-1">{{ timerMode === 'countdown' ? 'SET' : 'START' }}</span>
                                </button>
                            </div>

                            <button @click="openCountdownModal('休憩')" class="w-full mb-8 py-3 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 hover:bg-green-100 dark:hover:bg-green-900/40 text-green-600 dark:text-green-400 font-bold rounded-xl flex items-center justify-center gap-2 transition">
                                <i class="fa-solid fa-mug-hot"></i> 休憩タイマーをセット
                            </button>

                            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                                <div class="bg-gray-50 dark:bg-gray-700/50 px-5 py-3 border-b border-gray-100 dark:border-gray-700 text-xs font-bold text-gray-400 uppercase flex justify-between items-center">
                                    <span>本日の内訳</span>
                                </div>
                                <div class="p-2 max-h-60 overflow-y-auto">
                                    <div v-if="Object.keys(todayLog.subjects).length === 0" class="text-center py-6 text-gray-400 text-sm">記録なし</div>
                                    <div v-for="(time, sub) in todayLog.subjects" :key="sub">
                                        <div v-if="time > 0" class="flex justify-between items-center text-sm border-b border-gray-100 dark:border-gray-700 last:border-0 p-3 hover:bg-gray-50 dark:hover:bg-gray-700/50">
                                            <span class="font-medium text-gray-700 dark:text-gray-300">{{ sub }}</span>
                                            <span class="font-mono font-bold px-2 py-0.5 rounded text-gray-800 dark:text-gray-100" 
                                                  :class="sub==='休憩'?'bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-400':'bg-primary-light dark:bg-primary/20 text-primary dark:text-primary'">
                                                {{ formatSeconds(time) }}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Standby Buttons (Mobile Only) -->
                    <div v-if="isMobile && !isActiveStandby" class="fixed bottom-24 left-1/2 -translate-x-1/2 flex gap-3 z-30 w-full justify-center px-4">
                        <transition-group name="slide-up">
                            <button key="fs" @click="toggleFullscreen" class="bg-gray-800/90 dark:bg-gray-700/90 backdrop-blur text-white px-4 py-3 rounded-full shadow-lg hover:bg-gray-900 transition active:scale-95 text-xs font-bold flex items-center gap-2">
                                <i class="fa-solid" :class="isFullscreen ? 'fa-compress' : 'fa-expand'"></i>
                                <span>{{ isFullscreen ? '戻る' : '全画面' }}</span>
                            </button>
                            <!-- ★強制的横画面（スタンバイ）ボタン -->
                            <button key="sb" @click="toggleForceStandby" class="bg-indigo-600/90 backdrop-blur text-white px-4 py-3 rounded-full shadow-lg hover:bg-indigo-700 transition active:scale-95 text-xs font-bold flex items-center gap-2">
                                <i class="fa-solid fa-mobile-screen-button rotate-90"></i>
                                <span>横画面</span>
                            </button>
                        </transition-group>
                    </div>
                </div>

                <!-- 2. TODO TAB -->
                <div v-if="currentTab === 'tasks'" class="max-w-2xl mx-auto min-h-full pb-8">
                     <header class="mb-6 flex flex-wrap gap-4 justify-between items-end">
                        <h2 class="text-2xl font-bold">Todoリスト</h2>
                        <div class="flex gap-2 items-center">
                            <label class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400 cursor-pointer bg-white dark:bg-gray-800 px-3 py-1.5 rounded border dark:border-gray-700">
                                <input type="checkbox" v-model="showCompletedTasks" class="rounded text-primary">
                                完了済み
                            </label>
                        </div>
                    </header>
                    <div class="flex gap-2 mb-6">
                        <div class="relative flex-1">
                            <span class="absolute left-4 top-3.5 text-gray-400"><i class="fa-solid fa-plus"></i></span>
                            <input type="text" v-model="newTaskTitle" placeholder="タスクを入力..." 
                                   class="w-full border-none rounded-xl px-10 py-3.5 shadow-sm outline-none ring-1 ring-gray-200 dark:ring-gray-700 focus:ring-2 focus:ring-primary bg-white dark:bg-gray-800 dark:text-white transition"
                                   @keydown.enter="createTask">
                        </div>
                        <button @click="createTask({isComposing:false})" class="bg-primary text-white px-4 rounded-xl shadow hover:bg-primary-hover font-bold">追加</button>
                    </div>
                    <div class="space-y-3">
                        <div v-if="filteredTasks.length === 0" class="text-center py-12 text-gray-400 bg-white dark:bg-gray-800 rounded-xl border border-dashed border-gray-300 dark:border-gray-700">
                            タスクはありません
                        </div>
                        <div v-for="task in filteredTasks" :key="task.id" 
                             class="group bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-start gap-3 transition hover:shadow-md">
                            <input type="checkbox" :checked="task.status === 'completed'" @change="toggleTaskStatus(task)" class="mt-1.5 w-5 h-5 cursor-pointer accent-primary">
                            <input v-model="task.title" @blur="updateTaskTitle(task)" @keydown.enter="$event.target.blur()" class="flex-1 bg-transparent border-none outline-none text-sm p-0 focus:ring-0 text-gray-800 dark:text-gray-100" :class="{ 'completed-task': task.status === 'completed' }">
                            <button @click="deleteTask(task.id)" class="text-gray-300 hover:text-red-400 px-2 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                </div>

                <!-- 3. REPORT TAB -->
                <div v-if="currentTab === 'report'" class="max-w-5xl mx-auto min-h-full flex flex-col pb-8">
                    <header class="mb-6 flex justify-between items-center">
                        <h2 class="text-2xl font-bold">週間レポート</h2>
                        <div class="flex items-center bg-white dark:bg-gray-800 rounded-lg shadow-sm border dark:border-gray-700 p-1">
                            <button @click="shiftWeek(-7)" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-gray-500"><i class="fa-solid fa-chevron-left"></i></button>
                            <span class="px-4 text-sm font-bold">{{ weekRangeLabel }}</span>
                            <button @click="shiftWeek(7)" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-gray-500"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </header>
                    <div class="flex flex-col lg:flex-row gap-6 h-full">
                        <!-- Chart Section -->
                        <div class="w-full lg:w-2/3 flex flex-col gap-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-primary-light dark:border-gray-700">
                                    <div class="text-xs text-primary font-bold mb-1">Total Study</div>
                                    <div class="text-2xl font-bold text-gray-800 dark:text-white">{{ formatHours(weeklyTotal) }}<span class="text-xs text-gray-400 ml-1">時間</span></div>
                                </div>
                                <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-green-100 dark:border-gray-700">
                                    <div class="text-xs text-green-500 font-bold mb-1">Daily Avg</div>
                                    <div class="text-2xl font-bold text-gray-800 dark:text-white">{{ formatHours(weeklyTotal / 7) }}<span class="text-xs text-gray-400 ml-1">時間</span></div>
                                </div>
                            </div>

                                <canvas id="weeklyChart"></canvas>
                            </div>
                        </div>
                        
                        <!-- Daily Detail Section -->
                        <div class="w-full lg:w-1/3 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-0 flex flex-col overflow-hidden h-[500px]">
                            <div class="bg-gray-50 dark:bg-gray-700/50 px-5 py-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
                                <h3 class="font-bold text-gray-700 dark:text-gray-200">{{ selectedReportDate ? selectedReportDate.replace(/-/g, '/') + ' の詳細' : '日付を選択' }}</h3>
                                <div v-if="selectedReportDate && hasSessionData" class="text-xs text-primary bg-primary-light px-2 py-1 rounded">Timeline</div>

                            <div class="flex-1 overflow-y-auto p-4 relative">
                                <!-- ケース1: セッションデータがある場合（タイムラインチャート） -->
                                <div v-if="hasSessionData" class="h-full">
                                     <canvas id="dailyTimelineChart"></canvas>

                                <!-- ケース2: 古いデータのみの場合（リスト表示） -->
                                <div v-else-if="selectedReportDetail && Object.keys(selectedReportDetail).length > 0" class="space-y-3">
                                    <div class="text-xs text-gray-400 text-center mb-2">※詳細記録なし（合計のみ）</div>
                                    <div v-for="(time, sub) in selectedReportDetail" :key="sub" class="flex justify-between items-center border-b border-gray-100 dark:border-gray-700 pb-2">
                                        <span class="font-medium text-sm">{{ sub }}</span>

                                    </div>
                                    <div class="pt-4 mt-4 border-t border-gray-200 dark:border-gray-700 flex justify-between font-bold"><span>学習合計(休憩除く)</span><span>{{ formatSeconds(calculateDailyStudyTotal(selectedReportDetail)) }}</span></div>

                                <!-- ケース3: データなし -->

                <!-- 4. SETTINGS TAB -->
                <div v-if="currentTab === 'settings'" class="max-w-xl mx-auto min-h-full pb-8">
                    <header class="mb-6"><h2 class="text-2xl font-bold">設定</h2></header>

                    <!-- Edit Log -->
                    <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mb-6">
                        <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 font-bold text-sm bg-gray-50 dark:bg-gray-700/50 text-red-500">
                            <i class="fa-solid fa-eraser mr-2"></i>記録の修正
                        </div>
                        <div class="p-6">
                            <p class="text-xs text-gray-500 mb-4">ボタンで時間を簡単に増減できます（分単位）</p>
                            <div v-if="Object.keys(todayLog.subjects).length === 0" class="text-center text-gray-300 text-sm">本日の記録はありません</div>
                            <div v-else class="space-y-4">
                                <div v-for="(time, sub) in todayLog.subjects" :key="sub" class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 pb-2 border-b dark:border-gray-700 last:border-0">
                                    <span class="text-sm font-bold w-32 truncate">{{ sub }}</span>

                                        <button @click="updateSubjectTime(sub, 5)" class="px-2 py-1 bg-blue-50 dark:bg-blue-900/20 text-blue-600 text-xs rounded border border-blue-100 dark:border-blue-900 font-bold">+5</button>

                    <section class="space-y-3">
                         <button @click="logout" class="w-full bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-900 p-4 rounded-xl text-red-500 font-bold text-sm hover:bg-red-100 dark:hover:bg-red-900/40 transition">ログアウト</button>
                    </section>

            <!-- COUNTDOWN / BREAK MODAL -->
            <transition name="modal">
            <div v-if="showCountdownModal" class="fixed inset-0 z-[300] bg-black/60 flex items-center justify-center p-4">
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                    <h3 class="text-lg font-bold mb-4 text-center dark:text-white">
                        <i v-if="targetSubject==='休憩'" class="fa-solid fa-mug-hot text-green-500 mr-2"></i>
                        <i v-else class="fa-solid fa-clock text-primary mr-2"></i>
                        {{ targetSubject }}タイマー
                    </h3>
                    <div class="flex justify-center gap-2 mb-6">
                        <button @click="setCountdown(5)" class="px-4 py-3 bg-gray-50 dark:bg-gray-700 border dark:border-gray-600 rounded-lg font-bold hover:bg-gray-100 dark:hover:bg-gray-600">5分</button>
                        <button @click="setCountdown(25)" class="px-4 py-3 bg-gray-50 dark:bg-gray-700 border dark:border-gray-600 rounded-lg font-bold hover:bg-gray-100 dark:hover:bg-gray-600">25分</button>
                        <button @click="setCountdown(60)" class="px-4 py-3 bg-gray-50 dark:bg-gray-700 border dark:border-gray-600 rounded-lg font-bold hover:bg-gray-100 dark:hover:bg-gray-600">60分</button>
                    </div>
                     <div class="mb-6 flex items-center justify-center gap-2">
                        <button @click="adjustCustomTime(-1)" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold dark:text-white">-</button>
                        <div class="w-24 text-center">
                            <input type="number" v-model="customCountdownMin" class="w-full text-center border-b-2 border-primary text-xl font-bold outline-none bg-transparent dark:text-white" step="1">
                            <span class="text-xs text-gray-500">分</span>
                        </div>
                        <button @click="adjustCustomTime(1)" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold dark:text-white">+</button>
                    </div>
                    <div class="flex gap-2">
                        <button @click="showCountdownModal=false" class="flex-1 py-2 text-gray-500 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">キャンセル</button>
                        <button @click="startCountdownSession" class="flex-1 py-2 text-white rounded-lg font-bold shadow" :class="targetSubject==='休憩'?'bg-green-600 hover:bg-green-700':'bg-primary hover:bg-primary-hover'">開始</button>
                    </div>
                </div>
            </div>
            </transition>

            <!-- ALARM OVERLAY -->
            <div v-if="isAlarmRinging" 
                 class="fixed inset-0 z-[400] bg-black/80 flex flex-col items-center justify-center p-4 transition-colors duration-100"
                 :class="{ 'animate-flash-screen': notificationMode === 'flash' }">
                <div class="text-white text-6xl mb-8 animate-ring"><i class="fa-solid fa-bell"></i></div>
                <h2 class="text-white text-3xl font-bold mb-8">Time's Up!</h2>
                <button @click="stopAlarm" class="px-10 py-5 bg-white text-red-600 rounded-full font-bold text-xl shadow-2xl hover:scale-105 transition">
                    アラームを停止
                </button>
            </div>
        </template>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeSr9pQ-Ux59I_ofF4MQSQR3eWmDyj7GI",
            authDomain: "todolist-for-saikyo.firebaseapp.com",
            projectId: "todolist-for-saikyo",
            storageBucket: "todolist-for-saikyo.firebasestorage.app",
            messagingSenderId: "425031799316",
            appId: "1:425031799316:web:ef3d2ffa7fff2ad517cd01",
            measurementId: "G-RC6TXQ34KJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/tasks');

        const { createApp, ref, computed, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const user = ref(null);
                const isGuestMode = ref(false);
                const isAuthLoading = ref(true); 
                const accessToken = ref(null);
                const currentTab = ref('timer');
                
                // Mobile & Standby
                const isMobile = ref(false);
                const isFullscreen = ref(false);
                const isLandscape = ref(window.innerWidth > window.innerHeight);
                const forceStandby = ref(false); // ★強制横画面フラグ
                const wakeLock = ref(null); 
                const TIMER_STATE_KEY = 'studyMate_timer_state'; 

                const isDarkMode = ref(false);
                const notificationMode = ref('sound_vibrate');

                // Data
                const subjects = ref(["国語", "数学", "理科", "社会", "英語", "その他"]);
                // ★データ構造：total(互換用), subjects(互換用集計), sessions(詳細配列)
                const todayLog = ref({ total: 0, subjects: {}, sessions: [] });
                const tasks = ref([]);
                const newTaskTitle = ref("");
                const showCompletedTasks = ref(false);

                // Timer
                const timerMode = ref('countup');
                const isTimerRunning = ref(false);
                const isPaused = ref(false);
                const currentSubject = ref(null);
                const startTime = ref(0);
                const elapsedTime = ref(0);
                const countdownDuration = ref(0);
                const pauseStartTime = ref(0);
                const currentSessionStart = ref(0); // ★現在のセッション開始時刻
                let timerInterval = null;
                const breakMode = ref(false);
                
                // Modal & Alarm
                const showCountdownModal = ref(false);
                const targetSubject = ref(null);
                const customCountdownMin = ref(5);
                const isAlarmRinging = ref(false);
                
                // Report
                const reportWeekStart = ref(new Date()); 
                const weeklyTotal = ref(0);
                let chartInstance = null;
                let dailyTimelineChartInstance = null; // ★詳細チャート用インスタンス
                const selectedReportDate = ref(null);
                const selectedReportDetail = ref(null);
                const selectedReportSessions = ref([]); // ★選択日のセッション配列

                // Wake Lock
                const requestWakeLock = async () => {
                    try { if ('wakeLock' in navigator) wakeLock.value = await navigator.wakeLock.request('screen'); } catch (err) {}
                };
                const releaseWakeLock = async () => {
                    if (wakeLock.value) { await wakeLock.value.release(); wakeLock.value = null; }
                };

                // Resize & Orientation
                const checkLayout = () => { 
                    isMobile.value = window.innerWidth < 768; 
                    isLandscape.value = window.innerWidth > window.innerHeight;
                    if(isLandscape.value && isMobile.value && isFullscreen.value && currentTab.value === 'timer') {
                        forceStandby.value = false; // 物理的に横向きなら強制モードは不要
                    }
                };
                const toggleFullscreen = () => {
                    if (!document.fullscreenElement) document.documentElement.requestFullscreen().then(()=>{isFullscreen.value=true;}).catch(()=>{});
                    else document.exitFullscreen().then(()=>{isFullscreen.value=false;});
                };
                const toggleForceStandby = () => {
                    forceStandby.value = !forceStandby.value;
                    if(forceStandby.value) {
                         if(!document.fullscreenElement) toggleFullscreen();
                    }
                };
                const exitStandby = () => {
                    forceStandby.value = false;
                    if(document.fullscreenElement) document.exitFullscreen();
                };

                // ★スタンバイモード判定（物理横画面 or 強制横画面）
                const isActiveStandby = computed(() => {
                    if(currentTab.value !== 'timer') return false;
                    if(forceStandby.value) return true;
                    return isMobile.value && isFullscreen.value && isLandscape.value;
                });

                onMounted(() => {
                    checkLayout();
                    window.addEventListener('resize', checkLayout);
                    document.addEventListener('fullscreenchange', ()=> isFullscreen.value = !!document.fullscreenElement);
                    document.addEventListener('visibilitychange', () => { if(isTimerRunning.value && document.visibilityState === 'visible') requestWakeLock(); });

                    const guestFlag = localStorage.getItem('studyMate_isGuest');
                    if (guestFlag === 'true') { isGuestMode.value = true; loadTodayData(); }
                    
                    restoreTimerState();

                    onAuthStateChanged(auth, async (currentUser) => {
                        if (currentUser) {
                            isGuestMode.value = false;
                            user.value = currentUser;
                            await loadTodayData();
                        }
                        isAuthLoading.value = false;
                    });
                });

                const getTodayStr = () => new Date().toLocaleDateString('en-CA');
                
                const loadTodayData = async () => {
                    const d = getTodayStr();
                    try {
                        let data = {total:0, subjects:{}, sessions:[]};
                        if(isGuestMode.value) {
                            const raw = localStorage.getItem(`studyMate_log_${d}`);
                            if(raw) data = JSON.parse(raw);
                        } else if(user.value) {
                            const s = await getDoc(doc(db, "users", user.value.uid, "logs", d));
                            if(s.exists()) data = s.data();
                        }
                        // ★データ補完（古いデータにsessionsがない場合）
                        if(!data.subjects) data.subjects = {};
                        if(!data.sessions) data.sessions = [];
                        todayLog.value = data;
                    } catch(e) { todayLog.value = {total:0, subjects:{}, sessions:[]}; }
                };

                const saveData = async () => {
                    const d = getTodayStr();
                    const data = JSON.parse(JSON.stringify(todayLog.value));
                    if(isGuestMode.value) localStorage.setItem(`studyMate_log_${d}`, JSON.stringify(data));
                    else if(user.value) await setDoc(doc(db, "users", user.value.uid, "logs", d), data, {merge:true});
                };
                
                // Login/Logout (simplified for snippet)
                const login = async () => { try{await signInWithPopup(auth, provider);}catch(e){} };
                const logout = () => { signOut(auth); window.location.reload(); };
                const startGuest = () => { isGuestMode.value=true; localStorage.setItem('studyMate_isGuest','true'); loadTodayData(); };
                const hardReset = () => { if(confirm("リセット？")) { localStorage.clear(); window.location.reload(); }};

                // Timer Logic
                const handleSubjectClick = (sub) => {
                    if (timerMode.value === 'countdown') { targetSubject.value = sub; showCountdownModal.value = true; }
                    else startSession(sub, 'countup');
                };
                const startCountdownSession = () => { showCountdownModal.value = false; startSession(targetSubject.value, 'countdown', customCountdownMin.value * 60); };
                
                const startSession = (sub, mode, durationSec = 0) => {
                    currentSubject.value = sub;
                    breakMode.value = (sub === '休憩');
                    countdownDuration.value = durationSec;
                    
                    if (!startTime.value) startTime.value = Date.now();
                    currentSessionStart.value = Date.now(); // ★セッション開始時刻
                    elapsedTime.value = 0;
                    isTimerRunning.value = true;
                    isPaused.value = false;
                    requestWakeLock();

                    localStorage.setItem(TIMER_STATE_KEY, JSON.stringify({
                        subject: sub, mode: mode, duration: durationSec,
                        startTime: startTime.value, sessionStart: currentSessionStart.value, // ★保存
                        breakMode: breakMode.value, isPaused: false
                    }));
                    
                    if (timerInterval) clearInterval(timerInterval);
                    timerInterval = setInterval(() => {
                        elapsedTime.value = Math.floor((Date.now() - startTime.value) / 1000);
                        if (mode === 'countdown' && elapsedTime.value >= durationSec) stopTimer(true);
                    }, 1000);
                };

                const pauseTimer = () => {
                    clearInterval(timerInterval);
                    isPaused.value = true;
                    isTimerRunning.value = false;
                    pauseStartTime.value = Date.now();
                    
                    // ★一時停止時、ここまでのセッションを保存するか？
                    // 複雑さを避けるため、今回は「停止＝一旦セッション終了」として記録し、再開時に「新セッション」とするアプローチを取る
                    // これによりタイムラインが正確になる（勉強-休憩(Pause)-勉強 となる）
                    recordSessionLog(currentSessionStart.value, Date.now(), currentSubject.value);
                    
                    releaseWakeLock();
                    const saved = JSON.parse(localStorage.getItem(TIMER_STATE_KEY) || '{}');
                    saved.isPaused = true;
                    saved.pauseStartTime = pauseStartTime.value;
                    localStorage.setItem(TIMER_STATE_KEY, JSON.stringify(saved));
                };

                const resumeTimer = () => {
                    const now = Date.now();
                    const pausedDuration = now - pauseStartTime.value;
                    startTime.value += pausedDuration;
                    currentSessionStart.value = now; // ★再開＝新セッション開始として記録
                    
                    isPaused.value = false;
                    isTimerRunning.value = true;
                    requestWakeLock();

                    const saved = JSON.parse(localStorage.getItem(TIMER_STATE_KEY) || '{}');
                    saved.isPaused = false;
                    saved.startTime = startTime.value;
                    saved.sessionStart = currentSessionStart.value;
                    delete saved.pauseStartTime;
                    localStorage.setItem(TIMER_STATE_KEY, JSON.stringify(saved));

                    timerInterval = setInterval(() => {
                        elapsedTime.value = Math.floor((Date.now() - startTime.value) / 1000);
                        if (timerMode.value === 'countdown' && elapsedTime.value >= countdownDuration.value) stopTimer(true);
                    }, 1000);
                };

                const stopTimer = async (finished = false) => {
                    clearInterval(timerInterval);
                    const now = Date.now();
                    
                    // ★セッション記録
                    if(!isPaused.value) {
                        recordSessionLog(currentSessionStart.value, now, currentSubject.value);
                    }

                    isTimerRunning.value = false;
                    isPaused.value = false;
                    startTime.value = 0;
                    releaseWakeLock();
                    localStorage.removeItem(TIMER_STATE_KEY);
                    
                    await saveData(); // 全体保存

                    if (finished) isAlarmRinging.value = true;
                    elapsedTime.value = 0;
                    currentSubject.value = null;
                    breakMode.value = false;
                };

                // ★セッションをtodayLogに追加する関数
                const recordSessionLog = (startTs, endTs, sub) => {
                    const dur = Math.floor((endTs - startTs) / 1000);
                    if(dur <= 0) return;

                    // 1. セッション配列に追加
                    if(!todayLog.value.sessions) todayLog.value.sessions = [];
                    todayLog.value.sessions.push({
                        subject: sub,
                        start: startTs,
                        end: endTs,
                        duration: dur
                    });

                    // 2. 互換性のためにsubjects集計も更新
                    const oldVal = todayLog.value.subjects[sub] || 0;
                    todayLog.value.subjects[sub] = oldVal + dur;
                };

                const restoreTimerState = () => {
                    const saved = localStorage.getItem(TIMER_STATE_KEY);
                    if (!saved) return;
                    try {
                        const state = JSON.parse(saved);
                        if (state.isPaused) {
                            currentSubject.value = state.subject; breakMode.value = state.breakMode;
                            timerMode.value = state.mode; countdownDuration.value = state.duration;
                            startTime.value = state.startTime; pauseStartTime.value = state.pauseStartTime;
                            currentSessionStart.value = state.sessionStart || state.startTime; // 復帰
                            isPaused.value = true; isTimerRunning.value = false;
                            elapsedTime.value = Math.floor((state.pauseStartTime - state.startTime) / 1000);
                        } else {
                            // 実行中だった場合、ページリロードまでの時間は記録漏れになる可能性があるが、
                            // ここでは単純に再開させる。厳密には「リロード直前までの時間」を保存できていないが、許容範囲とする。
                            startTime.value = state.startTime;
                            startSession(state.subject, state.mode, state.duration);
                            currentSessionStart.value = state.sessionStart || Date.now(); // 補正
                        }
                    } catch (e) {}
                };

                // Report Logic
                const shiftWeek = (d) => { const n=new Date(reportWeekStart.value); n.setDate(n.getDate()+d); reportWeekStart.value=n; loadWeeklyReport(); };
                
                const loadWeeklyReport = async () => {
                    const start=new Date(reportWeekStart.value); start.setDate(start.getDate()-start.getDay()); reportWeekStart.value=new Date(start);
                    const dates=[]; const promises=[];
                    for(let i=0;i<7;i++){
                        const d=new Date(start); d.setDate(start.getDate()+i); const s=d.toLocaleDateString('en-CA'); dates.push(s);
                        if(isGuestMode.value){ 
                            const l=localStorage.getItem(`studyMate_log_${s}`); 
                            promises.push(Promise.resolve(l?JSON.parse(l):{total:0,subjects:{},sessions:[]})); 
                        }
                        else if(user.value) promises.push(getDoc(doc(db,"users",user.value.uid,"logs",s)).then(x=>x.exists()?x.data():{total:0,subjects:{},sessions:[]}));
                        else promises.push(Promise.resolve({total:0,subjects:{},sessions:[]}));
                    }
                    const data = await Promise.all(promises);
                    
                    // 合計時間の計算
                    const studyTotals = data.map(d => calculateDailyStudyTotal(d.subjects));
                    weeklyTotal.value = studyTotals.reduce((a,b)=>a+b,0);
                    
                    nextTick(()=>{
                        // 1. 週間バーチャート
                        const ctx = document.getElementById('weeklyChart');
                        if(ctx){
                            if(chartInstance) chartInstance.destroy();
                            chartInstance = new Chart(ctx,{
                                type:'bar',
                                data:{ labels:dates.map(d=>d.slice(5).replace('-','/')), datasets:[{label:'時間', data:studyTotals.map(s=>(s/3600).toFixed(1)), backgroundColor:'#2563eb', borderRadius:4}] },
                                options:{ 
                                    maintainAspectRatio:false, responsive:true, 
                                    onClick:(e,el)=>{
                                        if(el.length){
                                            const i=el[0].index;
                                            selectedReportDate.value=dates[i];
                                            selectedReportDetail.value=data[i].subjects;
                                            selectedReportSessions.value=data[i].sessions || []; // ★セッションデータもセット
                                            renderDailyTimeline(); // ★詳細チャート描画
                                        }
                                    },
                                    scales:{ y:{beginAtZero:true} }, plugins:{legend:{display:false}} 
                                }
                            });
                        }
                    });
                };

                // ★詳細タイムラインチャート描画機能
                const hasSessionData = computed(() => selectedReportSessions.value && selectedReportSessions.value.length > 0);
                
                const renderDailyTimeline = () => {
                    if (!hasSessionData.value) {
                        if(dailyTimelineChartInstance) dailyTimelineChartInstance.destroy();
                        return; 
                    }
                    
                    nextTick(() => {
                        const ctx = document.getElementById('dailyTimelineChart');
                        if (!ctx) return;
                        if (dailyTimelineChartInstance) dailyTimelineChartInstance.destroy();

                        // データの加工: Chart.jsの浮動棒グラフ用に変換
                        // x軸: 時間(0-24), y軸: 教科名
                        const rawSessions = selectedReportSessions.value;
                        
                        // 教科ごとのデータセットを作成するアプローチだと色が揃えやすい
                        // ユニークな教科リストを取得
                        const uniqueSubjects = [...new Set(rawSessions.map(s => s.subject))];
                        
                        // データセット構築
                        const datasets = uniqueSubjects.map((sub, index) => {
                            const subSessions = rawSessions.filter(s => s.subject === sub);
                            const data = subSessions.map(s => {
                                const start = new Date(s.start);
                                const end = new Date(s.end);
                                // 時間を数値(0.0 - 24.0)に変換
                                const startH = start.getHours() + start.getMinutes()/60;
                                let endH = end.getHours() + end.getMinutes()/60;
                                if(endH < startH) endH += 24; // 日跨ぎ対応（簡易）
                                return [startH, endH];
                            });

                            // 色の決定（簡易）
                            const colors = ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
                            const color = sub === '休憩' ? '#10b981' : colors[index % colors.length];

                            return {
                                label: sub,
                                data: data, // [[start, end], [start, end]]
                                backgroundColor: color,
                                barPercentage: 0.6
                            };
                        });

                        dailyTimelineChartInstance = new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: uniqueSubjects, // Y軸ラベル（indexAxis: 'y'のため）
                                datasets: datasets
                            },
                            options: {
                                indexAxis: 'y', // 横向き
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    x: {
                                        min: 0, max: 24,
                                        ticks: { stepSize: 3, callback: v => v + ':00' },
                                        grid: { color: isDarkMode.value ? '#374151' : '#e5e7eb' }
                                    },
                                    y: {
                                        stacked: true, // 同じ行に重ねない場合はfalseだが、今回は教科ごとに行を分けたいのでfalseが自然か？
                                        // 今回は labels に教科を指定しているので、データ構造としては
                                        // Dataset 1 (国語): Data [ [10, 11] (at index "国語") ]
                                        // という形にする必要がある。
                                        // しかしChart.jsの標準Barで[[start, end]]を使う場合、y軸ラベルとのマッピングが難しい。
                                        // シンプルに「すべてのセッションを1つのタイムライン」にするか、「教科ごとにレーンを分ける」か。
                                        // 教科ごとにレーンを分けるのが見やすい。
                                    }
                                },
                                plugins: {
                                    tooltip: {
                                        callbacks: {
                                            label: function(context) {
                                                const v = context.raw; // [start, end]
                                                const fmt = h => {
                                                    const hh = Math.floor(h);
                                                    const mm = Math.floor((h - hh) * 60).toString().padStart(2,'0');
                                                    return `${hh}:${mm}`;
                                                };
                                                return `${context.dataset.label}: ${fmt(v[0])} - ${fmt(v[1])}`;
                                            }
                                        }
                                    },
                                    legend: { display: false } // 凡例はスペース取るので非表示、Y軸ラベルで十分
                                }
                            }
                        });
                        
                        // 教科ごとにレーンを分けるためのデータ構造修正
                        // datasetsを1つにし、data内で {x: [start, end], y: "教科名"} の形式にする
                        const flatData = [];
                        rawSessions.forEach(s => {
                            const start = new Date(s.start);
                            const end = new Date(s.end);
                            const startH = start.getHours() + start.getMinutes()/60;
                            let endH = end.getHours() + end.getMinutes()/60;
                            if(endH < startH) endH += 24;
                            
                            flatData.push({
                                x: [startH, endH],
                                y: s.subject,
                                fillColor: s.subject === '休憩' ? '#10b981' : '#2563eb' // 色分けロジックが必要ならscriptable options
                            });
                        });
                        
                        dailyTimelineChartInstance.data = {
                            labels: uniqueSubjects,
                            datasets: [{
                                label: 'Timeline',
                                data: flatData,
                                backgroundColor: ctx => {
                                    const val = ctx.raw;
                                    if(!val) return '#2563eb';
                                    if(val.y === '休憩') return '#10b981'; // 緑
                                    // 教科名ハッシュで色を変えるなど
                                    const idx = uniqueSubjects.indexOf(val.y);
                                    const colors = ['#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#6366f1'];
                                    return colors[idx % colors.length];
                                },
                                barPercentage: 0.5
                            }]
                        };
                        dailyTimelineChartInstance.update();
                    });
                };

                const calculateDailyStudyTotal = (subs) => Object.entries(subs || {}).reduce((acc, [k, v]) => k !== '休憩' ? acc + v : acc, 0);
                const formatSeconds = (sec) => { const h=Math.floor(sec/3600).toString().padStart(2,'0'); const m=Math.floor((sec%3600)/60).toString().padStart(2,'0'); const s=(sec%60).toString().padStart(2,'0'); return `${h}:${m}:${s}`; };
                const formatHours = (sec) => (sec/3600).toFixed(1);
                
                const formattedTime = computed(() => {
                    const sec = (isTimerRunning.value || isPaused.value) ? 
                        (timerMode.value === 'countdown' || breakMode.value ? Math.max(0, countdownDuration.value - elapsedTime.value) : elapsedTime.value) 
                        : calculateDailyStudyTotal(todayLog.value.subjects);
                    return formatSeconds(sec);
                });
                
                const currentTotalTimeFormatted = computed(() => {
                    let total = calculateDailyStudyTotal(todayLog.value.subjects);
                    if (!breakMode.value && (isTimerRunning.value || isPaused.value)) total += elapsedTime.value;
                    return formatSeconds(total);
                });

                const filteredTasks = computed(() => { 
                    let t=tasks.value; if(!showCompletedTasks.value)t=t.filter(x=>x.status!=='completed'); 
                    return t.sort((a,b)=>a.status==='completed'?1:-1); 
                });
                const weekRangeLabel = computed(() => { 
                    const s=reportWeekStart.value; const e=new Date(s); e.setDate(s.getDate()+6); 
                    return `${s.getMonth()+1}/${s.getDate()} - ${e.getMonth()+1}/${e.getDate()}`; 
                });

                // Helper for Tasks (No change needed)
                const createTask = (e)=>{ if(e&&e.isComposing)return; if(!newTaskTitle.value.trim())return; tasks.value.unshift({id:Date.now(), title:newTaskTitle.value, status:'needsAction'}); newTaskTitle.value=""; };
                const toggleTaskStatus = (t)=>{ t.status=t.status==='completed'?'needsAction':'completed'; };
                const deleteTask = (id)=>{ tasks.value=tasks.value.filter(t=>t.id!==id); };
                const updateTaskTitle = ()=>{}; // Stub
                const updateSubjectTime = async (sub, d)=>{ 
                    const old=todayLog.value.subjects[sub]||0; 
                    const neo=Math.max(0, old+d*60);
                    todayLog.value.subjects[sub]=neo; 
                    await saveData(); 
                };
                const stopAlarm = ()=>{ isAlarmRinging.value=false; };

                return {
                    user, isGuestMode, isAuthLoading, login, startGuest, logout, hardReset, currentTab, subjects,
                    isTimerRunning, isPaused, timerMode, breakMode, handleSubjectClick, currentSubject, stopTimer, pauseTimer, resumeTimer, formattedTime, currentTotalTimeFormatted,
                    showCountdownModal, targetSubject, customCountdownMin, setCountdown, adjustCustomTime, startCountdownSession,
                    isAlarmRinging, stopAlarm, notificationMode,
                    tasks, newTaskTitle, showCompletedTasks, filteredTasks, createTask, deleteTask, toggleTaskStatus, updateTaskTitle,
                    weekRangeLabel, shiftWeek, loadWeeklyReport, weeklyTotal, formatHours, selectedReportDate, selectedReportDetail, calculateDailyStudyTotal,
                    updateSubjectTime, todayLog,
                    isMobile, isFullscreen, toggleFullscreen, toggleForceStandby, exitStandby, forceStandby, isActiveStandby,
                    hasSessionData // チャート表示切り替え用
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
